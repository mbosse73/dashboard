registriere({
  id:"kalender", nr:"06", nm:"Kalender",
  zahl:()=>DATEN.termine.length,
  suche(q){
    return DATEN.termine.filter(t=>t.titel.toLowerCase().includes(q)).map(t=>
      treff("Termin",t.titel,(t.d===HEUTE?"heute":"nächster Werktag")+" "+t.zeit
        +(t.anm?" · "+t.anm:""),"↵",()=>terminDialog(t)));
  },
  erfassen(d){
    const KA=planTage().map(iso);
    const geht = d.zeit && d.datum && KA.indexOf(d.datum)>=0;
    return [treff("Termin",d.titel,
      geht ? "am "+d.tag+" um "+d.zeit
           : (d.zeit ? "nur heute und am nächsten Werktag möglich" : "Uhrzeit fehlt"),"↵",
      ()=>{ if(!geht){ melde("Termine gibt es nur für die beiden Werktage"); return; }
        DATEN.termine.push({id:neueId("t"),d:d.datum,zeit:d.zeit,dauer:30,
          titel:d.titel,anm:"",kontakt:null});
        bewahre(); melde("Termin angelegt"); zeigeFlaeche("planner"); })];
  },
  flaeche(b){
    b.appendChild(abschnitt("Kalender","zwei Werktage"));
    b.appendChild(el("div","hinweis",
      "Termine sind an den aktuellen und den nächsten Werktag gebunden. Alles Weitere "
      +"gehört in eine Aufgabe — die trägt jedes Datum oder gar keines."));
    const g=el("div","tage");
    planTage().forEach(d=>{
      const key=iso(d), heute=key===HEUTE;
      const l=DATEN.termine.filter(t=>t.d===key).sort((x,y)=>toMin(x.zeit)-toMin(y.zeit));
      const s=el("div","tag");
      s.appendChild(el("div","tag-k",
        (heute?'<span class="h">heute</span>':"")
        +'<span class="d">'+TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()]+'</span>'
        +'<span class="sp"></span><span class="n">'+l.length+'</span>'));
      const tb=el("div","tag-b");
      if(!l.length) tb.appendChild(el("div","leer","Nichts geplant."));
      l.forEach(t=>{
        const n=el("button","tm",
          '<span class="u">'+esc(t.zeit)+'</span>'
          +'<span class="b"><span class="t">'+esc(t.titel)+'</span>'
          +'<span class="m">'+esc([t.anm,kname(t.kontakt)].filter(Boolean).join(" · "))
          +'</span></span><span class="w">'+esc(t.dauer)+' min</span>');
        n.setAttribute("aria-label","Termin bearbeiten: "+t.titel);
        n.onclick=()=>terminDialog(t);
        tb.appendChild(n);
      });
      s.appendChild(tb);
      const f=el("div","tagfuss");
      const neu=el("button","tat still","neuer Termin +");
      neu.onclick=()=>terminDialog(null,key);
      f.appendChild(neu); s.appendChild(f);
      g.appendChild(s);
    });
    b.appendChild(g);
  }
});
/* ===== ENDE kalender ===== */

/* Der Tag ist eine Auswahl aus genau zwei Werktagen, kein freies Datum.
   Damit kann ein Termin gar nicht erst irgendwo landen, wo ihn niemand
   sieht — die Regel steckt in der Maske statt in einer Prüfung dahinter.
   Die Liste wird bei jedem Öffnen neu gebaut, weil sich die beiden
   Werktage über Nacht verschieben. */
function tFelder(){
  const [d1,d2]=planTage();
  const nm=d=>TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()];
  return [
    {schl:"titel", nm:"Titel", art:"text", breit:true},
    /* Der Tag verortet den Termin überhaupt und trägt einen Hinweis —
       er steht breit. Uhrzeit und Dauer bilden darunter die Zeitspanne,
       wie in jedem Kalender. Die Dauer stand vorher neben dem Kontakt,
       mit dem sie nichts zu tun hat. */
    {schl:"d",     nm:"Tag", art:"auswahl", breit:true,
     optionen:[[iso(d1),nm(d1)],[iso(d2),nm(d2)]], sub:"Nur diese beiden Werktage."},
    {schl:"zeit",  nm:"Uhrzeit", art:"zeit"},
    {schl:"dauer", nm:"Dauer", art:"zahl", einheit:"Minuten"},
    {schl:"kontakt",nm:"Kontakt", art:"kontakt", breit:true},
    {schl:"anm",   nm:"Anmerkung", art:"mehrzeilig"}
  ];
}
const TLEER={id:null,d:null,zeit:"09:00",dauer:30,titel:"",anm:"",kontakt:null};

function terminDialog(t, tagVor, zeitVor){
  const neu=!t;
  const start=Object.assign({}, TLEER, t||{});
  if(neu){
    start.d=tagVor||iso(planTage()[0]);
    if(zeitVor) start.zeit=zeitVor;
  }
  dialog({
    art: neu?"Neuer Termin":"Termin bearbeiten",
    titel: w=>w.titel,
    felder: tFelder(),
    werte: start,
    merk: "<b>Termine gibt es nur für den aktuellen und den nächsten Werktag.</b> "
      +"Im Planner lassen sie sich zwischen beiden Tagen hin und her ziehen.",
    pruefe: w=>{
      if(!String(w.titel||"").trim()) return {schl:"titel",text:"Ohne Titel geht es nicht."};
      if(!w.zeit) return {schl:"zeit",text:"Ein Termin braucht eine Uhrzeit."};
      if(!w.d)    return {schl:"d",   text:"Ein Termin braucht einen Tag."};
      return null;
    },
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Der Termin verschwindet aus "
        +"dem Kalender und aus dem Planner. Auf Termine verweist nichts.",
      tun: w=>{ const i=DATEN.termine.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.termine.splice(i,1);
        bewahre(); male(); melde("Termin gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.dauer=Number(w.dauer)>0 ? Number(w.dauer) : 30;
      if(neu){ w.id=neueId("t"); DATEN.termine.push(w); }
      else { const z=DATEN.termine.find(x=>x.id===w.id);
        if(!z){ melde("Der Termin ist nicht mehr da."); male(); return; }
        Object.keys(TLEER).forEach(k=>{ if(k!=="id") z[k]=w[k]; }); }
      bewahre(); male(); melde(neu?"Termin angelegt":"Termin gespeichert");
    }
  });
}

/* ---------- 14 Jahreskalender ---------- */
/* Ganz eigener Bestand: DATEN.jahrestermine. Der Kalender (Modul 06)
   kennt ihn nicht, der Planner auch nicht — und dieses Modul zeigt
   umgekehrt keine Termine von dort. Das ist ausdruecklich so gewollt. */
const JK_LEER={id:null,von:null,bis:null,titel:"",kat:"urlaub"};
const JK_KAT={urlaub:"Urlaub", sonst:"Sonstiger Termin"};

let jkJahr=null, jkWahl=null, jkEntwurf=null, jkRumpf=null;

const jkTage=(j,m)=>new Date(j,m+1,0).getDate();
/* Beruehrt der Eintrag diesen Tag? Vergleich als Zeichenkette, weil
   ISO-Daten in dieser Form lexikographisch richtig sortieren. */
const jkAmTag=k=>DATEN.jahrestermine.filter(t=>k>=t.von && k<=t.bis);
const jkHat=(k,kat)=>jkAmTag(k).some(t=>t.kat===kat);

/* „3.–17. August“, ueber Monatsgrenzen „22. Dez – 3. Jan“ */
function jkSpanne(t){
  const [jv,mv,tv]=t.von.split("-").map(Number);
  const [jb,mb,tb]=t.bis.split("-").map(Number);
  if(t.von===t.bis) return tv+". "+MONL[mv-1];
  if(jv===jb && mv===mb) return tv+".–"+tb+". "+MONL[mv-1];
  return tv+". "+MONK[mv-1]+" – "+tb+". "+MONK[mb-1];
}

function jkOeffnen(tagVor){
  /* Was offen ist, macht Platz. Danach traegt sich das Fenster selbst
     in dlgOffen ein — so greifen Escape und der Klick daneben, ohne
     dass es eine zweite Mechanik dafuer braeuchte. */
  dialogZu();
  jkJahr=Number(HEUTE.slice(0,4));
  jkWahl=null; jkEntwurf=null;
  const s=el("div","schleier weit auf");
  const d=el("div","dlg weit");
  const k=el("div","dlg-k",
    '<span class="art">Jahreskalender</span><span class="sp"></span>');
  const zu=el("button","dlg-zu","×");
  zu.setAttribute("aria-label","Schließen"); zu.onclick=dialogZu;
  k.appendChild(zu);
  jkRumpf=el("div","dlg-b");
  d.append(k,jkRumpf);
  s.appendChild(d);
  s.onclick=ev=>{ if(ev.target===s) dialogZu(); };
  document.body.appendChild(s);
  dlgOffen=s;
  jkMalen();
  if(tagVor) jkWaehle(tagVor);
}

function jkMalen(){
  if(!jkRumpf) return;
  jkRumpf.innerHTML="";

  const kopf=el("div","jk-k");
  const zur=el("button","jpfeil",
    '<svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>');
  zur.setAttribute("aria-label","Ein Jahr zurück");
  zur.onclick=()=>{ jkJahr--; jkWahl=null; jkEntwurf=null; jkMalen(); };
  const vor=el("button","jpfeil",
    '<svg viewBox="0 0 20 20"><path d="m8 4 6 6-6 6"/></svg>');
  vor.setAttribute("aria-label","Ein Jahr vor");
  vor.onclick=()=>{ jkJahr++; jkWahl=null; jkEntwurf=null; jkMalen(); };
  kopf.append(zur, el("span","jahrzahl",String(jkJahr)), vor, el("span","sp"));
  const imJahr=DATEN.jahrestermine.filter(t=>t.von.slice(0,4)===String(jkJahr)
    || t.bis.slice(0,4)===String(jkJahr));
  kopf.appendChild(el("span","zahl", imJahr.length+" im Jahr · "
    +imJahr.filter(t=>t.kat==="urlaub").length+" Urlaube"));
  jkRumpf.appendChild(kopf);

  jkRumpf.appendChild(jkRaster());
  jkRumpf.appendChild(jkLegende());
  if(jkEntwurf) jkRumpf.appendChild(jkFelder());
}

function jkRaster(){
  const g=el("div","jahr");
  for(let m=0;m<12;m++){
    /* Die obersten Zeilen lassen ihre Blase nach unten aufklappen —
       nach oben liefe sie aus dem Fenster heraus. */
    const z=el("div","jz"+(m<3?" nachunten":""));
    z.appendChild(el("span","jm",MONK[m]));
    const laenge=jkTage(jkJahr,m);
    for(let t=1;t<=31;t++){
      if(t>laenge){ z.appendChild(el("span","jt keiner")); continue; }
      const key=jkJahr+"-"+p2(m+1)+"-"+p2(t);
      const d=new Date(jkJahr,m,t);
      const l=jkAmTag(key);
      const kl=["jt"];
      if(d.getDay()===0||d.getDay()===6) kl.push("we");
      if(key===HEUTE) kl.push("heute");
      if(key===jkWahl) kl.push("wahl");
      /* Beide Kategorien laufen unabhaengig voneinander durch, jede mit
         eigenen Rundungen. Sonst risse eine Spanne genau dort auf, wo
         die andere beginnt. */
      ["urlaub","sonst"].forEach(kat=>{
        if(!jkHat(key,kat)) return;
        kl.push(kat);
        const v=t>1      && jkHat(jkJahr+"-"+p2(m+1)+"-"+p2(t-1),kat);
        const n=t<laenge && jkHat(jkJahr+"-"+p2(m+1)+"-"+p2(t+1),kat);
        if(!v) kl.push(kat==="urlaub"?"u-anfang":"s-anfang");
        if(!n) kl.push(kat==="urlaub"?"u-ende":"s-ende");
      });
      const c=el("button",kl.join(" "),'<span class="n">'+t+'</span>');
      c.setAttribute("aria-label",TAGL[d.getDay()]+", "+t+". "+MONL[m]+" "+jkJahr
        +(l.length?" — "+l.map(x=>x.titel).join(", "):" — nichts eingetragen"));
      if(l.length){
        let h='<b>'+TAGK[d.getDay()]+", "+t+". "+MONL[m]+'</b>';
        l.forEach(x=>{ h+='<span class="e"><span class="w '+x.kat+'"></span>'
          +esc(x.titel)+' <em>'+esc(jkSpanne(x))+'</em></span>'; });
        c.appendChild(el("span","blase",h));
      }
      c.onclick=()=>jkWaehle(key);
      z.appendChild(c);
    }
    g.appendChild(z);
  }
  return g;
}

function jkLegende(){
  const l=el("div","legende");
  const probe=(kl,zkl,txt)=>{
    const p=el("span","lp");
    p.appendChild(el("span","pr"+(kl?" "+kl:""),
      '<span class="z'+(zkl?" "+zkl:"")+'">14</span>'));
    p.appendChild(document.createTextNode(txt));
    return p;
  };
  l.append(
    probe("urlaub u-anfang u-ende",null,"Urlaub"),
    probe("sonst s-anfang s-ende",null,"Sonstiger Termin"),
    probe("urlaub u-anfang u-ende sonst s-anfang s-ende",null,"Beides am selben Tag"),
    probe("heute","t","Heute"),
    probe(null,"blass","Wochenende"));
  return l;
}

/* Ein Klick auf einen belegten Tag oeffnet den vorhandenen Eintrag,
   auf einen leeren legt er an. Beides klappt im selben Fenster auf —
   dialog() schloesse das Fenster, weil es mit dialogZu() beginnt. */
function jkWaehle(key){
  const l=jkAmTag(key);
  jkWahl=key;
  jkEntwurf = l.length ? Object.assign({},l[0])
                       : Object.assign({},JK_LEER,{von:key,bis:key});
  jkMalen();
}
const jkNeuAm=key=>Object.assign({},JK_LEER,{von:key,bis:key});

function jkFelder(){
  const neu=!jkEntwurf.id;
  const kasten=el("div","einbau");
  const [j,m,t]=jkWahl.split("-").map(Number);
  const d=new Date(j,m-1,t);
  kasten.appendChild(el("div","k",
    '<span class="art">'+(neu?"Neuer Eintrag":"Eintrag bearbeiten")+'</span>'
    +'<span class="tag">'+TAGL[d.getDay()]+", "+t+". "+MONL[m-1]+" "+j+'</span>'));

  /* Liegen mehrere Eintraege auf dem Tag, muessen sie alle erreichbar
     sein — sonst laesst sich der zweite weder bearbeiten noch loeschen,
     und ein Loeschversuch traefe still den ersten. Derselbe Streifen
     traegt auch den Weg zu einem weiteren Eintrag am selben Tag. */
  const amTag=jkAmTag(jkWahl);
  if(amTag.length){
    const r=el("div","wahl");
    r.style.marginBottom="12px";
    amTag.forEach(t=>{
      const b=el("button",null,'<span class="pp '+t.kat+'"></span>'+esc(t.titel));
      b.setAttribute("aria-pressed",String(t.id===jkEntwurf.id));
      b.onclick=()=>{ jkEntwurf=Object.assign({},t); jkMalen(); };
      r.appendChild(b);
    });
    const nb=el("button",null,"+ Weiterer Eintrag");
    nb.setAttribute("aria-pressed",String(!jkEntwurf.id));
    nb.onclick=()=>{ jkEntwurf=jkNeuAm(jkWahl); jkMalen(); };
    r.appendChild(nb);
    kasten.appendChild(r);
  }

  const felder=[
    {schl:"titel",nm:"Titel",art:"text",breit:true},
    {schl:"von",  nm:"Von",  art:"datum"},
    {schl:"bis",  nm:"Bis",  art:"datum", sub:"Ein einzelner Tag: dasselbe Datum."}
  ];
  const raster=felderMalen(felder, jkEntwurf, null);
  kasten.appendChild(raster);

  /* Zwei Kategorien als Knoepfe statt als Klappliste: bei genau zwei
     Moeglichkeiten spart das den Zwischenschritt, und die Farbe steht
     gleich daneben. */
  const kf=el("div","dfeld breit",'<label>Kategorie</label>');
  const w=el("div","wahl");
  Object.keys(JK_KAT).forEach(k=>{
    const b=el("button",null,'<span class="pp '+k+'"></span>'+JK_KAT[k]);
    b.setAttribute("aria-pressed",String(jkEntwurf.kat===k));
    b.onclick=()=>{ jkEntwurf.kat=k; jkMalen(); };
    w.appendChild(b);
  });
  kf.appendChild(w);
  raster.appendChild(kf);

  const f=el("div","f");
  if(!neu){
    const lo=el("button","tat weg","Löschen");
    lo.onclick=()=>{
      const i=DATEN.jahrestermine.findIndex(x=>x.id===jkEntwurf.id);
      if(i>=0) DATEN.jahrestermine.splice(i,1);
      bewahre(); jkWahl=null; jkEntwurf=null; jkMalen(); male();
      melde("Eintrag gelöscht");
    };
    f.appendChild(lo);
  }
  f.appendChild(el("span","sp"));
  const ab=el("button","tat still","Abbrechen");
  ab.onclick=()=>{ jkWahl=null; jkEntwurf=null; jkMalen(); };
  const sp=el("button","tat","Speichern");
  sp.onclick=jkSpeichern;
  f.append(ab,sp);
  kasten.appendChild(f);
  return kasten;
}

function jkSpeichern(){
  const w=jkEntwurf;
  w.titel=String(w.titel||"").trim();
  if(!w.titel){ melde("Ohne Titel geht es nicht."); return; }
  if(!w.von){ melde("Ein Eintrag braucht ein Startdatum."); return; }
  /* Ein leeres oder verdrehtes Ende faengt der Eintrag selbst ab —
     sonst laege er in einer Spanne, die es nicht gibt, und waere im
     Raster nirgends zu sehen. */
  if(!w.bis || w.bis<w.von) w.bis=w.von;
  const neu=!w.id;
  if(neu){ w.id=neueId("j"); DATEN.jahrestermine.push(w); }
  else{
    const z=DATEN.jahrestermine.find(x=>x.id===w.id);
    if(!z){ melde("Der Eintrag ist nicht mehr da."); jkWahl=null; jkEntwurf=null; jkMalen(); return; }
    Object.keys(JK_LEER).forEach(k=>{ if(k!=="id") z[k]=w[k]; });
  }
  bewahre();
  jkJahr=Number(w.von.slice(0,4));
  jkWahl=null; jkEntwurf=null; jkMalen(); male();
  melde(neu?"Eintrag angelegt":"Eintrag gespeichert");
}

registriere({
  id:"jahr", nr:"14", nm:"Jahreskalender",
  zahl:()=>DATEN.jahrestermine.length,
  suche(q){
    return DATEN.jahrestermine
      .filter(t=>t.titel.toLowerCase().includes(q))
      .map(t=>treff("Jahreskalender",t.titel,
        JK_KAT[t.kat]+" · "+jkSpanne(t)+" "+t.von.slice(0,4),"↵",
        ()=>jkOeffnen(t.von)));

    b.appendChild(abschnitt("Jahreskalender","eigener Bestand"));

      +"Dieser Bestand steht für sich — er erscheint weder im Kalender noch im "
      +"Planner, und von dort erscheint hier nichts."));

    reihe.appendChild(imp);
    b.appendChild(reihe);

    if(!l.length) b.appendChild(el("div","leer",
      q ? "Keine Notiz passt zu „"+esc(nSuche)+"“." : "Noch keine Notiz."));
    l.forEach(n=>b.appendChild(notizZeile(n)));
  }

/* ===== ENDE notizen ===== */

const NLEER={id:null,art:"telefon",titel:"",d:null,zeit:"",kontakt:null,wer:"",text:""};
const notizWer=n=>kname(n.kontakt)||n.wer||"";
let nSuche="";

function nSuchfeld(){
  const s=el("div","msuche",'<span class="lupe">'+IK.lupe+'</span>');
  const i=el("input"); i.type="text"; i.value=nSuche;
  i.placeholder="Notizen durchsuchen — Titel, Text, Anrufer";
  i.setAttribute("aria-label","Notizen durchsuchen");
  i.oninput=()=>{ const st=i.selectionStart; nSuche=i.value; male();
    const n=document.querySelector(".msuche input");
    if(n){ n.focus(); n.setSelectionRange(st,st); } };
  s.appendChild(i);
  if(nSuche){ const w=el("button","weg","zurücksetzen");
    w.onclick=()=>{ nSuche=""; male(); }; s.appendChild(w); }
  return s;
}

/* Die Art ist ein Umschalter, kein Merkmal: Sie entscheidet, wie der
   Rest der Maske aussieht. Deshalb steht sie oben und breit. Eine
   allgemeine Notiz hat keinen Anrufer und keine Uhrzeit — dann bleiben
   vier Felder statt sieben, und das Datum nimmt die frei gewordene
   Hälfte der Zeile ein. */
const nurAnruf = w => w.art==="telefon";
function nFelder(){
  return [
    {schl:"titel", nm:"Titel", art:"text", breit:true},
    {schl:"art",   nm:"Art", art:"auswahl", breit:true, schaltet:true,
     optionen:[["telefon","Telefonnotiz"],["allgemein","Allgemeine Notiz"]]},
    {schl:"d",     nm:"Datum", art:"datum", breit:w=>!nurAnruf(w)},
    {schl:"zeit",  nm:"Uhrzeit", art:"zeit", nurWenn:nurAnruf},
    {schl:"kontakt",nm:"Anrufer", art:"kontakt", nurWenn:nurAnruf},
    {schl:"wer",   nm:"…oder frei eintragen", art:"text", nurWenn:nurAnruf},
    {schl:"text",  nm:"Text", art:"mehrzeilig"}
  ];
}

function notizDialog(n, vorbelegt, artVor){
  const neu=!n;
  const jetzt=new Date();
  const start=Object.assign({},NLEER,n||{});
  if(neu){
    start.titel=vorbelegt||"";
    start.art=artVor||"telefon";
    start.d=HEUTE;
    start.zeit=p2(jetzt.getHours())+":"+p2(jetzt.getMinutes());
    /* Datum und Uhrzeit stehen zusätzlich im Text. So wandern sie in die
       .md-Datei und stehen dort, wo man sie beim Lesen sucht. Beim späteren
       Ändern des Datumsfelds wird die Zeile bewusst nicht nachgeschrieben —
       sonst überschriebe sie, was von Hand angepasst wurde. */
    if(start.art==="telefon")
      start.text="**"+datumLang(start.d)+", "+start.zeit+"**\n\n";
  }
  dialog({
    art: neu?"Neue Notiz":"Notiz bearbeiten",
    titel: w=>w.titel,
    felder: nFelder(),
    werte: start,
    merk: v => v.art==="allgemein"
      ? "<b>Eine allgemeine Notiz hat keinen Anrufer und keine Uhrzeit.</b> Danach "
        +"wird deshalb nicht gefragt. Zurück auf „Telefonnotiz“ bringt die Felder wieder."
      : "<b>Neue Notizen sind Telefonnotizen</b> — das ist der häufigere Fall. Datum und "
        +"Uhrzeit stehen zusätzlich im Text, damit sie beim Ausleiten als <code>.md</code> "
        +"erhalten bleiben. Ein Anrufer kann aus der Kontaktliste kommen oder frei "
        +"eingetragen werden; wird beides gefüllt, gewinnt die Auswahl.",
    pruefe: w=>String(w.titel||"").trim()?null:{schl:"titel",text:"Ohne Titel geht es nicht."},
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Auf Notizen verweist nichts, "
        +"es bleibt nirgends etwas zurück. Vorher als <code>.md</code> ausleiten?",
      tun: w=>{ const i=DATEN.notizen.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.notizen.splice(i,1);
        bewahre(); male(); melde("Notiz gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.wer=String(w.wer||"").trim();
      if(w.kontakt) w.wer="";                  /* Auswahl schlägt Freitext */
      if(neu){ w.id=neueId("n"); DATEN.notizen.push(w); }
      else { const z=DATEN.notizen.find(x=>x.id===w.id);
        if(!z){ melde("Die Notiz ist nicht mehr da."); male(); return; }
        Object.keys(NLEER).forEach(s=>{ if(s!=="id") z[s]=w[s]; }); }
      bewahre(); male(); melde(neu?"Notiz angelegt":"Notiz gespeichert");
    }
  });
}

function notizZeile(n){
  const r=el("div","nz"+(n.art==="telefon"?" tel":""));
  const b=el("button","nz-b",
    '<span class="nz-k"><span class="nz-t">'+esc(n.titel)+'</span>'
    +'<span class="nz-a">'+(n.art==="telefon"?"Telefonnotiz":"Notiz")+'</span>'
    +(notizWer(n)?'<span class="nz-w">'+esc(notizWer(n))+'</span>':"")
    +'<span class="sp"></span>'
    +'<span class="nz-d">'+esc(datumLang(n.d)+(n.zeit?" · "+n.zeit:""))+'</span></span>'
    +'<span class="nz-v">'+mdMalen(n.text)+'</span>');
  b.setAttribute("aria-label","Notiz bearbeiten: "+n.titel);
  b.onclick=()=>notizDialog(n);

      notizAlsMd(n), "text/markdown");
    melde("Notiz ausgeleitet"); };
  r.appendChild(aus);
  return r;
}

/* ---------- Bookmarks: Adressen, Plätze, Gruppen ---------- */

/* Gespeichert wird die Adresse so, wie man sie liest: „github.com“.
   Zum Öffnen braucht der Browser ein Schema. Wer selbst eines angibt —
   mailto:, file: — meint es und bekommt es unverändert zurück. */
function mkUrl(u){
  const s=String(u||"").trim();
  return /^[a-z][a-z0-9+.-]*:/i.test(s) ? s : "https://"+s;
}
const mkNachUrl = t =>
  /^[a-z][a-z0-9+.-]*:\/\//i.test(t) || /^[^\s]+\.[a-z]{2,}(\/[^\s]*)?$/i.test(t);

function mkOeffne(m){
  if(!String(m.u||"").trim()){ melde(m.t+" hat keine Adresse"); return; }
  oeffneWeg(mkUrl(m.u), true);
  melde(m.t+" geöffnet");
}
/* Reihenfolge der Gruppen ist die Reihenfolge ihres ersten Bookmarks —
   keine Sortierung. Wer umsortieren will, verschiebt Einträge. */
const mkGruppen = () => [...new Set(MARKEN.map(m=>m.g))];
const mkPlatz = m => PINS.indexOf(m.id)>=0 ? " · ⌘"+(PINS.indexOf(m.id)+1) : "";

function mkZeile(m){
  const i=PINS.indexOf(m.id), an=i>=0;
  const r=el("div","z");
  /* Ein echter Knopf statt eines Klicks auf die Zeile: mit der Tastatur
     erreichbar, und der Zeiger sagt von selbst, dass es hier weitergeht. */
  const oeff=el("button","zb",'<span class="zt">'+esc(m.t)+'</span>'
    +'<span class="zm">'+esc(m.u)+'</span>');
  oeff.setAttribute("aria-label",m.t+" öffnen — "+m.u);
  oeff.onclick=()=>mkOeffne(m);
  /* Angeheftet trägt Tinte, weil der Platz dann belegt und benutzbar
     ist — kein Kategorieton, sondern „aktiv“. */
  const p=el("button", an?"tat":"tat still", an?"⌘"+(i+1):"anheften");
  p.setAttribute("aria-label",(an?"Anheftung lösen: ":"Anheften: ")+m.t);
  p.onclick=()=>mkHeften(m);
  const bx=el("button","tat still","bearbeiten");
  bx.setAttribute("aria-label",m.t+" bearbeiten");
  bx.onclick=()=>mkDialog(m);
  r.append(oeff,p,bx);
  return r;
}

function mkHeften(m){
  const i=PINS.indexOf(m.id);
  if(i>=0){ PINS.splice(i,1); bewahre(); male(); melde("Anheftung gelöst: "+m.t); return; }
  if(PINS.length>=8){ melde("Acht Plätze belegt — erst einen lösen"); return; }
  PINS.push(m.id); bewahre(); male();
  melde(m.t+" liegt auf ⌘"+PINS.length);
}

/* ---------- Der Bookmark-Dialog ----------
   Titel und Gruppe nebeneinander, die Adresse breit darunter. Das Feld
   für eine neue Gruppe steht direkt bei der Auswahl, die es hervorruft —
   näher an seinem Auslöser als an der Reihenfolge Was → Wann → Wer. */
const MKLEER={id:null,t:"",u:"",g:"",gneu:"",fest:false};
const MK_NEU="__neu";

function mkFelder(){
  return [
    {schl:"t", nm:"Titel", art:"text"},
    {schl:"g", nm:"Gruppe", art:"auswahl", schaltet:true,
     optionen: mkGruppen().map(g=>[g,g]).concat([[MK_NEU,"Neue Gruppe …"]])},
    {schl:"gneu", nm:"Name der neuen Gruppe", art:"text", breit:true,
     nurWenn: w=>w.g===MK_NEU},
    {schl:"u", nm:"Adresse", art:"text", breit:true,
     sub:"Ohne https:// genügt — das ergänzt sich beim Öffnen."},
    {schl:"fest", nm:"Auf die Leiste heften", art:"schalter",
     sub:"Belegt einen der acht Plätze ⌘1 bis ⌘8."}
  ];
}

function mkDialog(m, vorbelegt){
  const neu=!m;
  const start=Object.assign({}, MKLEER, m||{});
  if(neu){
    if(vorbelegt) start.u=vorbelegt;
    start.g=mkGruppen()[0]||MK_NEU;
  }
  start.fest = !neu && PINS.indexOf(m.id)>=0;
  dialog({
    art: neu ? "Neues Bookmark" : "Bookmark bearbeiten",
    titel: w=>String(w.t||"").trim()||String(w.u||"").trim(),
    felder: mkFelder(),
    werte: start,
    merk: "<b>Titel und Adresse sind Pflicht.</b> Die Adresse darf ohne Schema stehen; "
      +"beim Öffnen wird <code>https://</code> davorgesetzt. Wer <code>mailto:</code> oder "
      +"<code>file:</code> selbst angibt, bekommt es unverändert zurück.",
    pruefe: w=>{
      if(!String(w.t||"").trim()) return {schl:"t", text:"Ohne Titel geht es nicht."};
      if(!String(w.u||"").trim()) return {schl:"u", text:"Ohne Adresse geht es nicht."};
      if(w.g===MK_NEU && !String(w.gneu||"").trim())
        return {schl:"gneu", text:"Die neue Gruppe braucht einen Namen."};
      return null;
    },
    loeschen: neu ? null : {
      frage: w=>{
        const i=PINS.indexOf(m.id), letzte=MARKEN.filter(x=>x.g===m.g).length===1;
        return "<b>"+esc(String(w.t||"").trim()||m.t)+" wirklich löschen?</b><ul>"
          +"<li>Die Zeile verschwindet aus der Gruppe „"+esc(m.g)+"“.</li>"
          +"<li>"+(i>=0
            ? "Platz ⌘"+(i+1)+" wird frei; was dahinter liegt, rückt auf."
            : "Es ist nichts angeheftet, kein Platz ändert sich.")+"</li>"
          +(letzte ? "<li>Es ist das letzte in „"+esc(m.g)
            +"“ — die Gruppe verschwindet mit.</li>" : "")
          +"</ul>";
      },
      tun: ()=>mkLoeschen(m)
    },
    speichern: w=>mkSpeichern(w,neu)
  });
}

function mkSpeichern(w,neu){
  w.t=String(w.t||"").trim();
  w.u=String(w.u||"").trim();
  let g=String(w.g||"").trim();
  if(g===MK_NEU) g=String(w.gneu||"").trim();
  w.g=g||"Ohne Gruppe";
  delete w.gneu;
  const fest=!!w.fest; delete w.fest;

  if(neu){ w.id=neueId("m"); MARKEN.push(w); }
  else {
    /* An Ort und Stelle ändern, nicht austauschen — PINS und die Leiste
       zeigen auf dieses Objekt. */
    const z=MARKEN.find(x=>x.id===w.id);
    if(!z){ melde("Das Bookmark ist nicht mehr da."); male(); return; }
    ["t","u","g"].forEach(s=>{ z[s]=w[s]; });
  }
  const i=PINS.indexOf(w.id);
  let zusatz="";
  if(fest && i<0){
    if(PINS.length>=8) zusatz=" · acht Plätze belegt, nicht angeheftet";
    else { PINS.push(w.id); zusatz=" · liegt auf ⌘"+PINS.length; }
  } else if(!fest && i>=0){ PINS.splice(i,1); zusatz=" · Anheftung gelöst"; }
  bewahre(); male();
  melde(w.t+(neu?" angelegt":" gespeichert")+zusatz);
}

function mkLoeschen(m){
  const nm=m.t, i=PINS.indexOf(m.id);
  if(i>=0) PINS.splice(i,1);
  const j=MARKEN.indexOf(m);
  if(j>=0) MARKEN.splice(j,1);          /* splice, nie neu zuweisen */
  bewahre(); male();
  melde(nm+" gelöscht"+(i>=0?" · Platz ⌘"+(i+1)+" frei":""));
}

/* Eine Gruppe ist kein eigener Datensatz, sondern das Feld `g` an den
   Bookmarks. Umbenennen heißt deshalb: an allen ändern. Ein Löschen gibt
   es folgerichtig nicht — eine Gruppe verschwindet, wenn ihr letztes
   Bookmark geht oder umzieht. */
function mkGruppeDialog(g){
  const n=MARKEN.filter(m=>m.g===g).length;
  dialog({
    art:"Gruppe umbenennen",
    titel: w=>String(w.g||"").trim()||g,
    felder:[{schl:"g", nm:"Name der Gruppe", art:"text", breit:true}],
    werte:{g},
    merk:"Der Name ändert sich an "+(n===1?"dem einen Bookmark":"allen "+n+" Bookmarks")
      +" dieser Gruppe. Trägt man den Namen einer vorhandenen Gruppe ein, werden beide "
      +"zu einer — das ist der Weg, Gruppen zusammenzulegen.",
    pruefe: w=>String(w.g||"").trim() ? null
      : {schl:"g", text:"Ohne Namen geht es nicht."},
    speichern: w=>{
      const neu=String(w.g).trim();
      if(neu===g) return;
      const rein=mkGruppen().indexOf(neu)>=0;
      MARKEN.forEach(m=>{ if(m.g===g) m.g=neu; });
      bewahre(); male();
      melde(rein ? "„"+g+"“ in „"+neu+"“ aufgegangen"
                 : "Gruppe heißt jetzt „"+neu+"“");
    }
  });
}

/* Eine Instanz als Karte: Stand, Frist des aktiven Schritts, Fortschritt */
function wfKarte(w){
  const l=wfSchritte(w), i=wfIndex(w), f=wfFrist(w), spaet=wfSpaet(w);
  const k=el("div","karte");
  k.innerHTML='<div style="display:flex;align-items:baseline;gap:10px">'
    +'<span style="font-size:14.5px;font-weight:650">'+esc(w.titel)+'</span>'
    +'<span style="margin-left:auto;font-family:var(--etikett);font-size:11.5px;color:'
    +(spaet?"var(--signal)":"var(--ink3)")+'">'
    +(wfFertig(w) ? "abgeschlossen" : (f ? (spaet?"überfällig":frist({d:f})) : "ohne Frist"))
    +'</span></div>'
    +'<div style="font-size:12.5px;color:var(--ink3);margin-top:5px">'+esc(wfStand(w))
    +(w.werte.kontakt&&kfind(w.werte.kontakt)?" · "+esc(kname(w.werte.kontakt)):"")+'</div>';

  /* Fortschritt als Kette — zeigt sofort, wo der Ablauf steht */
  const kette=el("div");
  kette.style.cssText="display:flex;gap:3px;margin-top:10px";
  l.forEach((sch,j)=>{
    const lage=wfLage(w,sch.schl);
    const t=el("span");
    t.title=(j+1)+". "+sch.nm+" — "+({fertig:"erledigt",aktiv:"aktiv",
      spaet:"aktiv, überfällig",offen:"offen"}[lage]);
    t.style.cssText="flex:1;height:4px;border-radius:3px;background:"
      +({fertig:"var(--gut)",aktiv:"var(--tinte)",spaet:"var(--signal)",
         offen:"var(--raise)"}[lage]);
    kette.appendChild(t);
  });
  k.appendChild(kette);

  if(!wfFertig(w)){
    const t=el("button","tat still", i<l.length-1
      ? "Abschließen und weiter zu „"+l[i+1].nm+"“"
      : "Letzten Schritt abschließen");
    t.style.marginTop="10px";
    t.onclick=()=>{
      if(i<l.length-1){ w.aktiv=l[i+1].schl; melde("Jetzt aktiv: "+l[i+1].nm); }
      else { w.aktiv=null; melde("Vorgang abgeschlossen: "+w.titel); }
      bewahre(); male();
    };
    k.appendChild(t);
  }
  return k;
}

/* ===== ENDE rechner ===== */
function rechne(text){
  if(!/^[\d\s+\-*/().,%]+$/.test(text)) return null;
  if(!/[+\-*/%]/.test(text)) return null;
  try{
    const w=Function('"use strict";return ('+text.replace(/,/g,".")+')')();
    if(typeof w!=="number"||!isFinite(w)) return null;
    return Math.round(w*1e6)/1e6;
  }catch(e){ return null; }
}

let vorlage=null;

/* ============================================================
   5 — DEUTUNG DER EINGABE
   ============================================================ */
const KUERZEL={so:0,mo:1,di:2,mi:3,"do":4,fr:5,sa:6};
function deuten(text){
  let rest=" "+text+" ";
  const o={};
  if(/(^|\s)\?(\s|$)/.test(rest)){ o.nach=true; rest=rest.replace(/(^|\s)\?(\s|$)/," "); }
  const p=rest.match(/\s@(\S+)/); if(p){ o.person=p[1]; rest=rest.replace(p[0]," "); }
  let z=rest.match(/\s(\d{1,2}):(\d{2})(\s|$)/);
  if(z){ o.zeit=p2(+z[1])+":"+z[2]; rest=rest.replace(z[0]," "); }
  const t=rest.match(/\s(heute|übermorgen|uebermorgen|morgen|mo|di|mi|do|fr)(\s|$)/i);
  if(t){ const w=t[1].toLowerCase(); const h=new Date(); h.setHours(0,0,0,0); let ziel;
    if(w==="heute"){ ziel=h; o.tag="heute"; }
    else if(w==="übermorgen"||w==="uebermorgen"){ ziel=new Date(h);
      ziel.setDate(ziel.getDate()+2); o.tag="übermorgen"; }
    else if(w==="morgen"){ ziel=new Date(h); ziel.setDate(ziel.getDate()+1); o.tag="morgen"; }
    else { ziel=new Date(h); let diff=(KUERZEL[w]-ziel.getDay()+7)%7; if(!diff) diff=7;
      ziel.setDate(ziel.getDate()+diff); o.tag=TAGL[KUERZEL[w]]; }
    o.datum=iso(ziel); rest=rest.replace(t[0]," "); }
  if(o.zeit && !o.datum){ o.datum=iso(planTage()[0]); o.tag="heute"; }
  o.titel=rest.replace(/\s+/g," ").trim();
  return o;
}

/* ============================================================
   6 — DIE LEISTE
   Leer heißt nicht leer: ohne Eingabe stehen hier Überfälliges,
   der nächste Termin und die angehefteten Bookmarks.
   ============================================================ */
let eingabe="", treffer=[], zeiger=-1;

function ueberfaellig(){
  /* Termine mit vergangenem Datum waren vorher nirgends mehr zu
     sehen: der Planner zeigt nur die beiden Werktage, der Vorrat
     nur Aufgaben. Sie standen noch in den Daten, aber unsichtbar.
     Jetzt tauchen sie hier auf und lassen sich zurückholen. */
  const [d1,d2]=planTage(), k1=iso(d1), k2=iso(d2);
  return [].concat(
    /* Termine kennen kein „erledigt“ — ein vergangener Termin ist vorbei,
       nicht abgehakt. Er lässt sich hier nur zurückholen oder löschen. */
    DATEN.termine.filter(t=>t.d && t.d!==k1 && t.d!==k2)
      .map(t=>({typ:"Termin",obj:t,titel:t.titel,verschieben:t,
        m:"war am "+t.d+" um "+t.zeit+(t.anm?" · "+t.anm:"")})),
    DATEN.aufgaben.filter(istSpaet).map(a=>({typ:"Aufgabe",obj:a,titel:a.titel,
      m:(a.notiz||"")+(a.kontakt?" · "+kname(a.kontakt):"")})),
    WORKFLOWS.filter(wfSpaet).map(w=>({typ:"Workflow",obj:w,titel:w.titel,
      m:wfStand(w)}))
  );
}
function naechsterTermin(){
  const n=nowMin();
  return DATEN.termine.filter(t=>t.d===HEUTE && toMin(t.zeit)+t.dauer>n)
    .sort((a,b)=>toMin(a.zeit)-toMin(b.zeit))[0]||null;
}

function leisteMalen(rumpf){
  const b=el("div","mitte");
  const s=el("div","schwelle");
  const f=el("div","feld",'<span class="c">›</span>'
    +'<input id="q" type="text" autocomplete="off" spellcheck="false" '
    +'placeholder="Tippen — suchen, rechnen, erfassen" aria-label="Suchen oder erfassen">'
    +'<span class="k">ESC leert</span>');
  s.appendChild(f); b.appendChild(s);
  const erg=el("div"); erg.id="erg"; b.appendChild(erg);
  rumpf.appendChild(b);
  const q=$("#q"); q.value=eingabe;
  q.addEventListener("input",e=>{ eingabe=e.target.value; suchen(); });
  suchen();
  setTimeout(()=>q.focus(),20);
}

function suchen(){
  const erg=$("#erg"); if(!erg) return;
  erg.innerHTML=""; treffer=[]; zeiger=-1;
  const roh=eingabe.trim(), q=roh.toLowerCase();

  if(!roh){ ruhezustand(erg); return; }

  const rz=rechne(roh);
  if(rz!==null) erg.appendChild(el("div","rechner",'<div class="frage">'+esc(roh)+' =</div>'
    +'<div class="zahl">'+String(rz).replace(".",",")+'</div>'));

  /* Jedes Modul wird gefragt — die Leiste kennt keines beim Namen */
  MODULE.forEach(m=>{ if(m.suche) (m.suche(q,roh)||[]).forEach(t=>zeigeTreffer(erg,t)); });

  if(roh.length>=3){
    const d=deuten(roh);
    if(d.titel){
      erg.appendChild(abschnitt("Erfassen",null));
      MODULE.forEach(m=>{ if(m.erfassen) (m.erfassen(d)||[]).forEach(t=>zeigeTreffer(erg,t)); });
      zeigeTreffer(erg,treff("Kopieren",d.titel,"in die Zwischenablage","↵",
        ()=>melde("Kopiert: "+d.titel)));
    }
  }
  if(!treffer.length) erg.appendChild(el("div","leer","Nichts gefunden."));
  zeiger=treffer.length?0:-1; markiere();
}
function zeigeTreffer(box,t){
  const n=el("button","tr",'<span class="tr-a">'+esc(t.art)+'</span>'
    +'<span class="tr-b"><span class="tr-t">'+esc(t.titel)+'</span>'
    +(t.meta?'<span class="tr-m">'+esc(t.meta)+'</span>':'')+'</span>'
    +'<span class="tr-k">'+esc(t.taste)+'</span>');
  n.onclick=()=>{ t.fn(); if(t.bleibt) suchen(); else { eingabe=""; male(); } };
  box.appendChild(n); treffer.push(n);
}
function markiere(){
  treffer.forEach((n,i)=>n.classList.toggle("wahl",i===zeiger));
  if(zeiger>=0&&treffer[zeiger]) treffer[zeiger].scrollIntoView({block:"nearest"});
}

function ruhezustand(box){
  const sp=ueberfaellig();
  if(sp.length){
    box.appendChild(abschnitt("Überfällig",String(sp.length),"eilig"));
    sp.forEach(x=>{
      const r=zeile(x.obj,{titel:x.titel,meta:x.typ+" · "+x.m,
        rechts:x.verschieben?"":"überfällig",k:"eilig",hakbar:x.typ==="Aufgabe"});
      if(x.verschieben){
        const t=el("button","tat still","auf heute holen");
        t.onclick=ev=>{ ev.stopPropagation();
          x.verschieben.d=iso(planTage()[0]); bewahre(); male();
          melde('"'+x.titel+'" liegt jetzt auf heute'); };
        r.appendChild(t);
        /* Der zweite Weg heraus. Termine kennen kein Abhaken, also
           bleibt nur zurückholen oder löschen — sonst stünde ein
           vergangener Termin hier für immer. */
        const w=el("button","tat weg","löschen");
        w.onclick=ev=>{ ev.stopPropagation(); terminDialog(x.verschieben); };
        w.style.marginLeft="4px";
        r.appendChild(w);
      }
      box.appendChild(r);
    });
  }
  const nt=naechsterTermin();
  box.appendChild(abschnitt(nt?"Als Nächstes":"Heute",null,"jetzt"));
  const w=el("div");
  if(nt){
    const diff=toMin(nt.zeit)-nowMin();
    w.innerHTML='<div class="naechst-t">'+esc(nt.titel)+'</div><div class="naechst-m">'
      +esc((nt.anm||"")+(nt.kontakt?" · "+kname(nt.kontakt):"")+" · "
      +(diff>0?"in "+diff+" Minuten":"läuft gerade"))+'</div>';
  } else w.innerHTML='<div class="naechst-t">Kein Termin mehr.</div>'
    +'<div class="naechst-m">Der Rest des Tages gehört dir.</div>';
  box.appendChild(w);

  /* Favoriten stehen zwischen dem nächsten Termin und den Bookmarks:
     erst was drängt, dann wen man am häufigsten braucht, dann der Rest. */
  const favK=KONTAKTE.filter(k=>k.fav).sort(nachNachnamen);
  /* Der Schmierzettel steht hier, weil die Leiste von oben nach unten
     von „drängt“ zu „liegt bereit“ geht — und er das Einzige ist, in
     das man schreibt. Derselbe Text steht groß im Modul Notizen. */
  const sa=abschnitt("Schmierzettel",null);
  const zumModul=el("button","n","Notizen ›");
  zumModul.onclick=()=>zeigeFlaeche("notizen"); sa.appendChild(zumModul);
  box.appendChild(sa);
  box.appendChild(schmierKlein());

  const fa=abschnitt("Favoriten",null);
  const alleK=el("button","n","alle "+KONTAKTE.length+" ›");
  alleK.onclick=()=>zeigeFlaeche("kontakte"); fa.appendChild(alleK);
  box.appendChild(fa);
  if(favK.length) box.appendChild(kachelraster(favK));
  else box.appendChild(el("div","leer",
    "Noch kein Favorit. Im Modul Kontakte den Stern auf einer Kachel setzen — "
    +"dann steht der Kontakt hier."));

  const a=abschnitt("Bookmarks",null);
  const alle=el("button","n","alle "+MARKEN.length+" ›");
  alle.onclick=()=>zeigeFlaeche("marken"); a.appendChild(alle);
  box.appendChild(a);
  const g=el("div","marken");
  PINS.forEach((id,i)=>{
    const m=MARKEN.find(x=>x.id===id); if(!m) return;
    const n=el("button","mk",'<b>⌘'+(i+1)+'</b><span>'+esc(m.t)+'</span>');
    n.setAttribute("aria-label",m.t+" öffnen — "+m.u);
    n.onclick=()=>mkOeffne(m); g.appendChild(n);
  });
  if(!PINS.length) g.appendChild(el("div","leer",
    "Nichts angeheftet. Im Modul Bookmarks „anheften“ legt einen Eintrag hierher."));
  box.appendChild(g);

  box.appendChild(abschnitt("Module",MODULE.filter(m=>!m.versteckt).length+" angemeldet"));
  box.appendChild(el("div","hinweis",
    "Diese Liste erzeugt sich aus dem Register. Ein neues Modul erscheint hier von selbst."));
  const ml=el("div","modliste");
  MODULE.filter(m=>!m.versteckt).sort((a,b)=>a.nr<b.nr?-1:1).forEach(m=>{
    const n=el("button","ml",'<b>'+esc(m.nr)+'</b><span>'+esc(m.nm)+'</span>'
      +(m.zahl?'<em>'+m.zahl()+'</em>':'')
      +(m.geruest?'<em class="gz"'+(m.zahl?'':' style="margin-left:auto"')
        +' title="'+esc(m.geruest)+'">Gerüst</em>':''));
    n.onclick=()=> m.flaeche ? zeigeFlaeche(m.id) : melde(m.nm+" — keine eigene Fläche");
    ml.appendChild(n);
  });
  box.appendChild(ml);
  const pl=el("button","ml",'<b>07</b><span>Planner öffnen</span><em>⌘P</em>');
  pl.onclick=()=>zeigeFlaeche("planner");
  ml.appendChild(pl);
}

/* ============================================================
   7 — DER PLANNER
   ============================================================ */
let zieht=null;

/* Rund und ohne Beschriftung — deshalb trägt er seinen Namen in
   aria-label und title. Das Plus ist Inline-SVG mit stroke, kein
   Schriftzeichen: Ein gesetztes „+“ sitzt je nach Schrift anders in der
   Zeile und zentriert sich in einem Kreis nie sauber. */
function plusKnopf(name, tun){
  const n=el("button","sp-neu",
    '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.6v8.8M2.6 7h8.8"/></svg>');
  n.setAttribute("aria-label",name); n.title=name;
  n.onclick=e=>{ e.stopPropagation(); tun(); };
  return n;
}

function plannerMalen(rumpf){
  rumpf.classList.add("keinScroll");
  const box=el("div","planer");
  const [d1,d2]=planTage();

  const v=el("div","spalte vorrat");
  const offen=DATEN.aufgaben.filter(a=>!a.fertig && (!a.d || (a.d!==iso(d1)&&a.d!==iso(d2))));
  const vk=el("div","sp-k",'<div class="sp-d">Nicht eingeplant</div>');
  const vn=el("div","sp-n","Aufgaben <em>"+offen.length+"</em>");
  vn.appendChild(plusKnopf("Neue Aufgabe anlegen", ()=>aufgabeDialog(null,"todo")));
  vk.appendChild(vn); v.appendChild(vk);
  const vb=el("div","sp-b");
  if(!offen.length) vb.appendChild(el("div","leer","Alles eingeplant."));
  offen.forEach(a=>vb.appendChild(vorratZeile(a)));
  const wfs=WORKFLOWS.filter(wfSpaet);
  if(wfs.length){
    vb.appendChild(abschnitt("Workflows überfällig",String(wfs.length),"eilig"));
    vb.appendChild(el("div","hinweis","Nur zur Information, nicht planbar."));
    wfs.forEach(w=>{
      const n=el("div","wf",'<div class="t">'+esc(w.titel)+'</div>'
        +'<div class="m">'+esc(wfStand(w))+'</div>');
      n.onclick=()=>zeigeFlaeche("workflows");
      vb.appendChild(n);
    });
  }
  v.appendChild(vb);
  v.addEventListener("dragover",e=>{ if(zieht&&zieht.kat) e.preventDefault(); });
  v.addEventListener("drop",e=>{ e.preventDefault();
    if(!zieht||!zieht.kat) return;
    zieht.zeit=null; zieht.d=null; bewahre();
    melde('"'+zieht.titel+'" zurück in die Aufgabenliste'); zieht=null; male(); });
  box.appendChild(v);

  [d1,d2].forEach((d,i)=>{
    const key=iso(d), heute=key===HEUTE;
    const s=el("div","spalte"+(heute?" heute":""));
    const termine=DATEN.termine.filter(t=>t.d===key);
    const aufg=DATEN.aufgaben.filter(a=>a.d===key);
    const sk=el("div","sp-k",
      '<div class="sp-d">'+(heute?"Heute":(i===0?"Nächster Werktag":"Danach"))+'</div>');
    const sn=el("div","sp-n",TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()]
      +'<em>'+(termine.length+aufg.length)+'</em>');
    /* Vorbelegt wird die nächste volle Stunde — aber nur heute. An einem
       künftigen Tag gibt es kein „jetzt“, dort ist 09:00 der Anfang. */
    const start=()=>{
      if(!heute) return "09:00";
      const h=Math.ceil((nowMin()+1)/60);
      return p2(Math.min(Math.max(h,7),18))+":00";
    };
    sn.appendChild(plusKnopf("Neuen Termin an diesem Tag anlegen",
      ()=>terminDialog(null,key,start())));
    sk.appendChild(sn); s.appendChild(sk);
    const b=el("div","sp-b");
    const ohne=aufg.filter(a=>!a.zeit);
    if(ohne.length){
      b.appendChild(el("div","hinweis","Für diesen Tag fällig, ohne Uhrzeit — "
        +"auf eine Stunde ziehen."));
      ohne.forEach(a=>b.appendChild(vorratZeile(a)));
    }
    const raster=el("div","raster");
    for(let h=7;h<=18;h++){
      const st=el("div","stunde");
      st.appendChild(el("span","st-t",p2(h)+":00"));
      const lane=el("div","st-l");
      termine.filter(t=>toMin(t.zeit)>=h*60&&toMin(t.zeit)<(h+1)*60).forEach(t=>
        lane.appendChild(block(t,"termin",t.zeit+(t.anm?" · "+t.anm:"")
          +(t.kontakt?" · "+kname(t.kontakt):""))));
      aufg.filter(a=>a.zeit&&toMin(a.zeit)>=h*60&&toMin(a.zeit)<(h+1)*60).forEach(a=>
        lane.appendChild(block(a,"aufgabe","Aufgabe · "+a.zeit)));
      /* Klick in eine freie Stunde legt dort einen Termin an, Tag und
         Uhrzeit aus der angeklickten Stelle. Nur wenn der Klick die
         Fläche selbst trifft: Ein Block darin hat seinen eigenen Klick,
         der sonst zusätzlich einen neuen Termin anlegte. */
      lane.onclick=e=>{ if(e.target===lane) terminDialog(null,key,p2(h)+":00"); };
      lane.title="Klicken: neuer Termin um "+p2(h)+":00";
      st.appendChild(lane);
      st.addEventListener("dragover",e=>{ if(!zieht) return; e.preventDefault();
        st.classList.add("ziel"); });
      st.addEventListener("dragleave",()=>st.classList.remove("ziel"));
      st.addEventListener("drop",e=>{ e.preventDefault(); st.classList.remove("ziel");
        if(!zieht) return;
        zieht.d=key; zieht.zeit=p2(h)+":00"; bewahre();
        melde('"'+zieht.titel+'" auf '+TAGL[d.getDay()]+" "+p2(h)+":00");
        zieht=null; male(); });
      raster.appendChild(st);
    }
    if(heute){
      const n=nowMin();
      if(n>=7*60&&n<=19*60){
        const l=el("div","jetztlinie","<span>"+p2(new Date().getHours())+":"
          +p2(new Date().getMinutes())+"</span>");
        l.style.top=((n-7*60)/60*44)+"px"; raster.appendChild(l);
      }
    }
    b.appendChild(raster); s.appendChild(b); box.appendChild(s);
  });
  rumpf.appendChild(box);
}
function block(x,art,meta){
  const n=el("div","blk "+art+(istSpaet(x)?" spaet":"")+(x.fertig?" fertig":""));
  n.draggable=true;
  /* Nur Aufgaben lassen sich abhaken. Termine kennen kein „erledigt“ —
     ein vergangener Termin ist vorbei, nicht abgearbeitet. */
  if(art==="aufgabe"){
    const kast=el("button","kast");
    kast.innerHTML='<svg viewBox="0 0 12 12"><path d="M2 6.2 4.6 9 10 3"/></svg>';
    kast.setAttribute("aria-label",(x.fertig?"Wieder öffnen: ":"Erledigen: ")+x.titel);
    kast.onclick=e=>{ e.stopPropagation(); x.fertig=!x.fertig; bewahre(); male();
      melde(x.fertig?"Abgehakt: "+x.titel:"Wieder offen: "+x.titel); };
    n.appendChild(kast);
  }
  n.appendChild(el("span","blk-b",
    '<span class="t">'+esc(x.titel)+'</span><span class="m">'+esc(meta)+'</span>'));
  n.setAttribute("role","button"); n.tabIndex=0;
  n.setAttribute("aria-label",(art==="termin"?"Termin":"Aufgabe")+" bearbeiten: "+x.titel);
  const auf=()=> art==="termin" ? terminDialog(x) : aufgabeDialog(x);
  n.onclick=auf;
  n.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); auf(); } };
  n.addEventListener("dragstart",()=>{ zieht=x; n.classList.add("zieht"); });
  n.addEventListener("dragend",()=>{ n.classList.remove("zieht"); zieht=null;
    document.querySelectorAll(".stunde.ziel").forEach(s=>s.classList.remove("ziel")); });
  return n;
}
function vorratZeile(a){
  const n=el("div","vz"+(istSpaet(a)?" spaet":""));
  n.draggable=true;
  n.innerHTML='<span class="zb"><span class="zt">'+esc(a.titel)+'</span>'
    +'<span class="zm">'+esc((a.kat==="nach"?"Nachverfolgen · ":"")+frist(a)
    +(a.kontakt?" · "+kname(a.kontakt):""))+'</span></span>';
  n.setAttribute("role","button"); n.tabIndex=0;
  n.setAttribute("aria-label","Aufgabe bearbeiten: "+a.titel);

  n.addEventListener("dragstart",()=>{ zieht=a; n.classList.add("zieht"); });
  n.addEventListener("dragend",()=>{ n.classList.remove("zieht"); zieht=null;
    document.querySelectorAll(".stunde.ziel").forEach(s=>s.classList.remove("ziel")); });
  return n;
}

/* ============================================================
   8 — DER SCHALTER
   Zwei feste Oberflächen, dazu die Flächen einzelner Module.
   Aus einer Modulfläche führt ESC zurück zur Leiste.
   ============================================================ */
let flaeche="leiste";
function zeigeFlaeche(id){ dialogZu(); flaeche=id; if(id==="leiste") eingabe=""; male(); }

function male(){
  const rumpf=$("#rumpf"); rumpf.innerHTML="";
  rumpf.style.overflowY="auto";
  $("#w-leiste").setAttribute("aria-current",String(flaeche==="leiste"));
  $("#w-planner").setAttribute("aria-current",String(flaeche==="planner"));

  if(flaeche==="leiste"){ leisteMalen(rumpf); return; }
  if(flaeche==="planner"){ rumpf.style.overflowY="hidden"; plannerMalen(rumpf); return; }

  const m=modul(flaeche);
  const b=el("div","mitte");
  const zur=el("button","zurueck","‹ zurück zur Leiste");
  zur.onclick=()=>zeigeFlaeche("leiste");
  b.appendChild(zur);
  b.appendChild(abschnitt(m.nr+" · "+m.nm,null));
  /* Ein Modul, das sich als Gerüst anmeldet, sagt das auf seiner Fläche —
     an einer Stelle für alle, damit kein Gerüst es vergessen kann. */
  if(m.geruest) b.appendChild(el("div","geruest",
    "<b>Gerüst</b><span>"+esc(m.geruest)+"</span>"));
  if(m.flaeche) m.flaeche(b); else b.appendChild(el("div","leer","Keine eigene Fläche."));
  rumpf.appendChild(b);
}
$("#w-leiste").onclick=()=>zeigeFlaeche("leiste");
$("#w-planner").onclick=()=>zeigeFlaeche("planner");

/* Thema ist eine Anzeigeeinstellung, kein Anwendungsdatum — es lebt
   deshalb für sich in localStorage und nicht im Objekt Z, landet also
   auch nicht in Sicherung oder Export. */
function themaSetzen(t){
  /* An body, nicht an .app — Dialoge und der Meldungszettel hängen als
     eigene Zweige direkt an body, ein Thema an .app erreichte sie nie. */
  document.body.dataset.theme = t==="basecamp" ? "basecamp" : "";
  $("#th-standard").setAttribute("aria-current",String(t!=="basecamp"));
  $("#th-basecamp").setAttribute("aria-current",String(t==="basecamp"));
  store.set("thema",t);
}
$("#th-standard").onclick=()=>themaSetzen("standard");
$("#th-basecamp").onclick=()=>themaSetzen("basecamp");
themaSetzen(store.get("thema","standard"));

/* ============================================================
   9 — SICHERN, LADEN, EXPORTIEREN

   Zwei verschiedene Zwecke, deshalb zwei Formate:

   JSON      vollständig und verlustfrei, mit Versionsfeld.
             Das ist die Sicherung. Kein eigener Parser, also
             auch keine Parser-Fehler.
   Markdown  einbahnig, zum Lesen und Ablegen. Kein Rückweg,
             deshalb auch keine Verluste durch Fehldeutung.

   Der frühere Weg — Markdown in beide Richtungen — war ein
   Fehler: er brauchte vierzig Zeilen Zerlegungslogik, deckte
   nur Termine und Aufgaben ab und verlor Notizen still.
   ============================================================ */
function datei(name, inhalt, typ){
  const blob=new Blob([inhalt],{type:typ+";charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

/* ---------- Sicherung: JSON ---------- */
$("#sichern").onclick=()=>{
  const d=new Date();
  datei("dashboard-"+iso(d)+".json", JSON.stringify(Z,null,1), "application/json");
  store.set("db-stand", d.toLocaleString("de-DE")); standZeigen();
  melde("Gesichert · alle Bereiche");
};

$("#ladenBtn").onclick=()=>$("#laden").click();
$("#laden").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    let neu;
    try{ neu=JSON.parse(String(r.result)); }
    catch(err){ melde("Keine gültige Sicherungsdatei"); return; }
    if(!neu || typeof neu!=="object" || !neu.format){
      melde("Datei stammt nicht aus diesem Dashboard"); return; }
    if(neu.format>1){
      melde("Die Datei stammt aus einer neueren Fassung"); return; }
    /* Bereichsweise ersetzen, damit die Verweise halten.
       Fehlende Bereiche bleiben, wie sie sind. */
    let zahl=0;
    ["kontakte","termine","jahrestermine","aufgaben","notizen","workflows",
     "bausteine","apps","marken","pins","baum"].forEach(k=>{
      if(Array.isArray(neu[k])){ ersetze(Z[k], neu[k]); zahl+=neu[k].length; }
    });
    /* Einzelwerte. Sie brauchen kein ersetze() — auf sie zeigt kein
       Kurzname, den man abreißen könnte. Ohne diese Zeilen stünden sie
       zwar in der Sicherung, kämen beim Laden aber nie zurück. */
    ["schmierzettel"].forEach(k=>{
      if(typeof neu[k]==="string"){ Z[k]=neu[k]; if(neu[k]) zahl++; }
    });
    const heil=heile(Z);
    bewahre(); male();
    melde(zahl+" Einträge aus "+f.name+" geladen"
      +(heil?" · "+heil+(heil>1?" Felder":" Feld")+" ergänzt":""));
  };
  r.onerror=()=>melde("Datei konnte nicht gelesen werden");
  r.readAsText(f,"utf-8"); e.target.value="";
};

/* ---------- Export: Markdown, nur zum Lesen ---------- */
function alsMarkdown(){
  const z=["# Dashboard", "", "_Stand "+new Date().toLocaleString("de-DE")+"_", ""];
  const [d1,d2]=planTage();

  [d1,d2].forEach(d=>{
    const key=iso(d);
    z.push("## "+TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()]
      +(key===HEUTE?" (heute)":""), "");
    const posten=[].concat(
      DATEN.termine.filter(t=>t.d===key).map(t=>({s:t.zeit, x:t, art:"Termin"})),
      DATEN.aufgaben.filter(a=>a.d===key).map(a=>({s:a.zeit||"—", x:a, art:"Aufgabe"}))
    ).sort((a,b)=>(a.s<b.s?-1:1));
    if(!posten.length) z.push("_nichts geplant_","");
    posten.forEach(p=>{
      const k=p.x.kontakt?kfind(p.x.kontakt):null;
      z.push("- "+(p.x.fertig?"~~":"")+p.s.padEnd(5)+" "+p.x.titel+(p.x.fertig?"~~":"")
        +"  \n  "+p.art+(p.x.anm||p.x.notiz?" · "+(p.x.anm||p.x.notiz):"")
        +(k?" · "+knm(k):""));
    });
    z.push("");
  });

  const spaet=DATEN.aufgaben.filter(istSpaet);
  if(spaet.length){
    z.push("## Überfällig","");
    spaet.forEach(a=>z.push("- "+a.titel+" — fällig war "+a.d));
    z.push("");
  }
  const wfs=WORKFLOWS.filter(wfSpaet);
  if(wfs.length){
    z.push("## Workflows überfällig","");
    wfs.forEach(w=>z.push("- "+w.titel+" — "+wfStand(w)));
    z.push("");
  }
  const rest=DATEN.aufgaben.filter(a=>!a.fertig && !istSpaet(a)
    && a.d!==iso(d1) && a.d!==iso(d2));
  if(rest.length){
    z.push("## Offen, nicht eingeplant","");
    ["todo","nach"].forEach(kat=>{
      const l=rest.filter(a=>a.kat===kat); if(!l.length) return;
      z.push("### "+(kat==="todo"?"To-do":"Nachverfolgen"),"");
      l.forEach(a=>z.push("- "+a.titel+" — "+frist(a)));
      z.push("");
    });
  }
  const heute=DATEN.notizen.filter(n=>n.d===HEUTE);
  if(heute.length){
    z.push("## Notizen von heute","");
    heute.forEach(n=>z.push("- **"+n.titel+"**"+(n.zeit?" ("+n.zeit+")":"")
      +(n.text?"  \n  "+n.text:"")));
    z.push("");
  }
  return z.join("\n");
}
$("#export").onclick=()=>{
  datei("tagesplan-"+iso(new Date())+".md", alsMarkdown(), "text/markdown");
  melde("Tagesplan exportiert");
};

/* Eine einzelne Notiz einlesen. Kein Ersatz fuer die Sicherung — die
   bleibt JSON. Dieser Weg ist fuer Dateien von aussen. */
$("#mdlesen").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const n=notizAusMd(String(r.result), f.name);
    DATEN.notizen.push(n); bewahre(); zeigeFlaeche("notizen");
    melde('"'+n.titel+'" eingelesen');
  };
  r.onerror=()=>melde("Datei konnte nicht gelesen werden");
  r.readAsText(f,"utf-8"); e.target.value="";
};

function standZeigen(){
  const w=store.get("db-stand",null);
  $("#stand").textContent = w ? "gesichert "+w : "noch nie gesichert";
  if(!LS_OK){ $("#warn").hidden=false;
    $("#warn").innerHTML="<b>Dieser Browser behält nichts zwischen zwei Sitzungen.</b> "
      +"Vor dem Schließen auf „Sichern“ drücken, beim nächsten Start über „Laden“ zurückholen."; }
}

/* ============================================================
   10 — TASTATUR
   ============================================================ */
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey, imFeld=e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA";
  if(dlgOffen){
    if(e.key==="Escape"){ e.preventDefault(); dialogZu(); }
    return; }
  if(mod&&e.key>="1"&&e.key<="8"){ e.preventDefault();
    const id=PINS[+e.key-1];
    const m=id ? MARKEN.find(x=>x.id===id) : null;
    if(m) mkOeffne(m);
    else melde("Platz ⌘"+e.key+" ist frei");
    return; }
  if(mod&&e.key==="k"){ e.preventDefault(); zeigeFlaeche("leiste"); return; }
  if(mod&&e.key==="p"){ e.preventDefault(); zeigeFlaeche("planner"); return; }
  if(mod&&e.key==="s"){ e.preventDefault(); $("#sichern").click(); return; }
  if(e.key==="Escape"){
    if(flaeche==="leiste"&&eingabe){ eingabe=""; male(); }
    else if(flaeche!=="leiste") zeigeFlaeche("leiste");
    return; }
  if(flaeche==="leiste"&&treffer.length){
    if(e.key==="ArrowDown"){ e.preventDefault(); zeiger=Math.min(zeiger+1,treffer.length-1); markiere(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); zeiger=Math.max(zeiger-1,0); markiere(); }
    if(e.key==="Enter"&&zeiger>=0){ e.preventDefault(); treffer[zeiger].click(); }
  }
  if(!mod&&!imFeld&&e.key.length===1&&flaeche==="leiste"){ const q=$("#q"); if(q) q.focus(); }
});

/* ============================================================
   11 — UHR UND START
   ============================================================ */
let letzteMin=-1;
function uhr(){
  const d=new Date(); HEUTE=iso(d);
  $("#uhr").textContent=p2(d.getHours())+":"+p2(d.getMinutes());
  $("#datum").textContent=TAGL[d.getDay()]+", "+d.getDate()+". "+MONL[d.getMonth()];
  if(d.getMinutes()!==letzteMin){ letzteMin=d.getMinutes(); if(!eingabe) male(); }
}
standZeigen();
male();
uhr();
setInterval(uhr,15000);
