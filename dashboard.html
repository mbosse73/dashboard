/* ===== ENDE kalender ===== */

/* Der Tag ist eine Auswahl aus genau zwei Werktagen, kein freies Datum.
   Damit kann ein Termin gar nicht erst irgendwo landen, wo ihn niemand
   sieht — die Regel steckt in der Maske statt in einer Prüfung dahinter.
   Die Liste wird bei jedem Öffnen neu gebaut, weil sich die beiden
   Werktage über Nacht verschieben. */
function tFelder(){
  const [d1,d2]=planTage();
  const nm=d=>TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()];
  return [
    {schl:"titel", nm:"Titel", art:"text", breit:true},
    /* Der Tag verortet den Termin überhaupt und trägt einen Hinweis —
       er steht breit. Uhrzeit und Dauer bilden darunter die Zeitspanne,
       wie in jedem Kalender. Die Dauer stand vorher neben dem Kontakt,
       mit dem sie nichts zu tun hat. */
    {schl:"d",     nm:"Tag", art:"auswahl", breit:true,
     optionen:[[iso(d1),nm(d1)],[iso(d2),nm(d2)]], sub:"Nur diese beiden Werktage."},
    {schl:"zeit",  nm:"Uhrzeit", art:"zeit"},
    {schl:"dauer", nm:"Dauer", art:"zahl", einheit:"Minuten"},
    {schl:"kontakt",nm:"Kontakt", art:"kontakt", breit:true},
    {schl:"anm",   nm:"Anmerkung", art:"mehrzeilig"}
  ];
}
const TLEER={id:null,d:null,zeit:"09:00",dauer:30,titel:"",anm:"",kontakt:null};

function terminDialog(t, tagVor, zeitVor){
  const neu=!t;
  const start=Object.assign({}, TLEER, t||{});
  if(neu){
    start.d=tagVor||iso(planTage()[0]);
    if(zeitVor) start.zeit=zeitVor;
  }
  dialog({
    art: neu?"Neuer Termin":"Termin bearbeiten",
    titel: w=>w.titel,
    felder: tFelder(),
    werte: start,
    merk: "<b>Termine gibt es nur für den aktuellen und den nächsten Werktag.</b> "
      +"Im Planner lassen sie sich zwischen beiden Tagen hin und her ziehen.",
    pruefe: w=>{
      if(!String(w.titel||"").trim()) return {schl:"titel",text:"Ohne Titel geht es nicht."};
      if(!w.zeit) return {schl:"zeit",text:"Ein Termin braucht eine Uhrzeit."};
      if(!w.d)    return {schl:"d",   text:"Ein Termin braucht einen Tag."};
      return null;
    },
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Der Termin verschwindet aus "
        +"dem Kalender und aus dem Planner. Auf Termine verweist nichts.",
      tun: w=>{ const i=DATEN.termine.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.termine.splice(i,1);
        bewahre(); male(); melde("Termin gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.dauer=Number(w.dauer)>0 ? Number(w.dauer) : 30;
      if(neu){ w.id=neueId("t"); DATEN.termine.push(w); }
      else { const z=DATEN.termine.find(x=>x.id===w.id);
        if(!z){ melde("Der Termin ist nicht mehr da."); male(); return; }
        Object.keys(TLEER).forEach(k=>{ if(k!=="id") z[k]=w[k]; }); }
      bewahre(); male(); melde(neu?"Termin angelegt":"Termin gespeichert");
    }
  });
}

/* ---------- 14 Jahreskalender ---------- */
/* Ganz eigener Bestand: DATEN.jahrestermine. Der Kalender (Modul 06)
   kennt ihn nicht, der Planner auch nicht — und dieses Modul zeigt
   umgekehrt keine Termine von dort. Das ist ausdruecklich so gewollt. */
const JK_LEER={id:null,von:null,bis:null,titel:"",kat:"urlaub"};
const JK_KAT={urlaub:"Urlaub", sonst:"Sonstiger Termin"};

let jkJahr=null, jkWahl=null, jkEntwurf=null, jkRumpf=null;

const jkTage=(j,m)=>new Date(j,m+1,0).getDate();
/* Beruehrt der Eintrag diesen Tag? Vergleich als Zeichenkette, weil
   ISO-Daten in dieser Form lexikographisch richtig sortieren. */
const jkAmTag=k=>DATEN.jahrestermine.filter(t=>k>=t.von && k<=t.bis);
const jkHat=(k,kat)=>jkAmTag(k).some(t=>t.kat===kat);

/* „3.–17. August“, ueber Monatsgrenzen „22. Dez – 3. Jan“ */
function jkSpanne(t){
  const [jv,mv,tv]=t.von.split("-").map(Number);
  const [jb,mb,tb]=t.bis.split("-").map(Number);
  if(t.von===t.bis) return tv+". "+MONL[mv-1];
  if(jv===jb && mv===mb) return tv+".–"+tb+". "+MONL[mv-1];
  return tv+". "+MONK[mv-1]+" – "+tb+". "+MONK[mb-1];
}

function jkOeffnen(tagVor){
  /* Was offen ist, macht Platz. Danach traegt sich das Fenster selbst
     in dlgOffen ein — so greifen Escape und der Klick daneben, ohne
     dass es eine zweite Mechanik dafuer braeuchte. */
  dialogZu();
  jkJahr=Number(HEUTE.slice(0,4));
  jkWahl=null; jkEntwurf=null;
  const s=el("div","schleier weit auf");
  const d=el("div","dlg weit");
  const k=el("div","dlg-k",
    '<span class="art">Jahreskalender</span><span class="sp"></span>');
  const zu=el("button","dlg-zu","×");
  zu.setAttribute("aria-label","Schließen"); zu.onclick=dialogZu;
  k.appendChild(zu);
  jkRumpf=el("div","dlg-b");
  d.append(k,jkRumpf);
  s.appendChild(d);
  s.onclick=ev=>{ if(ev.target===s) dialogZu(); };
  document.body.appendChild(s);
  dlgOffen=s;
  jkMalen();
  if(tagVor) jkWaehle(tagVor);
}

function jkMalen(){
  if(!jkRumpf) return;
  jkRumpf.innerHTML="";

  const kopf=el("div","jk-k");
  const zur=el("button","jpfeil",
    '<svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>');
  zur.setAttribute("aria-label","Ein Jahr zurück");
  zur.onclick=()=>{ jkJahr--; jkWahl=null; jkEntwurf=null; jkMalen(); };
  const vor=el("button","jpfeil",
    '<svg viewBox="0 0 20 20"><path d="m8 4 6 6-6 6"/></svg>');
  vor.setAttribute("aria-label","Ein Jahr vor");
  vor.onclick=()=>{ jkJahr++; jkWahl=null; jkEntwurf=null; jkMalen(); };
  kopf.append(zur, el("span","jahrzahl",String(jkJahr)), vor, el("span","sp"));
  const imJahr=DATEN.jahrestermine.filter(t=>t.von.slice(0,4)===String(jkJahr)
    || t.bis.slice(0,4)===String(jkJahr));
  kopf.appendChild(el("span","zahl", imJahr.length+" im Jahr · "
    +imJahr.filter(t=>t.kat==="urlaub").length+" Urlaube"));
  jkRumpf.appendChild(kopf);

  jkRumpf.appendChild(jkRaster());
  jkRumpf.appendChild(jkLegende());
  if(jkEntwurf) jkRumpf.appendChild(jkFelder());
}

function jkRaster(){
  const g=el("div","jahr");
  for(let m=0;m<12;m++){
    /* Die obersten Zeilen lassen ihre Blase nach unten aufklappen —
       nach oben liefe sie aus dem Fenster heraus. */
    const z=el("div","jz"+(m<3?" nachunten":""));
    z.appendChild(el("span","jm",MONK[m]));
    const laenge=jkTage(jkJahr,m);
    for(let t=1;t<=31;t++){
      if(t>laenge){ z.appendChild(el("span","jt keiner")); continue; }
      const key=jkJahr+"-"+p2(m+1)+"-"+p2(t);
      const d=new Date(jkJahr,m,t);
      const l=jkAmTag(key);
      const kl=["jt"];
      if(d.getDay()===0||d.getDay()===6) kl.push("we");
      if(key===HEUTE) kl.push("heute");
      if(key===jkWahl) kl.push("wahl");
      /* Beide Kategorien laufen unabhaengig voneinander durch, jede mit
         eigenen Rundungen. Sonst risse eine Spanne genau dort auf, wo
         die andere beginnt. */
      ["urlaub","sonst"].forEach(kat=>{
        if(!jkHat(key,kat)) return;
        kl.push(kat);
        const v=t>1      && jkHat(jkJahr+"-"+p2(m+1)+"-"+p2(t-1),kat);
        const n=t<laenge && jkHat(jkJahr+"-"+p2(m+1)+"-"+p2(t+1),kat);
        if(!v) kl.push(kat==="urlaub"?"u-anfang":"s-anfang");
        if(!n) kl.push(kat==="urlaub"?"u-ende":"s-ende");
      });
      const c=el("button",kl.join(" "),'<span class="n">'+t+'</span>');
      c.setAttribute("aria-label",TAGL[d.getDay()]+", "+t+". "+MONL[m]+" "+jkJahr
        +(l.length?" — "+l.map(x=>x.titel).join(", "):" — nichts eingetragen"));
      if(l.length){
        let h='<b>'+TAGK[d.getDay()]+", "+t+". "+MONL[m]+'</b>';
        l.forEach(x=>{ h+='<span class="e"><span class="w '+x.kat+'"></span>'
          +esc(x.titel)+' <em>'+esc(jkSpanne(x))+'</em></span>'; });
        c.appendChild(el("span","blase",h));
      }
      c.onclick=()=>jkWaehle(key);
      z.appendChild(c);
    }
    g.appendChild(z);
  }
  return g;
}

function jkLegende(){
  const l=el("div","legende");
  const probe=(kl,zkl,txt)=>{
    const p=el("span","lp");
    p.appendChild(el("span","pr"+(kl?" "+kl:""),
      '<span class="z'+(zkl?" "+zkl:"")+'">14</span>'));
    p.appendChild(document.createTextNode(txt));
    return p;
  };
  l.append(
    probe("urlaub u-anfang u-ende",null,"Urlaub"),
    probe("sonst s-anfang s-ende",null,"Sonstiger Termin"),
    probe("urlaub u-anfang u-ende sonst s-anfang s-ende",null,"Beides am selben Tag"),
    probe("heute","t","Heute"),
    probe(null,"blass","Wochenende"));
  return l;
}

/* Ein Klick auf einen belegten Tag oeffnet den vorhandenen Eintrag,
   auf einen leeren legt er an. Beides klappt im selben Fenster auf —
   dialog() schloesse das Fenster, weil es mit dialogZu() beginnt. */
function jkWaehle(key){
  const l=jkAmTag(key);
  jkWahl=key;
  jkEntwurf = l.length ? Object.assign({},l[0])
                       : Object.assign({},JK_LEER,{von:key,bis:key});
  jkMalen();
}
const jkNeuAm=key=>Object.assign({},JK_LEER,{von:key,bis:key});

function jkFelder(){
  const neu=!jkEntwurf.id;
  const kasten=el("div","einbau");
  const [j,m,t]=jkWahl.split("-").map(Number);
  const d=new Date(j,m-1,t);
  kasten.appendChild(el("div","k",
    '<span class="art">'+(neu?"Neuer Eintrag":"Eintrag bearbeiten")+'</span>'
    +'<span class="tag">'+TAGL[d.getDay()]+", "+t+". "+MONL[m-1]+" "+j+'</span>'));

  /* Liegen mehrere Eintraege auf dem Tag, muessen sie alle erreichbar
     sein — sonst laesst sich der zweite weder bearbeiten noch loeschen,
     und ein Loeschversuch traefe still den ersten. Derselbe Streifen
     traegt auch den Weg zu einem weiteren Eintrag am selben Tag. */
  const amTag=jkAmTag(jkWahl);
  if(amTag.length){
    const r=el("div","wahl");
    r.style.marginBottom="12px";
    amTag.forEach(t=>{
      const b=el("button",null,'<span class="pp '+t.kat+'"></span>'+esc(t.titel));
      b.setAttribute("aria-pressed",String(t.id===jkEntwurf.id));
      b.onclick=()=>{ jkEntwurf=Object.assign({},t); jkMalen(); };
      r.appendChild(b);
    });
    const nb=el("button",null,"+ Weiterer Eintrag");
    nb.setAttribute("aria-pressed",String(!jkEntwurf.id));
    nb.onclick=()=>{ jkEntwurf=jkNeuAm(jkWahl); jkMalen(); };
    r.appendChild(nb);
    kasten.appendChild(r);
  }

  const felder=[
    {schl:"titel",nm:"Titel",art:"text",breit:true},
    {schl:"von",  nm:"Von",  art:"datum"},
    {schl:"bis",  nm:"Bis",  art:"datum", sub:"Ein einzelner Tag: dasselbe Datum."}
  ];
  const raster=felderMalen(felder, jkEntwurf, null);
  kasten.appendChild(raster);

  /* Zwei Kategorien als Knoepfe statt als Klappliste: bei genau zwei
     Moeglichkeiten spart das den Zwischenschritt, und die Farbe steht
     gleich daneben. */
  const kf=el("div","dfeld breit",'<label>Kategorie</label>');
  const w=el("div","wahl");
  Object.keys(JK_KAT).forEach(k=>{
    const b=el("button",null,'<span class="pp '+k+'"></span>'+JK_KAT[k]);
    b.setAttribute("aria-pressed",String(jkEntwurf.kat===k));
    b.onclick=()=>{ jkEntwurf.kat=k; jkMalen(); };
    w.appendChild(b);
  });
  kf.appendChild(w);
  raster.appendChild(kf);

  const f=el("div","f");
  if(!neu){
    const lo=el("button","tat weg","Löschen");
    lo.onclick=()=>{
      const i=DATEN.jahrestermine.findIndex(x=>x.id===jkEntwurf.id);
      if(i>=0) DATEN.jahrestermine.splice(i,1);
      bewahre(); jkWahl=null; jkEntwurf=null; jkMalen(); male();
      melde("Eintrag gelöscht");
    };
    f.appendChild(lo);
  }
  f.appendChild(el("span","sp"));
  const ab=el("button","tat still","Abbrechen");
  ab.onclick=()=>{ jkWahl=null; jkEntwurf=null; jkMalen(); };
  const sp=el("button","tat","Speichern");
  sp.onclick=jkSpeichern;
  f.append(ab,sp);
  kasten.appendChild(f);
  return kasten;
}

function jkSpeichern(){
  const w=jkEntwurf;
  w.titel=String(w.titel||"").trim();
  if(!w.titel){ melde("Ohne Titel geht es nicht."); return; }
  if(!w.von){ melde("Ein Eintrag braucht ein Startdatum."); return; }
  /* Ein leeres oder verdrehtes Ende faengt der Eintrag selbst ab —
     sonst laege er in einer Spanne, die es nicht gibt, und waere im
     Raster nirgends zu sehen. */
  if(!w.bis || w.bis<w.von) w.bis=w.von;
  const neu=!w.id;
  if(neu){ w.id=neueId("j"); DATEN.jahrestermine.push(w); }
  else{
    const z=DATEN.jahrestermine.find(x=>x.id===w.id);
    if(!z){ melde("Der Eintrag ist nicht mehr da."); jkWahl=null; jkEntwurf=null; jkMalen(); return; }
    Object.keys(JK_LEER).forEach(k=>{ if(k!=="id") z[k]=w[k]; });
  }
  bewahre();
  jkJahr=Number(w.von.slice(0,4));
  jkWahl=null; jkEntwurf=null; jkMalen(); male();
  melde(neu?"Eintrag angelegt":"Eintrag gespeichert");
}

/* ===== MODUL jahr ===== */
registriere({
  id:"jahr", nr:"14", nm:"Jahreskalender",
  hilfe:"Alle Tage eines Jahres als Raster. Ein Klick auf einen Tag legt einen Eintrag an. Ein Eintrag hat Anfang und Ende, aber keine Uhrzeit. Zwei Arten: Urlaub und sonstiger Termin. Dieser Bestand ist vom Kalender getrennt.",
  zahl:()=>DATEN.jahrestermine.length,
  suche(q){
    return DATEN.jahrestermine
      .filter(t=>t.titel.toLowerCase().includes(q))
      .map(t=>treff("Jahreskalender",t.titel,
        JK_KAT[t.kat]+" · "+jkSpanne(t)+" "+t.von.slice(0,4),"↵",
        ()=>jkOeffnen(t.von)));
  },
  flaeche(b){
    b.appendChild(abschnitt("Jahreskalender","eigener Bestand"));
    b.appendChild(el("div","hinweis",

/* Die Art ist ein Umschalter, kein Merkmal: Sie entscheidet, wie der
   Rest der Maske aussieht. Deshalb steht sie oben und breit. Eine
   allgemeine Notiz hat keinen Anrufer und keine Uhrzeit — dann bleiben
   vier Felder statt sieben, und das Datum nimmt die frei gewordene
   Hälfte der Zeile ein. */
const nurAnruf = w => w.art==="telefon";
function nFelder(){
  return [
    {schl:"titel", nm:"Titel", art:"text", breit:true},
    {schl:"art",   nm:"Art", art:"auswahl", breit:true, schaltet:true,
     optionen:[["telefon","Telefonnotiz"],["allgemein","Allgemeine Notiz"]]},
    {schl:"d",     nm:"Datum", art:"datum", breit:w=>!nurAnruf(w)},
    {schl:"zeit",  nm:"Uhrzeit", art:"zeit", nurWenn:nurAnruf},
    {schl:"kontakt",nm:"Anrufer", art:"kontakt", nurWenn:nurAnruf},
    {schl:"wer",   nm:"…oder frei eintragen", art:"text", nurWenn:nurAnruf},
    {schl:"text",  nm:"Text", art:"mehrzeilig"}
  ];
}

function notizDialog(n, vorbelegt, artVor){
  const neu=!n;
  const jetzt=new Date();
  const start=Object.assign({},NLEER,n||{});
  if(neu){
    start.titel=vorbelegt||"";
    start.art=artVor||"telefon";
    start.d=HEUTE;
    start.zeit=p2(jetzt.getHours())+":"+p2(jetzt.getMinutes());
    /* Datum und Uhrzeit stehen zusätzlich im Text. So wandern sie in die
       .md-Datei und stehen dort, wo man sie beim Lesen sucht. Beim späteren
       Ändern des Datumsfelds wird die Zeile bewusst nicht nachgeschrieben —
       sonst überschriebe sie, was von Hand angepasst wurde. */
    if(start.art==="telefon")
      start.text="**"+datumLang(start.d)+", "+start.zeit+"**\n\n";
  }
  dialog({
    art: neu?"Neue Notiz":"Notiz bearbeiten",
    titel: w=>w.titel,
    felder: nFelder(),
    werte: start,
    merk: v => v.art==="allgemein"
      ? "<b>Eine allgemeine Notiz hat keinen Anrufer und keine Uhrzeit.</b> Danach "
        +"wird deshalb nicht gefragt. Zurück auf „Telefonnotiz“ bringt die Felder wieder."
      : "<b>Neue Notizen sind Telefonnotizen</b> — das ist der häufigere Fall. Datum und "
        +"Uhrzeit stehen zusätzlich im Text, damit sie beim Ausleiten als <code>.md</code> "
        +"erhalten bleiben. Ein Anrufer kann aus der Kontaktliste kommen oder frei "
        +"eingetragen werden; wird beides gefüllt, gewinnt die Auswahl.",
    pruefe: w=>String(w.titel||"").trim()?null:{schl:"titel",text:"Ohne Titel geht es nicht."},
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Auf Notizen verweist nichts, "
        +"es bleibt nirgends etwas zurück. Vorher als <code>.md</code> ausleiten?",
      tun: w=>{ const i=DATEN.notizen.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.notizen.splice(i,1);
        bewahre(); male(); melde("Notiz gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.wer=String(w.wer||"").trim();
      if(w.kontakt) w.wer="";                  /* Auswahl schlägt Freitext */
      if(neu){ w.id=neueId("n"); DATEN.notizen.push(w); }
      else { const z=DATEN.notizen.find(x=>x.id===w.id);
        if(!z){ melde("Die Notiz ist nicht mehr da."); male(); return; }
        Object.keys(NLEER).forEach(s=>{ if(s!=="id") z[s]=w[s]; }); }
      bewahre(); male(); melde(neu?"Notiz angelegt":"Notiz gespeichert");
    }
  });
}

function notizZeile(n){
  const r=el("div","nz"+(n.art==="telefon"?" tel":""));
  const b=el("button","nz-b",
    '<span class="nz-k"><span class="nz-t">'+esc(n.titel)+'</span>'
    +'<span class="nz-a">'+(n.art==="telefon"?"Telefonnotiz":"Notiz")+'</span>'
    +(notizWer(n)?'<span class="nz-w">'+esc(notizWer(n))+'</span>':"")
    +'<span class="sp"></span>'
    +'<span class="nz-d">'+esc(datumLang(n.d)+(n.zeit?" · "+n.zeit:""))+'</span></span>'
    +'<span class="nz-v">'+mdMalen(n.text)+'</span>');
  b.setAttribute("aria-label","Notiz bearbeiten: "+n.titel);
  b.onclick=()=>notizDialog(n);
  r.appendChild(b);
  const aus=el("button","nz-aus","als .md ausleiten");
  aus.onclick=e=>{ e.stopPropagation();
    datei(n.d+"-"+n.titel.toLowerCase().replace(/[^\wäöüß]+/g,"-").replace(/^-|-$/g,"")+".md",
      notizAlsMd(n), "text/markdown");
    melde("Notiz ausgeleitet"); };
  r.appendChild(aus);
  return r;
}

/* Eine App ist eine lokale Datei. Der Browsertest hat am 7. August 2026
   bestätigt, dass Edge sie aus einer lokal geöffneten Datei heraus
   öffnet — der Notweg über einen anklickbaren Verweis entfällt. Es
   bleibt derselbe Weg wie bei einem Bookmark, nur ohne `https://`
   davor: `mkUrl` lässt ein vorhandenes Schema unangetastet. */
function appOeffne(a){
  if(!String(a.url||"").trim()){ melde(a.titel+" hat keine Adresse"); return; }
  oeffneWeg(mkUrl(a.url), true);
  melde(a.titel+" gestartet");
}

/* ---------- Anlegen, Bearbeiten, Löschen ----------
   Derselbe Baustein wie bei Kontakten und Bookmarks. Keine Gruppen: Eine
   Handvoll lokaler Werkzeuge braucht keine Ordnung in Ordnern, und was
   oft gebraucht wird, liegt ohnehin auf einem Platz. */
const APPLEER={id:null, titel:"", url:"", notiz:"", fest:false};

function appDialog(a, vorbelegt){
  const neu=!a;
  const start=Object.assign({}, APPLEER, a||{});
  if(neu && vorbelegt) start.url=vorbelegt;
  start.fest = !neu && heftWo("apps",a.id)>=0;
  dialog({
    art: neu ? "Neue App" : "App bearbeiten",
    titel: w=>String(w.titel||"").trim()||String(w.url||"").trim(),
    werte: start,
    felder:[
      /* Breit, obwohl ein Titel kurz ist: Es gibt kein zweites Feld,
         das daneben passte, und ein Feld allein in einer halben Zeile
         verbietet CLAUDE.md. Bei Bookmarks steht dort die Gruppe. */
      {schl:"titel", nm:"Titel", art:"text", breit:true},
      {schl:"url", nm:"Pfad zur Datei", art:"text", breit:true,
       sub:"Zum Beispiel file:///C:/Tools/rechner.html — ein vorhandenes Schema bleibt unangetastet."},
      {schl:"notiz", nm:"Wozu", art:"mehrzeilig", breit:true, ohneLeiste:true},
      {schl:"fest", nm:"Auf die Leiste heften", art:"schalter",
       sub:"Einer von "+HEFT_MAX+" Plätzen; die ersten "+HEFT_TASTEN
         +" tragen Strg+1 bis Strg+8."}
    ],
    merk:"<b>Titel und Pfad sind Pflicht.</b> Eine App ist eine lokale Datei. "
      +"Der Browsertest hat bestätigt, dass Edge sie aus einer lokal geöffneten "
      +"Datei heraus öffnet.",
    pruefe: w=>{
      if(!String(w.titel||"").trim()) return {schl:"titel", text:"Ohne Titel geht es nicht."};
      if(!String(w.url||"").trim()) return {schl:"url", text:"Ohne Pfad geht es nicht."};
      return null;
    },
    loeschen: neu ? null : {
      frage: w=>{
        const i=heftWo("apps",a.id);
        return "<b>"+esc(String(w.titel||"").trim()||a.titel)+" wirklich löschen?</b><ul>"
          +"<li>Die Zeile verschwindet aus der Liste.</li>"
          +"<li>"+(i>=0
            ? "Platz "+(i<HEFT_TASTEN?"Strg+"+(i+1):String(i+1))
              +" wird frei; was dahinter liegt, rückt auf."
            : "Es ist nichts angeheftet, kein Platz ändert sich.")+"</li>"
          +"<li>Die Datei selbst bleibt, wo sie ist — gelöscht wird nur der Eintrag.</li>"
          +"</ul>";
      },
      tun: ()=>appLoeschen(a)
    },
    speichern: w=>appSpeichern(w,neu)
  });
}

function appSpeichern(w,neu){
  w.titel=String(w.titel||"").trim();
  w.url=String(w.url||"").trim();
  w.notiz=String(w.notiz||"").trim();
  const fest=!!w.fest; delete w.fest;

  if(neu){ w.id=neueId("p"); APPS.push(w); }
  else {
    /* An Ort und Stelle ändern, nicht austauschen — PINS und die Leiste
       zeigen auf dieses Objekt. */
    const z=APPS.find(x=>x.id===w.id);
    if(!z){ melde("Die App ist nicht mehr da."); male(); return; }
    ["titel","url","notiz"].forEach(k=>{ z[k]=w[k]; });
  }
  const i=heftWo("apps",w.id);
  let zusatz="";
  if(fest && i<0){
    if(PINS.length>=HEFT_MAX) zusatz=" · "+HEFT_MAX+" Plätze belegt, nicht angeheftet";
    else { PINS.push({m:"apps", id:w.id});
      zusatz=PINS.length<=HEFT_TASTEN ? " · liegt auf Strg+"+PINS.length : " · angeheftet"; }
  } else if(!fest && i>=0){ PINS.splice(i,1); zusatz=" · Anheftung gelöst"; }
  bewahre(); male();
  melde(w.titel+(neu?" angelegt":" gespeichert")+zusatz);
}

function appLoeschen(a){
  const nm=a.titel, i=heftWo("apps",a.id);
  if(i>=0) PINS.splice(i,1);
  const j=APPS.indexOf(a);
  if(j>=0) APPS.splice(j,1);
  bewahre(); male();
  melde(nm+" gelöscht"+(i>=0?" · Platz frei":""));
}

/* ---------- Bookmarks: Adressen, Plätze, Gruppen ---------- */

/* Gespeichert wird die Adresse so, wie man sie liest: „github.com“.
   Zum Öffnen braucht der Browser ein Schema. Wer selbst eines angibt —
   mailto:, file: — meint es und bekommt es unverändert zurück. */
function mkUrl(u){
  const s=String(u||"").trim();
  return /^[a-z][a-z0-9+.-]*:/i.test(s) ? s : "https://"+s;
}
const mkNachUrl = t =>
  /^[a-z][a-z0-9+.-]*:\/\//i.test(t) || /^[^\s]+\.[a-z]{2,}(\/[^\s]*)?$/i.test(t);

function mkOeffne(m){
  if(!String(m.u||"").trim()){ melde(m.t+" hat keine Adresse"); return; }
  oeffneWeg(mkUrl(m.u), true);
  melde(m.t+" geöffnet");
}
/* Reihenfolge der Gruppen ist die Reihenfolge ihres ersten Bookmarks —
   keine Sortierung. Wer umsortieren will, verschiebt Einträge. */
const mkGruppen = () => [...new Set(MARKEN.map(m=>m.g))];

/* Ansichtszustand, bewusst außerhalb von Z: Er beschreibt, wie man
   gerade hinsieht, nicht die Daten, und hat in einer Sicherung nichts
   verloren — genau wie `kSuche` bei den Kontakten. */
let mkOrdnen=false;

/* Zwei Zustände statt eingeblendeter Knöpfe. Beim Überfahren
   einzublenden wäre naheliegend und auf dem iPad unbrauchbar: Dort gibt
   es kein Überfahren, und die Knöpfe wären unerreichbar — derselbe
   Fehler wie beim Ziehen im Planner. */
function mkSchalter(){
  const s=el("button","n", mkOrdnen ? "fertig ›" : "ordnen ›");
  s.setAttribute("aria-pressed",String(mkOrdnen));
  s.setAttribute("aria-label", mkOrdnen
    ? "Ordnen beenden" : "Anheften, Bearbeiten und Anlegen einschalten");
  s.onclick=()=>{ mkOrdnen=!mkOrdnen; male(); };
  return s;
}

/* Die Plätze zuoberst. Hier — auf der Verwaltungsfläche — werden auch
   die freien gezeigt: Man soll sehen, wie viele noch zu vergeben sind.
   In der Leiste steht dafür nur ein Feld mit der Restzahl; zwölf leere
   Kästen wären dort Unruhe.
   Es sind ausdrücklich nicht nur Bookmarks: Was ein anderes Modul
   angeheftet hat, steht hier mit seinem eigenen Zeichen. */
function mkSchnellzugriff(){
  const w=el("div");
  const stand=heftStand();
  w.appendChild(abschnitt("Häufig benutzt",
    stand.length+" von "+HEFT_MAX+" Plätzen · Strg+1 bis Strg+"+HEFT_TASTEN, "jetzt"));
  const r=el("div","bm-schnell");
  for(let i=0;i<HEFT_MAX;i++){
    const t=heftHole(PINS[i]);
    if(!t){ r.appendChild(el("div","bm-platz frei",'<b>·</b><span>frei</span>'));
      continue; }
    const k=el("button","bm-platz",'<b>'+(i<HEFT_TASTEN?String(i+1):"·")+'</b>'
      +(t.mod.heftbar.zeichen||"")+'<span>'+esc(t.e.titel)+'</span>');
    k.setAttribute("aria-label",t.e.titel+" öffnen — "+(t.e.meta||t.mod.nm)
      +(i<HEFT_TASTEN?", Tastenkürzel Strg+"+(i+1):""));
    k.onclick=()=>heftOeffne(PINS[i]);
    r.appendChild(k);
  }
  w.appendChild(r);
  return w;
}

function mkGruppenzeile(g){
  const l=MARKEN.filter(m=>m.g===g);
  const z=el("div","bm-zeile");
  const n=el("div","bm-name",esc(g)+'<em>'+l.length+'</em>');
  if(mkOrdnen){
    const um=el("button","mini","umbenennen");
    um.setAttribute("aria-label","Gruppe "+g+" umbenennen");
    um.onclick=()=>mkGruppeDialog(g);
    n.appendChild(um);
  }
  const c=el("div","bm-chips");
  l.forEach(m=>c.appendChild(mkChip(m)));
  if(mkOrdnen){
    const neu=el("button","bm-chip neu","+ neues Bookmark");
    neu.onclick=()=>mkDialog(null,null,g);
    c.appendChild(neu);
  }
  z.append(n,c);
  return z;
}

function mkChip(m){
  const i=heftWo("marken",m.id), an=i>=0;
  /* Angeheftet trägt Tinte, weil der Platz dann belegt und benutzbar
     ist — kein Kategorieton, sondern „aktiv“. */
  const c=el("div","bm-chip"+(an?" an":""));
  const oeff=el("button",null,(an&&i<HEFT_TASTEN?'<b>Strg+'+(i+1)+'</b>':"")+esc(m.t));
  oeff.setAttribute("aria-label",m.t+" öffnen — "+m.u);
  oeff.onclick=()=>mkOeffne(m);
  c.appendChild(oeff);
  if(mkOrdnen){
    const p=el("button","bm-tat",IK.nadel);
    p.setAttribute("aria-label",(an?"Anheftung lösen: ":"Anheften: ")+m.t);
    p.title=an?"Anheftung lösen":"Anheften";
    p.onclick=()=>heften("marken",m.id,m.t);
    const bx=el("button","bm-tat",IK.stift);
    bx.setAttribute("aria-label",m.t+" bearbeiten");
    bx.title="Bearbeiten";
    bx.onclick=()=>mkDialog(m);
    c.append(p,bx);
  }
  return c;
}

/* ---------- Der Bookmark-Dialog ----------
   Titel und Gruppe nebeneinander, die Adresse breit darunter. Das Feld
   für eine neue Gruppe steht direkt bei der Auswahl, die es hervorruft —
   näher an seinem Auslöser als an der Reihenfolge Was → Wann → Wer. */
const MKLEER={id:null,t:"",u:"",g:"",gneu:"",fest:false};
const MK_NEU="__neu";

function mkFelder(){
  return [
    {schl:"t", nm:"Titel", art:"text"},
    {schl:"g", nm:"Gruppe", art:"auswahl", schaltet:true,
     optionen: mkGruppen().map(g=>[g,g]).concat([[MK_NEU,"Neue Gruppe …"]])},
    {schl:"gneu", nm:"Name der neuen Gruppe", art:"text", breit:true,
     nurWenn: w=>w.g===MK_NEU},
    {schl:"u", nm:"Adresse", art:"text", breit:true,
     sub:"Ohne https:// genügt — das ergänzt sich beim Öffnen."},
    {schl:"fest", nm:"Auf die Leiste heften", art:"schalter",
     sub:"Einer von "+HEFT_MAX+" Plätzen; die ersten "+HEFT_TASTEN
       +" tragen Strg+1 bis Strg+8."}
  ];
}

/* `gruppe` kommt vom „+ neues Bookmark“ am Ende einer Gruppenzeile —
   dort ist die Gruppe schon beantwortet und soll nicht noch einmal
   gefragt werden. */
function mkDialog(m, vorbelegt, gruppe){
  const neu=!m;
  const start=Object.assign({}, MKLEER, m||{});
  if(neu){
    if(vorbelegt) start.u=vorbelegt;
    start.g=gruppe||mkGruppen()[0]||MK_NEU;
  }
  start.fest = !neu && heftWo("marken",m.id)>=0;
  dialog({
    art: neu ? "Neues Bookmark" : "Bookmark bearbeiten",
    titel: w=>String(w.t||"").trim()||String(w.u||"").trim(),
    felder: mkFelder(),
    werte: start,
    merk: "<b>Titel und Adresse sind Pflicht.</b> Die Adresse darf ohne Schema stehen; "
      +"beim Öffnen wird <code>https://</code> davorgesetzt. Wer <code>mailto:</code> oder "
      +"<code>file:</code> selbst angibt, bekommt es unverändert zurück.",
    pruefe: w=>{
      if(!String(w.t||"").trim()) return {schl:"t", text:"Ohne Titel geht es nicht."};
      if(!String(w.u||"").trim()) return {schl:"u", text:"Ohne Adresse geht es nicht."};
      if(w.g===MK_NEU && !String(w.gneu||"").trim())
        return {schl:"gneu", text:"Die neue Gruppe braucht einen Namen."};
      return null;
    },
    loeschen: neu ? null : {
      frage: w=>{
        const i=heftWo("marken",m.id), letzte=MARKEN.filter(x=>x.g===m.g).length===1;
        return "<b>"+esc(String(w.t||"").trim()||m.t)+" wirklich löschen?</b><ul>"
          +"<li>Die Zeile verschwindet aus der Gruppe „"+esc(m.g)+"“.</li>"
          +"<li>"+(i>=0
            ? "Platz "+(i<HEFT_TASTEN?"Strg+"+(i+1):String(i+1))
              +" wird frei; was dahinter liegt, rückt auf."
            : "Es ist nichts angeheftet, kein Platz ändert sich.")+"</li>"
          +(letzte ? "<li>Es ist das letzte in „"+esc(m.g)
            +"“ — die Gruppe verschwindet mit.</li>" : "")
          +"</ul>";
      },
      tun: ()=>mkLoeschen(m)
    },
    speichern: w=>mkSpeichern(w,neu)
  });
}

function mkSpeichern(w,neu){
  w.t=String(w.t||"").trim();
  w.u=String(w.u||"").trim();
  let g=String(w.g||"").trim();
  if(g===MK_NEU) g=String(w.gneu||"").trim();
  w.g=g||"Ohne Gruppe";
  delete w.gneu;
  const fest=!!w.fest; delete w.fest;

  if(neu){ w.id=neueId("m"); MARKEN.push(w); }
  else {
    /* An Ort und Stelle ändern, nicht austauschen — PINS und die Leiste
       zeigen auf dieses Objekt. */
    const z=MARKEN.find(x=>x.id===w.id);
    if(!z){ melde("Das Bookmark ist nicht mehr da."); male(); return; }
    ["t","u","g"].forEach(s=>{ z[s]=w[s]; });
  }
  const i=heftWo("marken",w.id);
  let zusatz="";
  if(fest && i<0){
    if(PINS.length>=HEFT_MAX) zusatz=" · "+HEFT_MAX+" Plätze belegt, nicht angeheftet";
    else { PINS.push({m:"marken", id:w.id});
      zusatz=PINS.length<=HEFT_TASTEN ? " · liegt auf Strg+"+PINS.length : " · angeheftet"; }
  } else if(!fest && i>=0){ PINS.splice(i,1); zusatz=" · Anheftung gelöst"; }
  bewahre(); male();
  melde(w.t+(neu?" angelegt":" gespeichert")+zusatz);
}

function mkLoeschen(m){
  const nm=m.t, i=heftWo("marken",m.id);
  if(i>=0) PINS.splice(i,1);
  const j=MARKEN.indexOf(m);
  if(j>=0) MARKEN.splice(j,1);          /* splice, nie neu zuweisen */
  bewahre(); male();
  melde(nm+" gelöscht"+(i>=0?" · Platz "
    +(i<HEFT_TASTEN?"Strg+"+(i+1):String(i+1))+" frei":""));
}

/* Eine Gruppe ist kein eigener Datensatz, sondern das Feld `g` an den
   Bookmarks. Umbenennen heißt deshalb: an allen ändern. Ein Löschen gibt
   es folgerichtig nicht — eine Gruppe verschwindet, wenn ihr letztes
   Bookmark geht oder umzieht. */
function mkGruppeDialog(g){
  const n=MARKEN.filter(m=>m.g===g).length;
  dialog({
    art:"Gruppe umbenennen",
    titel: w=>String(w.g||"").trim()||g,
    felder:[{schl:"g", nm:"Name der Gruppe", art:"text", breit:true}],
    werte:{g},
    merk:"Der Name ändert sich an "+(n===1?"dem einen Bookmark":"allen "+n+" Bookmarks")
      +" dieser Gruppe. Trägt man den Namen einer vorhandenen Gruppe ein, werden beide "
      +"zu einer — das ist der Weg, Gruppen zusammenzulegen.",
    pruefe: w=>String(w.g||"").trim() ? null
      : {schl:"g", text:"Ohne Namen geht es nicht."},
    speichern: w=>{
      const neu=String(w.g).trim();
      if(neu===g) return;
      const rein=mkGruppen().indexOf(neu)>=0;
      MARKEN.forEach(m=>{ if(m.g===g) m.g=neu; });
      bewahre(); male();
      melde(rein ? "„"+g+"“ in „"+neu+"“ aufgegangen"
                 : "Gruppe heißt jetzt „"+neu+"“");
    }
  });
}

/* Suchstand der Hilfe. Wie kSuche bei den Kontakten ausserhalb von Z:
   Er beschreibt die Ansicht, nicht die Daten. */
let hiSuche="", hiWahl="flaechen";

/* Die Abschnitte. `bau` zeichnet, `text` liefert alles Durchsuchbare
   als eine Zeichenkette — damit die Suche nichts uebersieht. */
function hiTeile(){
  const mods=MODULE.filter(m=>m.flaeche).sort((a,b)=>a.nr<b.nr?-1:1);
  return [
    {id:"flaechen", nm:"Zwei Oberflächen", bau:hiFlaechen,
     text:"leiste planner oberflächen einstieg arbeitsfläche stundenraster "
       +"überfällig termin schmierzettel plätze vorrat ziehen"},
    {id:"muster", nm:"Eingabemuster", bau:hiMuster,
     text:MUSTER.map(m=>m.bsp+" "+m.was).join(" ")},
    {id:"tasten", nm:"Tastenkürzel", bau:hiTasten,
     text:TASTEN.map(t=>t.t+" "+t.nm+" "+t.wo).join(" ")},
    {id:"module", nm:"Module", bau:hiModule,
     text:mods.map(m=>m.nr+" "+m.nm+" "+(m.hilfe||"")+" "+(m.geruest||"")).join(" ")},
    {id:"daten", nm:"Sichern und Laden", bau:hiDaten,
     text:"sichern laden export json markdown datei localstorage browser "
       +"speicher sicherung rundlauf"},
    {id:"thema", nm:"Themen", bau:hiThema,
     text:"thema themen standard basecamp optik farben umschalter"}
  ];
}

function hiMalen(b){
  const q=hiSuche.trim().toLowerCase();
  const teile=hiTeile();
  const passt = t => !q || (t.nm+" "+t.text).toLowerCase().includes(q);
  const treffer = teile.filter(passt);

  b.appendChild(hiSuchfeld(treffer.length, teile.length));

  const zwei=el("div","hi-zwei");
  const nav=el("div","hi-index");
  (q ? treffer : teile).forEach(t=>{
    const a=el("button","hi-i"+(!q&&t.id===hiWahl?" wahl":""),esc(t.nm));
    a.onclick=()=>{ hiWahl=t.id; hiSuche=""; male();
      const z=document.getElementById("hi-"+t.id);
      if(z) z.scrollIntoView({block:"start"}); };
    nav.appendChild(a);
  });
  const rumpf=el("div");
  if(!treffer.length){
    rumpf.appendChild(el("div","leer",
      "Nichts gefunden zu „"+esc(hiSuche)+"“. Die Hilfe durchsucht nur sich "
      +"selbst — Kontakte, Aufgaben und Termine findet die Leiste."));
  }
  treffer.forEach(t=>{
    const k=abschnitt(t.nm,null);
    k.id="hi-"+t.id;
    rumpf.appendChild(k);
    t.bau(rumpf,q);
  });
  zwei.append(nav,rumpf);
  b.appendChild(zwei);
}

function hiSuchfeld(n,ganz){
  const w=el("div");
  const s=el("div","hi-suche",'<span class="lupe">'+IK.lupe+'</span>');
  const i=el("input");
  i.type="text"; i.value=hiSuche;
  i.placeholder="Hilfe durchsuchen — Funktion, Kürzel, Modul";
  i.setAttribute("aria-label","Hilfe durchsuchen");
  i.oninput=()=>{
    const stelle=i.selectionStart;
    hiSuche=i.value; male();
    const neu=document.querySelector(".hi-suche input");
    if(neu){ neu.focus(); neu.setSelectionRange(stelle,stelle); }
  };
  s.appendChild(i);
  if(hiSuche){
    const x=el("button","weg","zurücksetzen");
    x.onclick=()=>{ hiSuche=""; male(); };
    s.appendChild(x);
  }
  w.appendChild(s);
  w.appendChild(el("div","hi-hin", hiSuche
    ? "<b>"+n+" von "+ganz+"</b> Abschnitten passen. Diese Suche geht nur "
      +"durch die Hilfe."
    : "Diese Suche geht nur durch die Hilfe. Daten findet die Leiste."));
  return w;
}

/* ---------- Die Schnellhilfe ----------
   Schwebendes Fenster wie der Jahreskalender. Es traegt sich selbst in
   dlgOffen ein — damit greifen Escape und der Klick daneben, ohne dass
   es eine zweite Mechanik dafuer braeuchte. */
function shOeffnen(){
  dialogZu();
  const s=el("div","schleier auf");
  const d=el("div","dlg");
  const k=el("div","dlg-k",
    '<span class="art">Schnellhilfe</span>'
    +'<h2 class="dlg-t">Alle Tastenkürzel</h2><span class="sp"></span>');
  const zu=el("button","dlg-zu","×");
  zu.setAttribute("aria-label","Schließen"); zu.onclick=dialogZu;
  k.appendChild(zu);
  const rumpf=el("div","dlg-b");
  rumpf.appendChild(hiTastenTabelle());
  rumpf.appendChild(el("div","hi-fuss",
    "<b>Esc</b> schließt dieses Fenster. Die ausführliche Hilfe steht als "
    +"eigene Fläche bereit."));
  const f=el("div","dlg-f");
  f.appendChild(el("span","sp"));
  const hin=el("button","tat still","Zur ausführlichen Hilfe");
  hin.onclick=()=>{ dialogZu(); zeigeFlaeche("hilfe"); };
  f.appendChild(hin);
  d.append(k,rumpf,f);
  s.appendChild(d);
  s.onclick=ev=>{ if(ev.target===s) dialogZu(); };
  document.body.appendChild(s);
  dlgOffen=s;
}

        v.schritte.length+" Teilschritte in fester Reihenfolge. "
        +"Genau ein Schritt ist aktiv; alles davor gilt als erledigt."));
      list.forEach(w=>b.appendChild(wfKarte(w)));
    });
  }
});

/* Eine Instanz als Karte: Stand, Frist des aktiven Schritts, Fortschritt */
function wfKarte(w){
  const l=wfSchritte(w), i=wfIndex(w), f=wfFrist(w), spaet=wfSpaet(w);
  const k=el("div","karte");
  k.innerHTML='<div style="display:flex;align-items:baseline;gap:10px">'
    +'<span style="font-size:14.5px;font-weight:650">'+esc(w.titel)+'</span>'
    +'<span style="margin-left:auto;font-family:var(--etikett);font-size:11.5px;color:'
    +(spaet?"var(--signal)":"var(--ink3)")+'">'
    +(wfFertig(w) ? "abgeschlossen" : (f ? (spaet?"überfällig":frist({d:f})) : "ohne Frist"))
    +'</span></div>'
    +'<div style="font-size:12.5px;color:var(--ink3);margin-top:5px">'+esc(wfStand(w))
    +(w.werte.kontakt&&kfind(w.werte.kontakt)?" · "+esc(kname(w.werte.kontakt)):"")+'</div>';

  /* Fortschritt als Kette — zeigt sofort, wo der Ablauf steht */
  const kette=el("div");
  kette.style.cssText="display:flex;gap:3px;margin-top:10px";
  l.forEach((sch,j)=>{
    const lage=wfLage(w,sch.schl);
    const t=el("span");
    t.title=(j+1)+". "+sch.nm+" — "+({fertig:"erledigt",aktiv:"aktiv",
      spaet:"aktiv, überfällig",offen:"offen"}[lage]);
    t.style.cssText="flex:1;height:4px;border-radius:3px;background:"
      +({fertig:"var(--gut)",aktiv:"var(--tinte)",spaet:"var(--signal)",
         offen:"var(--raise)"}[lage]);
    kette.appendChild(t);
  });
  k.appendChild(kette);

  if(!wfFertig(w)){
    const t=el("button","tat still", i<l.length-1
      ? "Abschließen und weiter zu „"+l[i+1].nm+"“"
      : "Letzten Schritt abschließen");
    t.style.marginTop="10px";
    t.onclick=()=>{
      if(i<l.length-1){ w.aktiv=l[i+1].schl; melde("Jetzt aktiv: "+l[i+1].nm); }
      else { w.aktiv=null; melde("Vorgang abgeschlossen: "+w.titel); }
      bewahre(); male();
    };
    k.appendChild(t);
  }
  return k;
}
/* ===== ENDE workflows ===== */

/* ---------- Rechner: auch nur ein Modul ---------- */
/* ===== MODUL rechner ===== */
registriere({
  id:"rechner", nr:"—", nm:"Rechner", versteckt:true,
  suche(q, roh){
    const w=rechne(roh); if(w===null) return [];
    return [treff("Rechnen","Ergebnis kopieren",String(w).replace(".",","),"↵",
      ()=>melde("Kopiert: "+String(w).replace(".",",")))];
  }
});
/* ===== ENDE rechner ===== */
function rechne(text){
  if(!/^[\d\s+\-*/().,%]+$/.test(text)) return null;
  if(!/[+\-*/%]/.test(text)) return null;
  try{
    const w=Function('"use strict";return ('+text.replace(/,/g,".")+')')();
    if(typeof w!=="number"||!isFinite(w)) return null;
    return Math.round(w*1e6)/1e6;
  }catch(e){ return null; }
}

/* ============================================================
   4 — SPÄTER DAZUGEKOMMEN
   Diese beiden Module sind der Beleg, dass das Register trägt.
   Für sie wurde an Leiste, Planner und Kopfzeile nichts geändert.
   ============================================================ */

/* ---------- Outliner ---------- */
/* ===== MODUL outliner ===== */
registriere({
  id:"outliner", nr:"15", nm:"Outliner",
  hilfe:"Gliederungen mit eingerückten Knoten. Ein Knoten ist ein Feld. Enter legt den nächsten an. Tab rückt ein, Umschalt und Tab rücken aus. Alt und Pfeil verschieben einen Knoten samt allem darunter. Umschalt und Enter öffnen eine Notizzeile. Ein Klick auf den Punkt springt hinein. Strg und Z nehmen zurück. Ein Datum wird getippt: @20.8. setzt eine Frist. Mit @20.8...31.8. wird ein Zeitraum daraus. Diese Fristen gehören dem Outliner allein. Sie erscheinen nicht im Planner. Auch nicht im Kalender. Gantt und Mindmap zeigen dieselbe Gliederung anders. Beide lassen sich als PDF ausgeben. Das Blattformat wird dabei gewählt.",
  zahl:()=>BAUM.length,
  suche(q){
    if(q.length<3) return [];
    return BAUM.filter(k=>k.t.toLowerCase().includes(q)).slice(0,4).map(k=>
      treff("Gliederung", k.t, "Ebene "+(k.e+1)+" · "+(BAUM[0]?BAUM[0].t:"Gliederung"), "↵",
        ()=>{ olFokus=null; olMarke=k.id; zeigeFlaeche("outliner"); }));
  },
  flaeche(b){ olMalen(b); }
});
/* ===== ENDE outliner ===== */

/* ---------- Der Outliner, ausführlich ----------
   Die Liste ist flach. `e` ist die Ebene, ein Teilbaum ist ein
   zusammenhängender Abschnitt. Ein- und Ausrücken, Verschieben und
   Löschen sind deshalb ein `splice` und kein Umhängen.

   Rückgängig liegt als Abzug der ganzen Liste auf einem Stapel, nicht
   als Befehlsstapel je Knoten. Bei einigen Hundert Knoten kostet ein
   Abzug nichts, und er kann nicht danebenliegen — ein Befehlsstapel
   kann. Getipptes wird zu einem Schritt gebündelt.

   Nichts davon liegt in `Z`: Schreibmarke, Fokus und Stapel sind
   Ansicht, kein Anwendungsdatum. */
let olFokus=null;                /* Kennung des Knotens, in dem wir stehen */
let olMarke=null;                /* Kennung des Knotens mit der Schreibmarke */
let olFeld="t";                  /* "t" oder "notiz" */
let olPos=null;                  /* Cursorstelle, null = ans Ende */
let olAnsicht="gliederung";
const OL_STAPEL=[]; let olZeiger=-1, olLetzte=0;

const olWo   = id => BAUM.findIndex(k=>k.id===id);
const olHole = id => BAUM.find(k=>k.id===id);
/* Wie viele Knoten hängen unter dem an Stelle `i`? */
function olTeil(i){
  let n=0;
  for(let j=i+1; j<BAUM.length && BAUM[j].e>BAUM[i].e; j++) n++;
  return n;
}
const olAbzug = () => BAUM.map(k=>Object.assign({},k));

function olStapelStart(){
  OL_STAPEL.length=0; OL_STAPEL.push(olAbzug()); olZeiger=0; olLetzte=0;
}
/* Nach jeder Änderung aufrufen. `buendeln` fasst Tippen zusammen:
   Wer einen Satz schreibt, will ihn mit einem Strg+Z los sein und
   nicht dreißigmal drücken. */
function olFertig(buendeln){
  const jetzt=Date.now();
  if(buendeln && jetzt-olLetzte<900 && olZeiger>=0){
    OL_STAPEL[olZeiger]=olAbzug();
  } else {
    OL_STAPEL.splice(olZeiger+1);
    OL_STAPEL.push(olAbzug());
    while(OL_STAPEL.length>60) OL_STAPEL.shift();
    olZeiger=OL_STAPEL.length-1;
  }
  olLetzte=jetzt;
  bewahre();
}
function olSchritt(richtung){
  const z=olZeiger+richtung;
  if(z<0 || z>=OL_STAPEL.length){
    melde(richtung<0 ? "Nichts mehr zurückzunehmen" : "Nichts wiederherzustellen");
    return;
  }
  olZeiger=z;
  ersetze(BAUM, OL_STAPEL[z].map(k=>Object.assign({},k)));
  /* Fokus und Schreibmarke können auf Knoten zeigen, die es nach dem
     Zurücknehmen nicht mehr gibt. Dann auf den ersten sichtbaren
     ausweichen — nicht einfach löschen. Ohne Schreibmarke verlässt der
     Fokus die Fläche, und danach greift keine weitere Taste mehr:
     Zurücknehmen ging dann genau einmal. */
  if(olFokus && !olHole(olFokus)) olFokus=null;
  if(olMarke && !olHole(olMarke)) olMarke=null;
  if(!olMarke){ const s=olSichtbar(); if(s.length) olMarke=s[0].k.id; }
  olFeld="t"; olPos=null; olLetzte=0;
  bewahre(); male();
  melde(richtung<0 ? "Zurückgenommen" : "Wiederhergestellt");
}

/* ---------- Welche Knoten sind zu sehen? ----------
   Zugeklapptes bleibt weg, aber sein Zähler sagt, wie viel darunter
   liegt — nichts darf unsichtbar werden. Im Fokusmodus zählt nur der
   Teilbaum des angesprungenen Knotens; er selbst steht im Pfad und
   nicht noch einmal als Zeile. */
function olSichtbar(){
  let von=0, bis=BAUM.length, rueck=0;
  if(olFokus){
    const i=olWo(olFokus);
    if(i<0){ olFokus=null; }
    else { von=i+1; bis=i+1+olTeil(i); rueck=BAUM[i].e+1; }
  }
  const aus=[]; let zuAb=-1;
  for(let i=von;i<bis;i++){
    const k=BAUM[i];
    if(zuAb>=0){ if(k.e>zuAb) continue; zuAb=-1; }
    if(k.zu && olTeil(i)>0) zuAb=k.e;
    aus.push({k, i, tiefe:k.e-rueck});
  }
  return aus;
}

/* ---------- Zeichnen ---------- */
function olHoehe(f){ f.style.height="auto"; f.style.height=(f.scrollHeight)+"px"; }

function olMalen(b){
  if(OL_STAPEL.length===0) olStapelStart();
  if(!BAUM.length){ BAUM.push({id:neueId("b"), e:0, t:""}); bewahre(); }

  b.appendChild(olLeisteMalen());
  if(olFokus) b.appendChild(olPfadMalen());
  if(olAnsicht!=="gliederung"){ olAnsichtMalen(b); return; }

  const sicht=olSichtbar();
  const spurBis=olSpur();
  const baum=el("div","ol-baum");

  sicht.forEach(({k,i,tiefe})=>{
    const kinder=olTeil(i);
    const z=el("div","ol-k"+(k.id===olMarke?" mark":"")+(tiefe===0?" wurzel":""));
    z.style.paddingLeft=(tiefe*24)+"px";

    if(spurBis.includes(k.id) && tiefe>0){
      const sp=el("span","ol-spur");
      sp.style.left=((tiefe-1)*24+7)+"px";
      z.appendChild(sp);
    }

    if(kinder){
      const d=el("button","ol-drei"+(k.zu?" zu":""),
        '<svg viewBox="0 0 12 12"><path d="M4 2.5 8 6l-4 3.5"/></svg>');
      d.setAttribute("aria-label",(k.zu?"Aufklappen: ":"Zuklappen: ")+(k.t||"ohne Text"));
      d.onclick=()=>{ k.zu=!k.zu; olFertig(); male(); };
      z.appendChild(d);
    } else z.appendChild(el("span","ol-drei leer"));

    const pkt=el("span","ol-pkt"+(kinder?" hat":""));
    pkt.title="Hineinspringen";
    pkt.onclick=()=>olHinein(k.id);
    z.appendChild(pkt);

    const f=el("textarea","ol-tx");
    f.rows=1; f.value=k.t; f.spellcheck=false;
    f.setAttribute("aria-label","Knoten, Ebene "+(k.e+1));
    /* Gedeutet wird bei jedem Zeichen, neu gezeichnet aber nicht: Ein
       Neuaufbau bei jedem Buchstaben risse die Schreibmarke heraus. Die
       Marke am Datum erscheint beim nächsten Zeichnen — spätestens mit
       Enter, Tab oder dem Wechsel in den Gantt. */
    f.oninput=()=>{ k.t=f.value; olDeuten(k); olHoehe(f); olFertig(true); };
    f.onfocus=()=>{ olMarke=k.id; olFeld="t"; };
    f.onblur=()=>{ if(olAusschreiben(k)){ f.value=k.t; olDeuten(k); olFertig(); } };
    f.onkeydown=e=>olTaste(e,k,i,f,"t");
    z.appendChild(f);

    if(k.zu && kinder) z.appendChild(el("span","ol-zu","+"+kinder));
    olMarkeMalen(z,k);

    baum.appendChild(z);

    if(k.notiz!=null){
      const nz=el("div","ol-nz");
      nz.style.paddingLeft=(tiefe*24+30)+"px";
      const n=el("textarea","ol-notiz");
      n.rows=1; n.value=k.notiz; n.placeholder="Notiz"; n.spellcheck=false;
      n.setAttribute("aria-label","Notiz zu "+(k.t||"diesem Knoten"));
      n.oninput=()=>{ k.notiz=n.value; olHoehe(n); olFertig(true); };
      n.onfocus=()=>{ olMarke=k.id; olFeld="notiz"; };
      n.onkeydown=e=>olTaste(e,k,i,n,"notiz");
      nz.appendChild(n);
      baum.appendChild(nz);
    }
  });

  b.appendChild(baum);

  /* Erst nachdem `male()` die Fläche ins Dokument gehängt hat. `flaeche`
     bekommt einen losgelösten Knoten — dort ist `scrollHeight` null und
     `focus()` wirkungslos. Ohne diesen Aufschub verlor die Schreibmarke
     nach jedem Neuzeichnen den Halt, und jede weitere Taste ging ins
     Leere. Ein Mikrotask läuft, sobald `male()` fertig ist. */
  queueMicrotask(()=>{
    if(!baum.isConnected) return;
    baum.querySelectorAll("textarea").forEach(olHoehe);
    olMarkeSetzen(baum);
  });
}

/* Der Zweig, in dem die Schreibmarke steht — alle Vorfahren des
   markierten Knotens, er selbst eingeschlossen. */
function olSpur(){
  const i=olWo(olMarke);
  if(i<0) return [];
  const aus=[BAUM[i].id];
  let e=BAUM[i].e;
  for(let j=i-1;j>=0 && e>0;j--){
    if(BAUM[j].e<e){ e=BAUM[j].e; aus.push(BAUM[j].id); }
  }
  return aus;
}

function olMarkeSetzen(baum){
  if(!olMarke) return;
  const zeilen=[...baum.querySelectorAll(".ol-k")];
  const treffer=zeilen[olSichtbar().findIndex(x=>x.k.id===olMarke)];
  if(!treffer) return;
  const f = olFeld==="notiz"
    ? (treffer.nextSibling && treffer.nextSibling.querySelector
       ? treffer.nextSibling.querySelector(".ol-notiz") : null)
    : treffer.querySelector(".ol-tx");
  if(!f) return;
  f.focus();
  const p = olPos==null ? f.value.length : Math.min(olPos, f.value.length);
  f.setSelectionRange(p,p);
  olPos=null;
}

function olLeisteMalen(){
  const l=el("div","ol-leiste");
  const sch=el("div","ol-schalter");
  [["gliederung","Gliederung"],["gantt","Gantt"],["mindmap","Mindmap"]].forEach(([id,nm])=>{
    const kn=el("button",null,nm);
    kn.setAttribute("aria-current",String(olAnsicht===id));
    kn.onclick=()=>{ olAnsicht=id; male(); };
    sch.appendChild(kn);
  });
  l.appendChild(sch);
  return l;
}

function olPfadMalen(){
  const p=el("div","ol-pfad");
  const kette=[]; let i=olWo(olFokus), e=BAUM[i].e;
  for(let j=i-1;j>=0 && e>0;j--) if(BAUM[j].e<e){ e=BAUM[j].e; kette.unshift(BAUM[j]); }
  const ganz=el("button",null,"Ganze Gliederung");
  ganz.onclick=()=>{ olFokus=null; male(); };
  p.append(ganz);
  kette.forEach(k=>{
    p.appendChild(el("span",null,"›"));
    const kn=el("button",null,esc(k.t||"Ohne Text"));
    kn.onclick=()=>{ olFokus=k.id; male(); };
    p.appendChild(kn);
  });
  p.appendChild(el("span",null,"›"));
  p.appendChild(el("b",null,esc(BAUM[i].t||"Ohne Text")));
  return p;
}

function olHinein(id){
  const i=olWo(id);
  if(olTeil(i)===0){ melde("Nichts darunter, worauf man springen könnte"); return; }
  olFokus=id; olMarke=null; male();
}
function olHeraus(){
  if(!olFokus){ melde("Schon in der ganzen Gliederung"); return; }
  const i=olWo(olFokus); let e=BAUM[i].e, hoch=null;
  for(let j=i-1;j>=0;j--) if(BAUM[j].e<e){ hoch=BAUM[j].id; break; }
  olFokus=hoch; male();
}

/* ---------- Die Tasten ----------
   Sie hängen am Feld, nicht an `document`. Rückgängig gibt es sonst
   nirgends im Dashboard; eine Taste, die überall angeboten wird und
   meist ins Leere geht, wäre schlechter als eine, die nur dort wirkt,
   wo sie etwas kann. */
function olTaste(e,k,i,f,welches){
  const mod=e.ctrlKey||e.metaKey;
  const pos=f.selectionStart, ende=f.value.length;

  if(mod && e.key.toLowerCase()==="z"){
    e.preventDefault(); olSchritt(e.shiftKey?1:-1); return; }
  if(mod && e.key.toLowerCase()==="y"){ e.preventDefault(); olSchritt(1); return; }

  if(mod && (e.key==="."||e.code==="Period")){
    e.preventDefault();
    if(olTeil(i)===0){ melde("Nichts zum Klappen"); return; }
    k.zu=!k.zu; olMarke=k.id; olFertig(); male(); return;
  }
  if(e.altKey && e.shiftKey && e.key==="ArrowRight"){ e.preventDefault(); olHinein(k.id); return; }
  if(e.altKey && e.shiftKey && e.key==="ArrowLeft"){ e.preventDefault(); olHeraus(); return; }

  /* --- in der Notizzeile gilt weniger --- */
  if(welches==="notiz"){
    if(e.key==="Escape" || (e.key==="Enter"&&!e.shiftKey)){
      e.preventDefault(); olMarke=k.id; olFeld="t"; olPos=null; male(); return;
    }
    if(e.key==="Backspace" && f.value===""){
      e.preventDefault(); k.notiz=null; olMarke=k.id; olFeld="t";
      olFertig(); male(); return;
    }
    return;
  }

  if(e.key==="Enter" && e.shiftKey){
    e.preventDefault();
    if(k.notiz==null) k.notiz="";
    olMarke=k.id; olFeld="notiz"; olPos=null;
    olFertig(); male(); return;
  }
  if(e.key==="Enter"){
    e.preventDefault();
    /* Teilt an der Schreibmarke — was rechts steht, wandert in den
       neuen Knoten. Ein Knoten mit Kindern bekommt sein Geschwister
       hinter dem ganzen Teilbaum, nicht mitten hinein. */
    const rest=f.value.slice(pos);
    k.t=f.value.slice(0,pos);
    const neu={id:neueId("b"), e:k.e, t:rest};
    BAUM.splice(i+1+olTeil(i), 0, neu);
    olMarke=neu.id; olFeld="t"; olPos=0;
    olFertig(); male(); return;
  }

  if(e.key==="Tab"){
    e.preventDefault();
    olPos=pos;
    if(e.shiftKey) olAusruecken(k,i); else olEinruecken(k,i);
    return;
  }

  if(e.altKey && (e.key==="ArrowUp"||e.key==="ArrowDown")){
    e.preventDefault(); olPos=pos; olSchieben(i, e.key==="ArrowUp"?-1:1); return;
  }

  if(e.key==="ArrowUp" || e.key==="ArrowDown"){
    const sicht=olSichtbar();
    const stelle=sicht.findIndex(x=>x.k.id===k.id);
    const ziel=sicht[stelle+(e.key==="ArrowUp"?-1:1)];
    if(!ziel) return;
    e.preventDefault();
    olMarke=ziel.k.id; olFeld="t"; olPos=Math.min(pos, ziel.k.t.length);
    male(); return;
  }

  if(e.key==="Backspace" && pos===0 && f.selectionEnd===0){
    const sicht=olSichtbar();
    const stelle=sicht.findIndex(x=>x.k.id===k.id);
    const vor=sicht[stelle-1];
    if(!vor) return;
    if(olTeil(i)>0){
      e.preventDefault();
      melde("Erst die Unterknoten wegräumen oder ausrücken");
      return;
    }
    e.preventDefault();
    const zi=olWo(vor.k.id);
    olPos=vor.k.t.length;
    vor.k.t += f.value;
    BAUM.splice(i,1);
    olMarke=vor.k.id; olFeld="t";
    olFertig(); male(); return;
  }

  if(e.key==="Escape"){ e.preventDefault(); f.blur(); zeigeFlaeche("leiste"); return; }
}

/* ---------- Umbauen ---------- */
function olEinruecken(k,i){
  /* Es braucht einen Knoten darüber auf gleicher Ebene, unter den
     dieser rutschen kann. Fehlt er, misslingt es nicht still. */
  let vor=null;
  for(let j=i-1;j>=0;j--){ if(BAUM[j].e===k.e){ vor=BAUM[j]; break; } if(BAUM[j].e<k.e) break; }
  if(!vor){ melde("Kein Knoten darüber auf gleicher Ebene"); return; }
  const n=olTeil(i);
  for(let j=i;j<=i+n;j++) BAUM[j].e++;
  if(vor.zu) vor.zu=false;          /* sonst verschwände der Knoten sofort */
  olFertig(); male();
}
function olAusruecken(k,i){
  if(k.e===0){ melde("Steht schon ganz links"); return; }
  const n=olTeil(i);
  for(let j=i;j<=i+n;j++) BAUM[j].e--;
  /* Was hinter dem Teilbaum auf der alten Ebene folgte, gehört jetzt
     unter diesen Knoten — sonst risse die Gliederung auseinander. */
  olFertig(); male();
}
function olSchieben(i, richtung){
  const n=olTeil(i)+1;
  const teil=BAUM.slice(i,i+n);
  if(richtung<0){
    let vor=-1;
    for(let j=i-1;j>=0;j--){ if(BAUM[j].e===BAUM[i].e){ vor=j; break; }
      if(BAUM[j].e<BAUM[i].e) break; }
    if(vor<0){ melde("Kein Geschwister darüber"); return; }
    BAUM.splice(i,n); BAUM.splice(vor,0,...teil);
  } else {
    const nach=i+n;
    if(nach>=BAUM.length || BAUM[nach].e<BAUM[i].e){ melde("Kein Geschwister darunter"); return; }
    const m=olTeil(nach)+1;
    BAUM.splice(i,n); BAUM.splice(i+m,0,...teil);
  }
  olFertig(); male();
}

/* ---------- Datumsangaben ----------
   Sie werden getippt, nicht ausgewählt: `@20.8.`, `@2026-08-20`,
   `@heute`, `@morgen`, `@mo`, dazu `@20.8...31.8.` für einen Zeitraum.
   Der Text bleibt damit die einzige Wahrheit — es gibt keinen zweiten
   Ort, der abgeglichen werden müsste.

   Diese Fristen gehören dem Outliner allein. Sie stehen nicht im
   Planner, nicht im Kalender und nicht im Jahreskalender. Wer eine
   Frist an beiden Orten braucht, trägt sie an beiden Orten ein. */
const OL_TAGE={so:0,mo:1,di:2,mi:3,do:4,fr:5,sa:6};
function olDatum(s){
  s=String(s||"").trim().toLowerCase();
  if(!s) return null;
  if(s==="heute") return HEUTE;
  if(s==="morgen") return tagPlus(1);
  if(s==="übermorgen"||s==="uebermorgen") return tagPlus(2);
  if(OL_TAGE[s]!==undefined){
    const heute=new Date(HEUTE+"T00:00:00");
    let d=(OL_TAGE[s]-heute.getDay()+7)%7; if(d===0) d=7;
    return tagPlus(d);
  }
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return s;
  m=s.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{4})?$/);
  if(m){
    /* Ohne Jahr das laufende — es sei denn, der Tag liegt dann schon
       mehr als ein halbes Jahr zurück. Dann war das nächste gemeint. */
    let j=m[3] ? Number(m[3]) : Number(HEUTE.slice(0,4));
    let d=j+"-"+p2(Number(m[2]))+"-"+p2(Number(m[1]));
    if(!m[3] && d < tagPlus(-183)) d=(j+1)+d.slice(4);
    return d;
  }
  return null;
}
/* Liest die Angaben aus einer Zeile und schreibt sie in den Knoten.
   Was nicht als Datum zu deuten ist, bleibt einfach Text. */
function olDeuten(k){
  const alt=(k.frist||"")+"|"+(k.von||"")+"|"+(k.bis||"");
  let frist=null, von=null, bis=null;
  const re=/@([^\s@]+)/g; let m;
  while((m=re.exec(k.t))){
    const roh=m[1];
    /* Gierig teilen, nicht mit `split`. Bei `20.8...31.8.` sind drei
       Punkte hintereinander: der hinter dem Tag und die beiden des
       Trenners. `split("..")` greift beim ersten Paar zu und reißt den
       Tagespunkt mit ab — herauskamen `20.8` und `.31.8.`, und beides
       war kein Datum mehr. Ein gieriges `.+` nimmt den linken Teil so
       lang wie möglich und trifft damit den richtigen Trenner. */
    const zwei=roh.match(/^(.+)\.\.(.+)$/);
    if(zwei){
      const a=olDatum(zwei[1]), b=olDatum(zwei[2]);
      if(a&&b){ von=a<b?a:b; bis=a<b?b:a; }
    } else {
      const d=olDatum(roh);
      if(d) frist=d;
    }
  }
  k.frist=frist; k.von=von; k.bis=bis;
  return alt !== (frist||"")+"|"+(von||"")+"|"+(bis||"");
}
/* Relative Angaben ausschreiben, sobald die Zeile verlassen wird.
   Sonst liefen Text und gespeicherte Frist ab morgen auseinander:
   `@morgen` meint dann einen anderen Tag als den festgehaltenen. */
function olAusschreiben(k){
  const vorher=k.t;
  k.t=k.t.replace(/@([^\s@]+)/g, (ganz, roh)=>{
    const zwei=roh.match(/^(.+)\.\.(.+)$/);
    const wandle = x => {
      const d=olDatum(x);
      if(!d || /^\d{4}-\d{2}-\d{2}$/.test(x) || /^\d{1,2}\.\d{1,2}\.\d{4}$/.test(x)) return x;
      const t=new Date(d+"T00:00:00");
      return t.getDate()+"."+(t.getMonth()+1)+"."+t.getFullYear();
    };
    return "@"+(zwei ? wandle(zwei[1])+".."+wandle(zwei[2]) : wandle(roh));
  });
  return k.t!==vorher;
}
const olSpaet = k => { const d=k.frist||k.bis; return !!d && d<HEUTE; };
function olMarkeMalen(z,k){
  const d = k.von ? (kurzTag(k.von)+" – "+kurzTag(k.bis)) : k.frist ? kurzTag(k.frist) : null;
  if(!d) return;
  z.appendChild(el("span","ol-d"+(olSpaet(k)?" spaet":""),
    (olSpaet(k)?"überfällig · ":"")+d));
}
const kurzTag = s => { const d=new Date(s+"T00:00:00");
  return d.getDate()+". "+MONK[d.getMonth()]; };

/* ---------- Zeilen mit Datum, für Gantt ----------
   Ein Elternpunkt ohne eigenes Datum fasst zusammen, was unter ihm
   liegt. Wer nichts Datiertes unter sich hat, fällt weg. */
function olReihen(){
  const aus=[];
  const liste=olSichtbarFuerAnsicht();
  liste.forEach(({k,i,tiefe})=>{
    let von=k.von||k.frist, bis=k.bis||k.frist, art=k.von?"balken":"raute";
    if(!von){
      const n=olTeil(i);
      const ki=BAUM.slice(i+1,i+1+n).filter(x=>x.von||x.frist);
      if(!ki.length) return;
      von=ki.map(x=>x.von||x.frist).sort()[0];
      bis=ki.map(x=>x.bis||x.frist).sort().pop();
      art="fasst";
    }
    aus.push({k,von,bis,art,tiefe});
  });
  return aus;
}
/* Für Gantt und Mindmap zählt der Fokus, aber **nicht** das Zuklappen:
   Zuklappen ist eine Lesehilfe der Gliederung und darf keine Fristen
   still verschwinden lassen. */
function olSichtbarFuerAnsicht(){
  let von=0, bis=BAUM.length, rueck=0;
  if(olFokus){
    const i=olWo(olFokus);
    if(i>=0){ von=i; bis=i+1+olTeil(i); rueck=BAUM[i].e; }
  }
  const aus=[];
  for(let i=von;i<bis;i++) aus.push({k:BAUM[i], i, tiefe:BAUM[i].e-rueck});
  return aus;
}

function olAnsichtMalen(b){
  const reihen=olReihen();
  if(!reihen.length){
    b.appendChild(el("div","leer",
      olAnsicht==="gantt"
        ? "Noch keine Fristen. Schreiben Sie @20.8. oder @20.8...31.8. in eine Zeile."
        : "Noch nichts zu zeigen."));
    return;
  }
  if(olAnsicht==="gantt") olGanttMalen(b, reihen);
  else olMindmapMalen(b);
}

/* ---------- Gantt auf der Fläche ----------
   Dieselbe Rechnung wie im PDF, nur mit Kästen statt Zeichenbefehlen:
   Zeitraum wird zum Balken, bloße Frist zur Raute, ein Elternpunkt
   ohne eigenes Datum bekommt den offenen Rahmen. */
function olGanttMalen(b, reihen){
  let von=reihen.map(r=>r.von).sort()[0];
  const bis=reihen.map(r=>r.bis).sort().pop();
  if(HEUTE<von) von=HEUTE;
  const tage=Math.max(1, Math.round((new Date(bis+"T00:00:00")-new Date(von+"T00:00:00"))/86400000)+1);
  const anteil = d => Math.round((new Date(d+"T00:00:00")-new Date(von+"T00:00:00"))/86400000)/tage*100;

  const g=el("div","olg");
  const kopf=el("div","olg-r olg-kopf");
  kopf.appendChild(el("div","olg-nm"));
  const skala=el("div","olg-feld");
  olAchse(von,bis,tage).forEach(([a,bez])=>{
    const s=el("span","olg-w",esc(bez)); s.style.left=a+"%"; skala.appendChild(s);
  });
  kopf.appendChild(skala);
  g.appendChild(kopf);

  reihen.forEach(({k,von:v,bis:z,art,tiefe})=>{
    const r=el("div","olg-r");
    const nm=el("div","olg-nm",esc(k.t||"Ohne Text"));
    nm.style.paddingLeft=(tiefe*11)+"px";
    if(tiefe<=1) nm.style.fontWeight="600";
    r.appendChild(nm);
    const f=el("div","olg-feld");
    const l=anteil(v), br=Math.max(anteil(z)-l+100/tage, 1.2);
    const rot=olSpaet(k);
    if(art==="raute"){
      const d=el("span","olg-raute"+(rot?" spaet":"")); d.style.left=l+"%"; f.appendChild(d);
    } else {
      const s=el("span","olg-balken"+(art==="fasst"?" fasst":"")+(rot?" spaet":""));
      s.style.left=l+"%"; s.style.width=br+"%"; f.appendChild(s);
    }
    if(art!=="fasst"){
      const bez=el("span","olg-bez", k.von ? kurzTag(v)+" – "+kurzTag(z) : kurzTag(v));
      bez.style.left=(l+br)+"%"; f.appendChild(bez);
    }
    r.appendChild(f); g.appendChild(r);
  });

  if(HEUTE>=von && HEUTE<=bis){
    const h=el("span","olg-heute"); h.style.left=anteil(HEUTE)+"%";
    g.querySelectorAll(".olg-r:not(.olg-kopf) .olg-feld").forEach(f=>{
      const l=el("span","olg-heute"); l.style.left=anteil(HEUTE)+"%"; f.appendChild(l);
    });
  }

  b.appendChild(g);
  b.appendChild(el("div","hinweis",
    "Balken: Zeitraum · Raute: einzelne Frist · offener Rahmen: fasst die "
    +"Unterpunkte zusammen. Diese Fristen gehören dem Outliner — sie stehen "
    +"nicht im Planner, nicht im Kalender und nicht im Jahreskalender."));
  b.appendChild(olPdfKnopf());
}

/* Die Achse wird gröber, wenn der Zeitraum lang ist: Wochen, Monate,
   Vierteljahre. Ein Zeitstrahl, dessen Beschriftungen sich überlappen,
   ist keiner. */
function olAchse(von,bis,tage){
  const aus=[], a=new Date(von+"T00:00:00"), z=new Date(bis+"T00:00:00");
  const anteil = d => (d-a)/86400000/tage*100;
  if(tage<=70){
    for(let i=0;i<tage;i+=7){
      const d=new Date(a.getTime()+i*86400000);
      aus.push([anteil(d), d.getDate()+". "+MONK[d.getMonth()]]);
    }
    return aus;
  }
  let j=new Date(a.getFullYear(), a.getMonth()+1, 1);
  const jeder = tage>430 ? 3 : 1;
  let n=0;
  while(j<=z){
    if(n%jeder===0) aus.push([anteil(j),
      MONK[j.getMonth()]+(j.getMonth()===0?" "+j.getFullYear():"")]);
    j=new Date(j.getFullYear(), j.getMonth()+1, 1); n++;
  }
  return aus;
}

/* ---------- Die Anordnung der Mindmap ----------
   Nicht radial. Ein Fächer sieht bei drei Ästen gut aus und schiebt
   bei dreißig Punkten die Beschriftungen übereinander — dagegen hilft
   auch kein größeres Blatt, das vergrößert die Überlappung mit.

   Stattdessen die klassische Anordnung: die Wurzel in der Mitte, die
   Äste nach links und rechts, und **jeder Punkt bekommt seine eigene
   Zeile**. Damit kann sich nichts überdecken, gleich wie groß die
   Gliederung wird. */
function olMindLage(gr1,gr2,grW){
  const liste=olSichtbarFuerAnsicht();
  if(!liste.length) return null;
  const wurzel=liste[0].k;
  const eins=liste.filter(x=>x.tiefe===1).map(x=>({
    k:x.k, kinder:BAUM.slice(x.i+1, x.i+1+olTeil(x.i)).filter(c=>c.e===x.k.e+1)
  }));
  if(!eins.length) return null;

  const halb=(t,g,f)=>(pdfBreite(t||"Ohne Text",g,f)+18)/2;
  const wH=halb(wurzel.t,grW,true);
  const aH=Math.max(...eins.map(p=>halb(p.k.t,gr1,true)));
  const bH=Math.max(...eins.flatMap(p=>p.kinder.map(c=>halb(c.t,gr2,false))), 40);
  const SP1=wH+64+aH, SP2=SP1+aH+56+bH;

  /* Abwechselnd auf beide Seiten, damit sie ungefähr gleich lang
     werden. */
  const seiten=[[],[]], last=[0,0];
  eins.forEach(p=>{
    const s=last[0]<=last[1] ? 0 : 1;
    seiten[s].push(p);
    last[s]+=Math.max(1,p.kinder.length)+0.6;
  });

  const ZEILE=26, kaesten=[], bogen=[];
  const merke=(t,x,y,g,f,rot)=>kaesten.push({t:t||"Ohne Text",x,y,gr:g,fett:f,rot,
    b:pdfBreite(t||"Ohne Text",g,f)+18, h:g+11});
  merke(wurzel.t,0,0,grW,true,false);

  seiten.forEach((liste2,si)=>{
    const vz=si===0?1:-1;
    const zeilen=liste2.reduce((n,p)=>n+Math.max(1,p.kinder.length)+0.6,-0.6);
    let y=-zeilen*ZEILE/2;
    liste2.forEach(p=>{
      const n=Math.max(1,p.kinder.length), yA=y+(n-1)*ZEILE/2;
      bogen.push([0,0,vz*SP1,yA,"rule2",1.1]);
      merke(p.k.t, vz*SP1, yA, gr1, true, false);
      p.kinder.forEach((c,ci)=>{
        bogen.push([vz*SP1,yA,vz*SP2,y+ci*ZEILE,"rule",1]);
        merke(c.t, vz*SP2, y+ci*ZEILE, gr2, false, olSpaet(c));
      });
      y+=(n+0.6)*ZEILE;
    });
  });
  return {kaesten,bogen,wurzel};
}

function olMindmapMalen(b){
  const L=olMindLage(11,9.5,12.5);
  if(!L){ b.appendChild(el("div","leer",
    "Zum Zeichnen braucht es mindestens eine Ebene unter der Wurzel.")); return; }
  const K=L.kaesten;
  const l=Math.min(...K.map(k=>k.x-k.b/2)), r=Math.max(...K.map(k=>k.x+k.b/2));
  const o=Math.min(...K.map(k=>k.y-k.h/2)), u=Math.max(...K.map(k=>k.y+k.h/2));
  const BR=r-l, HO=u-o;

  /* In echten Pixeln zeichnen, nicht in Prozent. Erst lagen die
     Verbindungen um den Innenabstand versetzt neben den Kästen:
     Prozentwerte eines Kindes rechnen gegen die Polsterkante des
     Elternteils, die Zeichenfläche daneben tat es nicht. Bei gleicher
     Einheit für beides kann das nicht mehr auseinanderlaufen.
     Wird es breiter als die Spalte, scrollt der Rahmen — die Seite
     nicht. */
  const RAUM=20;
  const raum=el("div","olm-raum");
  const kasten=el("div","olm");
  kasten.style.width=Math.round(BR+RAUM*2)+"px";
  kasten.style.height=Math.round(HO+RAUM*2)+"px";
  const vx=x=>x-l+RAUM, vy=y=>y-o+RAUM;

  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width",BR+RAUM*2); svg.setAttribute("height",HO+RAUM*2);
  L.bogen.forEach(([x1,y1,x2,y2,farbe,d])=>{
    const pf=document.createElementNS(NS,"path");
    const mx=(vx(x1)+vx(x2))/2;
    pf.setAttribute("d","M"+vx(x1)+" "+vy(y1)+" C"+mx+" "+vy(y1)+" "
      +mx+" "+vy(y2)+" "+vx(x2)+" "+vy(y2));
    pf.setAttribute("class","olm-l "+farbe);
    pf.setAttribute("stroke-width",d);
    svg.appendChild(pf);
  });
  kasten.appendChild(svg);

  K.forEach(k=>{
    const d=el("div","olm-k"+(k.fett?" ast":"")+(k.rot?" spaet":"")
      +(k.gr>12?" wurzel":""), esc(k.t));
    d.style.left=Math.round(vx(k.x))+"px";
    d.style.top=Math.round(vy(k.y))+"px";
    kasten.appendChild(d);
  });
  raum.appendChild(kasten);
  b.appendChild(raum);
  b.appendChild(el("div","hinweis",
    "Die Wurzel in der Mitte, die Äste nach beiden Seiten. Jeder Punkt hat "
    +"seine eigene Zeile, damit sich nichts überdeckt. Überfälliges ist rot."));
  b.appendChild(olPdfKnopf());
}

/* ---------- Ausgeben ---------- */
const OL_FORMAT={A4:[842,595], A3:[1191,842], A2:[1684,1191],
                 A1:[2384,1684], A0:[3370,2384]};
const OL_FARBE={
  paper:[0.969,0.961,0.941], sheet:[1,0.996,0.984], raise:[0.937,0.925,0.894],
  rule:[0.886,0.871,0.831], rule2:[0.796,0.776,0.729],
  ink:[0.102,0.102,0.094], ink2:[0.329,0.318,0.294], ink3:[0.420,0.404,0.369],
  tinte:[0.184,0.227,0.549], tinteS:[0.906,0.918,0.965],
  signal:[0.659,0.196,0.122], signalS:[0.984,0.914,0.898]
};
const PRAND=42;

function olPdfKnopf(){
  const kn=el("button","tat still","Als PDF ausgeben …");
  kn.style.marginTop="6px";
  kn.onclick=olPdfFragen;
  return kn;
}

/* Die Wahl trifft der Mensch, nicht das Programm: Ein Wandplan und ein
   Ausdruck für die Mappe sind verschiedene Dinge, und das weiß nur er.
   Vorgeschlagen wird, was zur Ansicht passt. */
function olPdfFragen(){
  const gantt = olAnsicht==="gantt";
  dialog({
    art:"PDF ausgeben",
    titel: gantt ? "Gantt als PDF" : "Mindmap als PDF",
    werte:{ format: gantt ? "A4" : "auto" },
    felder:[
      {schl:"format", nm:"Blattformat", art:"auswahl", breit:true,
       optionen:[["auto","Von selbst wählen"],["A4","A4 quer"],["A3","A3 quer"],
                 ["A2","A2 quer"],["A1","A1 quer"],["A0","A0 quer"]],
       sub: gantt
         ? "Passt nicht alles auf ein Blatt, wird umgebrochen. Kopf und Namensspalte stehen auf jedem Blatt."
         : "Eine Mindmap wird nie umgebrochen. Ein größeres Blatt macht die Schrift lesbarer."}
    ],
    merk: gantt
      ? "Die Zeitachse wird immer auf die Blattbreite gerechnet. Nur ihre Beschriftung wird gröber."
      : "„Von selbst wählen“ nimmt das kleinste Blatt, auf dem die Schrift noch lesbar bleibt.",
    speichern(w){ gantt ? olPdfGantt(w.format) : olPdfMindmap(w.format); }
  });
}

function pdfGrund(s,titel,unter,sk){
  s.fuell(OL_FARBE.paper).rechteck(0,0,s.B,s.H);
  s.fuell(OL_FARBE.sheet).rund(PRAND-14,PRAND-14,s.B-(PRAND-14)*2,s.H-(PRAND-14)*2,10);
  s.fuell(OL_FARBE.ink).text(titel,PRAND,PRAND+4+3*sk,17*sk,{fett:true});
  s.fuell(OL_FARBE.ink3).text(unter,PRAND,PRAND+16+7*sk,9*sk);
  s.strich(OL_FARBE.rule).dick(0.8).linie(PRAND,PRAND+24+9*sk,s.B-PRAND,PRAND+24+9*sk);
}
function pdfFuss(s,links,rechts,sk){
  s.fuell(OL_FARBE.ink3).text(links,PRAND,s.H-PRAND+4,8*sk);
  s.text(rechts,s.B-PRAND,s.H-PRAND+4,8*sk,{wo:"r"});
}
function olPdfName(was){ return "outliner-"+was+"-"+HEUTE+".pdf"; }
function olPdfGeben(name, seiten){
  const bytes=pdfBauen(seiten);
  const blob=new Blob([bytes],{type:"application/pdf"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function olPdfGantt(format){
  /* Ein Auswahlfeld bietet immer „— ohne —“ an. Das ist kein Format;
     ungeprüft schlüge der Zugriff darauf fehl und die Ausgabe bräche
     ab, ohne etwas zu sagen. */
  if(format!=="auto" && !OL_FORMAT[format]) format="auto";
  const reihen=olReihen();
  if(!reihen.length){ melde("Keine Fristen zum Zeichnen"); return; }
  const [B,H]=OL_FORMAT[format==="auto"?"A4":format];
  const titel=(olFokus?olHole(olFokus).t:BAUM[0].t)||"Gliederung";

  let von=reihen.map(r=>r.von).sort()[0];
  const bis=reihen.map(r=>r.bis).sort().pop();
  const tageBis=(a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
  if(HEUTE<von && tageBis(HEUTE,von)<=90) von=HEUTE;
  const tage=Math.max(1,tageBis(von,bis)+1);

  /* Größere Bogen bekommen größere Schrift — sonst säße auf einem A2
     eine A4-Überschrift: richtig gerechnet und trotzdem verloren. */
  const sk=Math.min(1.6, Math.sqrt(B/842));
  const NAM=Math.round(B*0.23), X0=PRAND+NAM, X1=B-PRAND, FB=X1-X0;
  const px = d => X0 + tageBis(von,d)/tage*FB;

  /* Erst der Umbruch, dann die Zeilenhöhe. Andersherum entschied die
     gewünschte Höhe über den Umbruch, und ein großer Bogen rutschte auf
     zwei Blätter, obwohl alles darauf gepasst hätte. */
  const OBEN=PRAND+80, PLATZ=H-PRAND-40-OBEN;
  const jeSeite=Math.max(3, Math.floor(PLATZ/(20*sk)));
  const anzahl=Math.ceil(reihen.length/jeSeite);
  const ZH=Math.min(46*sk, PLATZ/(anzahl===1?reihen.length:jeSeite));

  const marken=olAchse(von,bis,tage);
  const seiten=[];
  for(let sn=0;sn<anzahl;sn++){
    const s=pdfBlatt(B,H);
    const teil=reihen.slice(sn*jeSeite,(sn+1)*jeSeite);
    const UNTEN=OBEN+teil.length*ZH-ZH/2;
    pdfGrund(s, titel+(sn?" (Fortsetzung)":""),
      "Gantt · Stand "+kurzTag(HEUTE)+" · "+kurzTag(von)+" bis "+kurzTag(bis)
      +" · eigene Fristen des Outliners", sk);
    s.dick(0.7);
    marken.forEach(([a,bez])=>{
      const x=X0+a/100*FB;
      s.strich(OL_FARBE.rule).linie(x,OBEN-16,x,UNTEN);
      s.fuell(OL_FARBE.ink3).text(bez,x+5,OBEN-21,8*Math.min(sk,1.3));
    });
    if(HEUTE>=von && HEUTE<=bis){
      s.strich(OL_FARBE.signal).dick(1).linie(px(HEUTE),OBEN-16,px(HEUTE),UNTEN);
      s.fuell(OL_FARBE.signal).text("heute",px(HEUTE),OBEN-34,7.5*Math.min(sk,1.3),{wo:"m"});
    }
    let y=OBEN;
    teil.forEach(({k,von:v,bis:z,art,tiefe})=>{
      s.fuell(tiefe===0?OL_FARBE.ink:OL_FARBE.ink2)
       .textEng(k.t||"Ohne Text", PRAND+tiefe*12*sk, y+4*sk,
                (tiefe===0?10:9.5)*sk, NAM-16-tiefe*12*sk, {fett:tiefe<=1});
      const x=px(v), br=Math.max(px(z)-x+FB/tage, 4*sk), rot=olSpaet(k), BH=12*sk;
      if(art==="raute"){
        const r=5.5*sk;
        s.fuell(rot?OL_FARBE.signal:OL_FARBE.tinte).weg([[x,y-r],[x+r,y],[x,y+r],[x-r,y]]);
      } else if(art==="fasst"){
        s.strich(OL_FARBE.rule2).dick(1).rund(x,y-BH*0.375,br,BH*0.75,2.5*sk,"S");
      } else {
        s.fuell(rot?OL_FARBE.signal:OL_FARBE.tinte).rund(x,y-BH/2,br,BH,3*sk);
      }
      if(art!=="fasst"){
        const bez = k.von ? kurzTag(v)+" – "+kurzTag(z) : kurzTag(v);
        const bb=pdfBreite(bez,7.5*sk);
        let bx = art==="raute" ? x+10*sk : x+br+6*sk;
        const h=px(HEUTE);
        if(bx-4<h && h<bx+bb+4) bx=x-10*sk-bb;
        if(bx>X0-70 && bx+bb<X1)
          s.fuell(rot?OL_FARBE.signal:OL_FARBE.ink3).text(bez,bx,y+3*sk,7.5*sk);
      }
      y+=ZH;
    });
    s.strich(OL_FARBE.rule).dick(0.8).linie(PRAND,UNTEN+10,X1,UNTEN+10);
    s.fuell(OL_FARBE.ink3).text("Balken: Zeitraum   ·   Raute: einzelne Frist   ·   "
      +"offener Rahmen: fasst die Unterpunkte zusammen",
      PRAND, UNTEN+18+8*sk, 8*sk);
    pdfFuss(s,"Diese Fristen gehören dem Outliner. Sie stehen nicht im Planner, "
      +"nicht im Kalender und nicht im Jahreskalender.",
      (format==="auto"?"A4":format)+" quer · "
      +(anzahl>1 ? "Blatt "+(sn+1)+" von "+anzahl : "ein Blatt"), sk);
    seiten.push(s);
  }
  olPdfGeben(olPdfName("gantt"), seiten);
  melde("PDF ausgegeben · "+(anzahl>1 ? anzahl+" Blätter" : "ein Blatt"));
}

function olPdfMindmap(format){
  if(format!=="auto" && !OL_FORMAT[format]) format="auto";
  const L=olMindLage(11,9.5,12.5);
  if(!L){ melde("Zu wenig zum Zeichnen"); return; }
  const K=L.kaesten;
  const l=Math.min(...K.map(k=>k.x-k.b/2)), r=Math.max(...K.map(k=>k.x+k.b/2));
  const o=Math.min(...K.map(k=>k.y-k.h/2)), u=Math.max(...K.map(k=>k.y+k.h/2));
  const kleinste=Math.min(...K.map(k=>k.gr));

  /* Nie umbrechen. Ein zerschnittener Ast ist kein halber Ast. Also das
     kleinste Blatt nehmen, auf dem die Schrift über sieben Punkt
     bleibt — darunter ist ein Ausdruck nicht mehr zu lesen. */
  const kette = format==="auto" ? ["A4","A3","A2","A1","A0"] : [format];
  let gew=kette[kette.length-1], m=0, B=0, H=0, FX,FY,FB,FH;
  for(const nm of kette){
    [B,H]=OL_FORMAT[nm];
    FX=PRAND+8; FY=PRAND+58; FB=B-2*FX; FH=H-FY-PRAND-26;
    m=Math.min(FB/(r-l), FH/(u-o), 1.5);
    gew=nm;
    if(kleinste*m>=7) break;
  }

  const s=pdfBlatt(B,H);
  const sk=Math.min(1.6,Math.sqrt(B/842));
  pdfGrund(s,(L.wurzel.t||"Gliederung"),
    "Mindmap · Stand "+kurzTag(HEUTE)+" · "+K.length+" Punkte", sk);

  const vx=FX+FB/2-(l+r)/2*m, vy=FY+FH/2-(o+u)/2*m;
  const PX=x=>vx+x*m, PY=y=>vy+y*m;
  L.bogen.forEach(([x1,y1,x2,y2,farbe,d])=>
    s.strich(OL_FARBE[farbe]).dick(d*Math.max(m,0.6)).bogen(PX(x1),PY(y1),PX(x2),PY(y2)));
  K.forEach(k=>{
    const b=k.b*m, h=k.h*m, gr=k.gr*m;
    const x=PX(k.x)-b/2, y=PY(k.y)-h/2;
    s.fuell(k.rot?OL_FARBE.signalS:(k.gr>12?OL_FARBE.raise:OL_FARBE.sheet)).rund(x,y,b,h,5*m);
    s.strich(k.rot?OL_FARBE.signal:OL_FARBE.rule2).dick((k.rot?1:0.8)*Math.max(m,0.6))
     .rund(x,y,b,h,5*m,"S");
    s.fuell(k.rot?OL_FARBE.signal:(k.fett?OL_FARBE.ink:OL_FARBE.ink2))
     .text(k.t,PX(k.x),PY(k.y)+gr*0.35,gr,{wo:"m",fett:k.fett});
  });
  pdfFuss(s,"Die Wurzel in der Mitte, die Äste nach beiden Seiten. Überfälliges ist rot.",
    gew+" quer · ein Blatt", sk);

  olPdfGeben(olPdfName("mindmap"), [s]);
  melde("PDF ausgegeben · "+gew+" quer");
}

/* ---------- Beispieldaten ----------
   Verglichen wird gegen eine frische `vorgabe()`, nicht gegen eine
   Liste von Hand — sonst driftet beides auseinander, sobald jemand ein
   Beispiel ergänzt. */
const EIN_BEREICHE=["kontakte","termine","jahrestermine","aufgaben","notizen",
  "workflows","bausteine","apps","marken","baum"];

/* Erkannt wird **allein über die Kennung**. Sie steht so in
   `vorgabe()`; selbst Angelegtes bekommt eine aus `neueId()` und sieht
   anders aus.

   Damit zählt ein bearbeitetes Beispiel weiter als Beispiel und
   verschwindet mit. Das ist eine Entscheidung, keine Nachlässigkeit:
   Ein Vergleich über den Inhalt könnte es besser — aber nur bei den
   Bereichen ohne Datum. `vorgabe()` erzeugt bewegliche Daten (`K0`,
   `tagPlus`, `HEUTE`); die Inhaltssignatur eines unberührten Termins
   wäre morgen schon eine andere, und er würde fälschlich als
   selbstgemacht durchgehen. Lieber eine Regel, die überall gleich
   gilt — und ein Rückfragedialog, der sie ausspricht. */
function einBeispielPruefer(k){
  const ids=new Set((vorgabe()[k]||[]).map(x=>x.id));
  return x => !!x.id && ids.has(x.id);
}

function beispielZaehlen(){
  const je={}; let summe=0;
  EIN_BEREICHE.forEach(k=>{
    const ist=einBeispielPruefer(k);
    const n=(Z[k]||[]).filter(ist).length;
    je[k]=n; summe+=n;
  });
  return {je, summe};
}

function beispielEntfernen(){
  const weg=new Set();
  EIN_BEREICHE.forEach(k=>{
    const ist=einBeispielPruefer(k);
    const bleibt=(Z[k]||[]).filter(x=>{
      if(ist(x)){ weg.add(k+"|"+x.id); return false; }
      return true;
    });
    ersetze(Z[k], bleibt);
  });
  /* Plätze, die ins Leere zeigen würden, fallen mit. */
  const gut=PINS.filter(p=>p && !weg.has(p.m+"|"+p.id));
  const frei=PINS.length-gut.length;
  ersetze(PINS, gut);
  bewahre(); male();
  melde("Beispieldaten entfernt"+(frei?" · "+frei+(frei>1?" Plätze":" Platz")+" frei":""));
}
