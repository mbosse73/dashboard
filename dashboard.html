<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Fira Code",Consolas,monospace;
  --paper:#f7f5f0; --sheet:#fffefb; --raise:#efece4;
  --rule:#e2ded4;  --rule2:#cbc6ba;
  /* --ink3 trägt jede Metazeile, jeden Hinweis und jeden Zähler — also
     tragenden Text. #87837c kam auf 3,46 : 1 und verfehlte damit die
     eigene Regel von 4,5 : 1. #6b675e liegt bei 5,17 / 5,59 / 4,77 auf
     paper / sheet / raise und sieht fast gleich aus. */
  --ink:#1a1a18;   --ink2:#54514b;  --ink3:#6b675e;
  --tinte:#2f3a8c; --tinte-s:#e7eaf6;
  /* „Kontaktweg hinterlegt“ — ein Zustand, keine Kategorie. Telefon und
     Mail tragen bewusst denselben Ton; die beiden Zeichen unterscheiden
     sich schon von selbst. Farbe bleibt damit der Dringlichkeit vorbehalten. */
  --weg-s:#eef0f8; --weg-i:#4a55a0; --weg-r:#d3d8ec;
  --signal:#a8321f;--signal-s:#fbe9e5;
  --gut:#2b6b46;   --gut-s:#e3f0e8;
  /* Die einzige Stelle, an der Farbe eine Kategorie codiert statt
     Dringlichkeit — die Ausnahme steht in CLAUDE.md und gilt nur
     fuer den Jahreskalender. */
  --k-urlaub:#cfe4d6; --k-sonst:#d3daf0;
  /* Fürs Basecamp-Thema unten: Etikettenschrift, RGB-Trio fürs Schatten,
     zwei Hover-Aufheller, ein Warnrahmen — alles, was sonst hart im Code
     stünde, damit ein Thema es ersetzen kann. */
  --etikett:var(--mono); --ink-rgb:26,26,24;
  --tinte-hauch:#d9dff1; --weg-hauch:#e0e5f5; --warn-rand:#f0cfc7;
}
html,body{background:var(--paper)!important;color:var(--ink)!important;height:100%}
body{font-family:var(--ff);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;border:0;background:transparent;cursor:pointer;color:inherit;text-align:left}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--tinte);outline-offset:2px;border-radius:4px}
::selection{background:var(--tinte-s);color:var(--ink)}
*{scrollbar-color:var(--rule2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule2);border-radius:7px;
  border:3px solid var(--paper);background-clip:padding-box}

/* Zwei Zeilen Hoehe mit Absicht: 100vh ist auf iOS die Hoehe *ohne*
   Safari-Leisten. Im Querformat nehmen die so viel weg, dass der Kopf
   oben aus dem Sichtbaren rutscht — und body{overflow:hidden} laesst
   ihn nicht zurueckholen. 100dvh misst, was wirklich zu sehen ist.
   Die erste Zeile bleibt als Rueckfall fuer aeltere Browser stehen. */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;
  overflow:hidden;background:var(--paper)}
/* ============================================================
   THEMA BASECAMP
   Ein Klick auf den Knopf im Kopf setzt data-theme="basecamp" auf
   body, nicht auf .app — Dialoge und der Meldungszettel hängen als
   eigene Zweige direkt an body. Von body aus erben alle Kindelemente
   diese Werte über die normale CSS-Vererbung der Custom Properties —
   kein JavaScript muss wissen, welche Fläche welche Farbe trägt.
   ============================================================ */
body[data-theme="basecamp"]{
  --paper:#ffffff; --sheet:#ffffff; --raise:#f2f0ea;
  --rule:#ece7d8;  --rule2:#ddd5bd;
  --ink:#0f2b1d;   --ink2:#3d3826;  --ink3:#5f5847;
  --tinte:#1d7a5f; --tinte-s:#eaf5ee;
  --weg-s:#eaf5ee; --weg-i:#1d7a5f; --weg-r:#cfe8db;
  --signal:#b8433a;--signal-s:#fceeea;
  --gut:#c2a63b;   --gut-s:#faf3df;
  --etikett:var(--ff); --ink-rgb:15,43,29;
  --tinte-hauch:#d7ecdf; --weg-hauch:#d7ecdf; --warn-rand:#f3d6cd;
}
/* Was über Tokens hinausgeht: Basecamp trägt einen gefüllten statt
   einem hellen Knopf, Georgia im Dialogtitel und der nächsten
   Verabredung, einen goldenen statt tintenfarbenen Stern, einen
   dunklen statt hellen Meldungszettel. Vier Stellen, kein Token
   könnte das allein abbilden. */
/* :not(.weg):not(.still) — sonst schlägt die Spezifität dieser Regel
   die von .tat.weg und .tat.still, und Löschen/Abbrechen färben sich
   grün mit. */
body[data-theme="basecamp"] .tat:not(.weg):not(.still){background:var(--tinte);color:#fff;
  border-color:var(--tinte);font-weight:800}
body[data-theme="basecamp"] .tat:not(.weg):not(.still):hover{background:#166249}
body[data-theme="basecamp"] .tat.still{background:var(--paper);color:var(--ink2)}
body[data-theme="basecamp"] .tat.still:hover{background:var(--raise);color:var(--ink)}
body[data-theme="basecamp"] .dlg-k{background:var(--raise)}
body[data-theme="basecamp"] .dlg-t{font-family:var(--serif);font-weight:800;letter-spacing:0}
body[data-theme="basecamp"] .naechst-t{font-family:var(--serif);font-weight:700;letter-spacing:0}
body[data-theme="basecamp"] .kk-stern.an,
body[data-theme="basecamp"] .kk-stern.an:hover{color:var(--gut)}
body[data-theme="basecamp"] .zettel{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- Kopf ---------- */
.kopf{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:11px 22px;
  background:var(--sheet);border-bottom:1px solid var(--rule)}
.kopf .zeit{font-family:var(--etikett);font-size:12px;letter-spacing:.07em;color:var(--ink2);
  font-weight:600;font-variant-numeric:tabular-nums}
.kopf .dat{font-family:var(--etikett);font-size:11.5px;letter-spacing:.07em;color:var(--ink3)}
.kopf .sp{flex:1}
.wechsel{display:flex;gap:2px;background:var(--raise);border-radius:9px;padding:3px}
.wechsel button{font-size:12.5px;font-weight:550;color:var(--ink2);padding:6px 14px;
  border-radius:7px}
.wechsel button[aria-current="true"]{background:var(--sheet);color:var(--tinte);
  box-shadow:0 1px 2px rgba(var(--ink-rgb),.06)}
.kopf .akt{font-size:12.5px;color:var(--ink2);border:1px solid var(--rule2);border-radius:8px;
  padding:5px 12px;background:var(--paper)}
.kopf .akt:hover{background:var(--raise);color:var(--ink)}
.kopf .stand{font-family:var(--etikett);font-size:10.5px;color:var(--ink3);letter-spacing:.06em}
.warn{flex-shrink:0;padding:10px 22px;background:var(--signal-s);color:var(--signal);
  font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--warn-rand)}
.warn b{font-weight:700}

.rumpf{flex:1;min-height:0;overflow-y:auto;background:var(--paper)}
.mitte{max-width:860px;margin:0 auto;padding:0 26px 80px;width:100%}
.weit{max-width:1180px}

/* ---------- Abschnitte und Zeilen ---------- */
.abs{display:flex;align-items:center;gap:13px;padding:30px 0 11px}
.abs h2{font-family:var(--etikett);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  font-weight:700;color:var(--ink)}
.abs h2.eilig{color:var(--signal)}
.abs h2.jetzt{color:var(--tinte)}
.abs .r{flex:1;height:1px;background:var(--rule)}
.abs .n{font-family:var(--etikett);font-size:11px;color:var(--ink3)}
.abs button.n:hover{color:var(--ink)}
.hinweis{font-size:12.5px;color:var(--ink3);line-height:1.55;padding:0 0 10px}
/* Ein Gerüst sieht fertig aus — Liste, Knöpfe, Demodaten. Dieses Band
   sagt, was daran noch nicht trägt. Graustufen, keine eigene Farbe:
   „unfertig“ ist keine Dringlichkeit. */
.geruest{display:flex;gap:9px;align-items:baseline;margin:0 0 14px;padding:9px 11px;
  border:1px dashed var(--rule2);border-radius:8px;background:var(--raise)}
.geruest b{font-family:var(--etikett);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);flex-shrink:0}
.geruest span{font-size:12.5px;color:var(--ink2);line-height:1.5}

.z{display:flex;align-items:flex-start;gap:12px;padding:10px 10px 10px 2px;border-radius:8px;
  border-left:2px solid transparent}
.z:hover{background:var(--sheet)}
.z + .z{box-shadow:inset 0 1px 0 var(--rule)}
.z:hover + .z{box-shadow:none}
.z.eilig{border-left-color:var(--signal)}
.z.jetzt{border-left-color:var(--tinte)}
.kast{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--rule2);flex-shrink:0;
  display:grid;place-items:center;background:var(--sheet);margin-top:2px}
.kast:hover{border-color:var(--ink)}
.kast svg{width:10px;height:10px;stroke:var(--tinte);stroke-width:2.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.z.fertig .kast{background:var(--tinte-s);border-color:var(--tinte)}
.z.fertig .kast svg{opacity:1}
.zb{flex:1;min-width:0}
.zt{display:block;font-size:14.5px;line-height:1.4;letter-spacing:-.006em;overflow-wrap:anywhere}
.z.fertig .zt{color:var(--ink3);text-decoration:line-through}
.zm{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.45}
.zr{font-family:var(--etikett);font-size:12px;color:var(--ink3);flex-shrink:0;padding-top:3px;
  font-variant-numeric:tabular-nums}
.zr.eilig{color:var(--signal);font-weight:700}
.zr.jetzt{color:var(--tinte);font-weight:700}
.sig{width:29px;height:29px;border-radius:50%;background:var(--raise);color:var(--ink2);
  display:grid;place-items:center;font-family:var(--etikett);font-size:10.5px;font-weight:700;
  flex-shrink:0;letter-spacing:.04em}
.sig.fav{background:var(--tinte-s);color:var(--tinte)}
.leer{padding:18px 2px;font-size:13px;color:var(--ink3);line-height:1.6}

/* ---------- Kontaktkacheln ----------
   auto-fill statt fester Spaltenzahl: Passt eine Kachel nicht mehr in
   die Reihe, rutscht sie in die nächste. Ein waagerechter Balken kann
   dadurch gar nicht erst entstehen. */
.kkarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:9px}
.kk{position:relative;display:flex;flex-direction:column;gap:10px;padding:13px 14px;
  border:1px solid var(--rule);border-radius:11px;background:var(--sheet);
  transition:border-color .12s,box-shadow .12s}
.kk:hover{border-color:var(--rule2);box-shadow:0 2px 10px rgba(var(--ink-rgb),.05)}
.kk.ist-fav{border-left:2px solid var(--tinte)}
.kk-o{display:flex;align-items:flex-start;gap:11px}
.kk-b{flex:1;min-width:0}
.kk-n{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3;
  overflow-wrap:anywhere}
.kk-f{display:block;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.4;
  overflow-wrap:anywhere}
.kk-u{display:flex;align-items:center;gap:6px;padding-top:2px}
/* Der Klickbereich zum Öffnen deckt die ganze Kachel ab und liegt unter
   den kleineren Zielen. Ohne das läge er über ihnen und schluckte sie. */
.kk-flaeche{position:absolute;inset:0;border-radius:11px;z-index:1}
.kk-u,.kk-stern{position:relative;z-index:2}
.kk-stern{display:grid;place-items:center;width:27px;height:27px;border-radius:7px;
  color:var(--ink3);flex-shrink:0;margin:-2px -3px 0 0}
.kk-stern:hover{background:var(--raise);color:var(--ink2)}
.kk-stern.an,.kk-stern.an:hover{color:var(--tinte)}
.iknopf{position:relative;display:grid;place-items:center;width:34px;height:31px;
  border:1px solid var(--weg-r);border-radius:8px;background:var(--weg-s);color:var(--weg-i);
  transition:background .12s,border-color .12s,color .12s}
.iknopf:hover{background:var(--weg-hauch);border-color:var(--weg-i)}
.iknopf.leer{background:var(--paper);border-color:var(--rule);color:var(--ink3);opacity:.45;
  cursor:default}
.iknopf.leer:hover{background:var(--paper);border-color:var(--rule);color:var(--ink3)}
/* Sagt vor dem Klick, was passiert und mit welchem Ziel. */
.iknopf .blase{position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);font-size:11.5px;line-height:1.35;white-space:nowrap;
  padding:6px 10px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .13s;
  z-index:40;font-family:var(--etikett);letter-spacing:.01em}
.iknopf .blase b{display:block;font-family:var(--ff);font-weight:600;letter-spacing:0;
  margin-bottom:1px}
.iknopf:hover .blase{opacity:1}

/* ---------- Suche innerhalb eines Moduls ---------- */
.msuche{position:relative;margin-top:4px}
.msuche input{width:100%;border:1px solid var(--rule2);border-radius:10px;
  padding:11px 40px 11px 38px;background:var(--sheet);font-size:14.5px;color:var(--ink)}
.msuche input:focus{outline:0;border-color:var(--tinte);box-shadow:0 0 0 3px var(--tinte-s)}
.msuche .lupe{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  color:var(--ink3);pointer-events:none;display:grid}
.msuche .weg{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  color:var(--ink3);padding:5px 8px;border-radius:6px;font-size:12px}
.msuche .weg:hover{background:var(--raise);color:var(--ink)}

/* ---------- Dialog ----------
   Auf und Zu laufen über .schleier und .schleier.auf, niemals über
   eine ID-Regel. Genau daran ist das Umschalten schon einmal
   gebrochen — Fehlerbuch Punkt 6. */
.schleier{position:fixed;inset:0;background:rgba(var(--ink-rgb),.34);display:none;
  place-items:center;padding:18px;z-index:500}
.schleier.auf{display:grid}
.dlg{width:min(620px,100%);max-height:calc(100vh - 36px);max-height:calc(100dvh - 36px);background:var(--sheet);
  border:1px solid var(--rule2);border-radius:14px;box-shadow:0 24px 70px rgba(var(--ink-rgb),.22);
  display:flex;flex-direction:column;overflow:hidden}
.dlg-k{flex-shrink:0;display:flex;align-items:baseline;gap:12px;padding:16px 22px 13px;
  border-bottom:1px solid var(--rule)}
.dlg-k .art{font-family:var(--etikett);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);font-weight:700;white-space:nowrap}
.dlg-t{font-size:17px;font-weight:650;letter-spacing:-.02em;overflow-wrap:anywhere}
.dlg-k .sp{flex:1}
.dlg-zu{font-size:19px;color:var(--ink3);line-height:1;padding:2px 8px;border-radius:6px}
.dlg-zu:hover{background:var(--raise);color:var(--ink)}
.dlg-b{flex:1;min-height:0;overflow-y:auto;padding:16px 22px 20px}
/* Die breite Fassung traegt den Jahreskalender. Sie scrollt nicht in
   sich — ein overflow schnitte die Blasen ueber den Tagen ab. Gescrollt
   wird stattdessen der Schleier, der dafuer oben ausrichtet. */
.schleier.weit{align-items:start;overflow-y:auto}
.dlg.weit{width:min(1080px,100%);max-height:none;overflow:visible}
.dlg.weit .dlg-b{overflow:visible}
.dlg-f{flex-shrink:0;display:flex;align-items:center;gap:9px;padding:12px 22px;
  border-top:1px solid var(--rule);background:var(--paper)}
.dlg-f .sp{flex:1}
.draster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.dfeld{display:flex;flex-direction:column;gap:5px}
.dfeld.breit{grid-column:1/-1}
.dfeld label{font-size:12px;color:var(--ink3);font-weight:500}
.dfeld input,.dfeld textarea,.dfeld select{border:1px solid var(--rule2);border-radius:8px;
  padding:8px 11px;background:var(--paper);font-size:14px;color:var(--ink);width:100%}
.dfeld input:focus,.dfeld textarea:focus,.dfeld select:focus{outline:0;border-color:var(--tinte);
  box-shadow:0 0 0 3px var(--tinte-s);background:var(--sheet)}
.dfeld textarea{min-height:74px;resize:vertical;line-height:1.5}
/* Die Prüfung zeigt auf das schuldige Feld, statt es nur zu melden. */
.dfeld.schief input,.dfeld.schief textarea,.dfeld.schief select{border-color:var(--signal);
  background:var(--signal-s)}

.dfeld.schalter{flex-direction:row;align-items:center;gap:9px;grid-column:1/-1;
  padding:9px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--paper)}
.dfeld.schalter input{width:17px;height:17px;padding:0;accent-color:var(--tinte);flex-shrink:0}
.dfeld.schalter label{font-size:14px;color:var(--ink)}
.dfeld .sub{font-size:12px;color:var(--ink3);line-height:1.45;margin-top:-1px}
/* Einheit im Feld statt in der Beschriftung */
.einheitfeld{position:relative;display:flex;align-items:center}
.einheitfeld .einheit{position:absolute;right:11px;font-size:12.5px;color:var(--ink3);
  pointer-events:none}
.einheitfeld input{padding-right:70px}
/* WebKit gibt Datums- und Zeitfeldern eine eigene Mindestbreite und zentriert
   ihren Wert. Beides schlägt width:100%, das Feld läuft aus seiner Spalte —
   auf dem iPad um gut dreißig Pixel. In Chromium fällt es nicht auf. */
.dfeld input[type=date],.dfeld input[type=time]{min-width:0;
  -webkit-appearance:none;appearance:none}
.dfeld input::-webkit-date-and-time-value{text-align:left;margin:0}
.dfeld input::-webkit-datetime-edit{padding:0}

/* ---------- Formatierungsleiste über mehrzeiligen Feldern ---------- */
.mdfeld{display:flex;flex-direction:column}
.mdleiste{display:flex;align-items:center;gap:2px;padding:4px 5px;flex-wrap:wrap;
  border:1px solid var(--rule2);border-bottom:0;border-radius:8px 8px 0 0;
  background:var(--raise)}
.mdfeld textarea{border-radius:0 0 8px 8px;min-height:104px}
.mdknopf{display:grid;place-items:center;width:28px;height:26px;border-radius:6px;
  color:var(--ink2);flex-shrink:0}
.mdknopf:hover{background:var(--sheet);color:var(--ink)}
.mdknopf svg{width:15px;height:15px}
.mdstrich{width:1px;height:17px;background:var(--rule2);margin:0 3px;flex-shrink:0}
.mdleiste .sp{flex:1}
.mdschau{font-size:11.5px;color:var(--ink3);padding:4px 9px;border-radius:6px;
  font-family:var(--etikett);letter-spacing:.04em}
.mdschau:hover{background:var(--sheet);color:var(--ink)}
.mdschau[aria-pressed="true"]{background:var(--tinte-s);color:var(--tinte)}
/* Vorschau: dieselbe Fläche wie das Feld, damit nichts springt. */
.mdvor{border:1px solid var(--rule2);border-radius:0 0 8px 8px;background:var(--sheet);
  padding:11px 12px;font-size:14px;line-height:1.6;min-height:104px;overflow-wrap:anywhere}
.mdvor > :first-child{margin-top:0}
.mdvor h3{font-size:15.5px;font-weight:650;letter-spacing:-.01em;margin:13px 0 5px}
.mdvor p{margin:0 0 8px}
.mdvor ul{margin:0 0 8px 19px}
.mdvor li{margin-top:2px}
.mdvor hr{border:0;border-top:1px solid var(--rule);margin:12px 0}
.mdvor .leerhin{color:var(--ink3);font-style:italic}
.merk{font-size:12.5px;color:var(--ink2);background:var(--raise);border-radius:9px;
  padding:10px 12px;margin-top:14px;line-height:1.55}
.merk.warn{color:var(--signal);background:var(--signal-s)}
.merk b{font-weight:650}
.merk ul{margin:6px 0 0 17px}
.merk li{margin-top:3px}
.tat.weg{color:var(--signal);border-color:transparent;background:transparent;font-weight:500}
.tat.weg:hover{background:var(--signal-s)}
.tat.weg.ernst{border-color:var(--signal);background:var(--signal-s);font-weight:600}
kbd{font-family:var(--etikett);font-size:11.5px;background:var(--raise);border:1px solid var(--rule);
  border-radius:4px;padding:2px 6px;color:var(--ink2)}
.tat{font-size:12.5px;font-weight:600;background:var(--tinte-s);color:var(--tinte);
  border:1px solid var(--tinte);padding:6px 13px;border-radius:8px;flex-shrink:0}
.tat:hover{background:var(--tinte-hauch)}
.tat.still{background:transparent;color:var(--ink2);border-color:var(--rule2)}
.tat.still:hover{background:var(--sheet);color:var(--ink)}

/* ---------- Leiste ---------- */
.schwelle{padding:11vh 0 0}
@media(max-height:820px){.schwelle{padding-top:6vh}}
.feld{display:flex;align-items:center;gap:15px;border-bottom:2px solid var(--rule2);
  padding-bottom:13px;transition:border-color .16s}
.feld:focus-within{border-color:var(--tinte)}
.feld .c{font-size:24px;color:var(--rule2);line-height:1}
.feld:focus-within .c{color:var(--tinte)}
.feld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:27px;
  font-weight:450;letter-spacing:-.024em;color:var(--ink)}
.feld input::placeholder{color:var(--ink3)}
.feld .k{font-family:var(--etikett);font-size:11px;color:var(--ink3);flex-shrink:0;
  border:1px solid var(--rule);border-radius:5px;padding:3px 7px;background:var(--sheet)}

.tr{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;
  border-left:2px solid transparent;width:100%}
.tr:hover,.tr.wahl{background:var(--sheet);border-left-color:var(--tinte)}
.tr-a{font-family:var(--etikett);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);flex-shrink:0;min-width:82px;font-weight:700}
.tr.wahl .tr-a{color:var(--tinte)}
.tr-b{flex:1;min-width:0}
.tr-t{display:block;font-size:15px;letter-spacing:-.008em;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tr-m{display:block;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tr-k{font-family:var(--etikett);font-size:11px;color:var(--ink3);flex-shrink:0;opacity:0}
.tr:hover .tr-k,.tr.wahl .tr-k{opacity:1}
.rechner{padding:16px 14px;border-radius:10px;background:var(--tinte-s);margin:8px 0 4px}
.rechner .frage{font-family:var(--etikett);font-size:13px;color:var(--tinte)}
.rechner .zahl{font-family:var(--serif);font-size:32px;color:var(--ink);margin-top:5px;
  font-variant-numeric:tabular-nums}

.naechst-t{font-family:var(--serif);font-size:clamp(23px,3vw,31px);line-height:1.12;
  letter-spacing:-.02em;font-weight:400}
.naechst-m{font-size:13.5px;color:var(--ink2);margin-top:9px}
.marken{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:2px}
.mk{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;
  border-left:2px solid transparent}
.mk:hover{background:var(--sheet);border-left-color:var(--tinte)}
.mk b{font-family:var(--etikett);font-size:10.5px;color:var(--ink3);font-weight:700;min-width:20px}
.mk:hover b{color:var(--tinte)}
.mk span{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk:hover span{color:var(--ink)}
.modliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:1px}
.ml{display:flex;align-items:baseline;gap:9px;padding:8px 10px;border-radius:7px}
.ml:hover{background:var(--sheet)}
.ml b{font-family:var(--etikett);font-size:10px;color:var(--ink3);min-width:18px}
.ml span{font-size:13.5px;color:var(--ink2)}
.ml:hover span{color:var(--ink)}
.ml em{font-style:normal;font-family:var(--etikett);font-size:10.5px;color:var(--ink3);
  margin-left:auto}
.ml em.gz{margin-left:8px;border:1px dashed var(--rule2);border-radius:5px;
  padding:1px 5px;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}

/* ---------- Planner ---------- */
.planer{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--paper)}
.spalte{flex:1;min-width:225px;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--rule);background:var(--paper)}
.spalte:last-child{border-right:0}
.spalte.vorrat{flex:0 0 262px;background:var(--sheet);border-right:1px solid var(--rule2)}
.spalte.heute{background:var(--sheet)}
.sp-k{flex-shrink:0;padding:12px 14px 9px;border-bottom:1px solid var(--rule)}
.sp-d{font-family:var(--etikett);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:600}
.spalte.heute .sp-d{color:var(--tinte)}
.sp-n{font-size:14.5px;font-weight:600;margin-top:5px;display:flex;align-items:baseline;gap:8px}
.sp-n em{font-style:normal;font-family:var(--etikett);font-size:11px;color:var(--ink3);margin-left:auto}
.sp-b{flex:1;overflow-y:auto;padding:4px 8px 24px}
.raster{position:relative}
.stunde{display:flex;min-height:44px;border-top:1px solid var(--rule)}
.stunde:first-child{border-top:0}
.stunde.ziel{background:var(--tinte-s)}
.st-t{width:40px;flex-shrink:0;font-family:var(--etikett);font-size:10.5px;color:var(--ink3);
  padding-top:5px;font-variant-numeric:tabular-nums}
.st-l{flex:1;min-width:0;padding:3px 0 3px 6px;display:flex;flex-direction:column;gap:3px}
/* Die freie Stunde ist anklickbar. Ohne Zeichen wäre das unsichtbar —
   beim Zeigen färbt sie sich. Auf dem iPad fällt das weg, dafür gibt
   es die Knöpfe in den Kopfzeilen. */
.st-l{cursor:copy}
.stunde:hover .st-l:empty{background:var(--tinte-s);border-radius:6px}
.blk{border-radius:7px;padding:7px 10px;border:1px solid var(--rule2);background:var(--sheet);
  cursor:grab;border-left-width:3px}
.blk:hover{border-color:var(--tinte)}
.blk.zieht{opacity:.35}
.blk.termin{border-left-color:var(--tinte)}
.blk.aufgabe{border-left-color:var(--gut)}
.blk.spaet{border-left-color:var(--signal)}
.blk{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.blk-b{flex:1;min-width:0}
.blk .t{display:block;font-size:13px;font-weight:600;letter-spacing:-.008em}
.blk .m{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.blk .kast{width:15px;height:15px;border-radius:4px;margin-top:1px}
.blk .kast svg{width:9px;height:9px}
.blk.fertig .t{text-decoration:line-through;color:var(--ink3)}
/* Der Anlegeknopf: rund, ohne Beschriftung, in der Spaltenkopfzeile.
   Am Fuß der Spalte läge er hinter zwölf Stunden Raster — man müsste
   erst scrollen, um etwas anzulegen. Die Kopfzeile bleibt stehen. */
/* Tinte wie bei „Speichern“: Der Knopf ist die tragende Handlung dieser
   Fläche, nicht eine Kategorie. Damit bleibt die Farbregel gewahrt —
   Tinte steht für „jetzt und aktiv“, nicht für „Termine sind blau“.
   Das Blau des Zeichens liegt bei 8,3 : 1 auf der Kreisfläche. */
.sp-neu{margin-left:8px;flex-shrink:0;width:24px;height:24px;border-radius:50%;
  border:1px solid var(--tinte);background:var(--tinte-s);color:var(--tinte);
  display:grid;place-items:center;align-self:center}
.sp-neu svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round}
.sp-neu:hover{background:var(--tinte-hauch)}
.vz{cursor:pointer}
.jetztlinie{position:absolute;left:40px;right:0;height:2px;background:var(--signal);z-index:3}
.jetztlinie::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--signal)}
.jetztlinie span{position:absolute;right:2px;top:-15px;font-family:var(--etikett);font-size:10px;
  font-weight:700;color:var(--signal)}
.vz{display:flex;align-items:flex-start;gap:9px;padding:9px 8px;border-radius:8px;cursor:grab;
  border:1px solid transparent;border-left-width:3px}
.vz:hover{background:var(--paper);border-color:var(--rule);border-left-color:var(--gut)}
.vz.zieht{opacity:.35}
.vz.spaet{border-left-color:var(--signal)}
.wf{padding:9px 8px;border-radius:8px;border-left:3px solid var(--signal);
  background:var(--signal-s);margin-bottom:3px}
.wf .t{font-size:13px;font-weight:600}
.wf .m{font-size:11.5px;color:var(--signal);margin-top:2px}

/* ---------- Modulflächen ---------- */
.zurueck{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);
  padding:6px 0;margin-top:14px}
.zurueck:hover{color:var(--ink)}
.karte{padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--sheet);
  margin-bottom:4px}
.baum{padding-left:0}
.knoten{display:flex;align-items:baseline;gap:9px;padding:6px 8px;border-radius:7px}
.knoten:hover{background:var(--sheet)}
.knoten .pkt{width:5px;height:5px;border-radius:50%;background:var(--rule2);flex-shrink:0}
.knoten .tx{font-size:14px}
textarea.code{width:100%;min-height:150px;border:1px solid var(--rule2);border-radius:9px;
  background:var(--sheet);padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;
  resize:vertical;color:var(--ink)}
textarea.code:focus{outline:2px solid var(--tinte);outline-offset:1px}
.zettel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--sheet);color:var(--ink);border:1px solid var(--rule2);font-size:13.5px;
  padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;z-index:9500;
  box-shadow:0 14px 40px rgba(var(--ink-rgb),.16);
  transition:transform .24s cubic-bezier(.2,.8,.3,1),opacity .24s}
.zettel.an{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Kalender: zwei Werktage nebeneinander ---------- */
.tage{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.tag{border:1px solid var(--rule);border-radius:11px;background:var(--sheet);overflow:hidden}
.tag-k{display:flex;align-items:baseline;gap:9px;padding:11px 14px;
  border-bottom:1px solid var(--rule);background:var(--paper)}
.tag-k .d{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.tag-k .h{font-family:var(--etikett);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinte);font-weight:700}
.tag-k .sp{flex:1}
.tag-k .n{font-family:var(--etikett);font-size:11px;color:var(--ink3)}
.tag-b{padding:6px 8px 10px}
.tagfuss{padding:4px 8px 8px}
.tm{display:flex;align-items:flex-start;gap:11px;padding:8px;border-radius:8px;width:100%;
  text-align:left;border-left:2px solid transparent}
.tm:hover{background:var(--paper);border-left-color:var(--tinte)}
.tm .u{font-family:var(--etikett);font-size:12px;color:var(--ink2);font-weight:600;flex-shrink:0;
  padding-top:1px;font-variant-numeric:tabular-nums}
.tm .b{flex:1;min-width:0}
.tm .t{display:block;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.tm .m{display:block;font-size:12px;color:var(--ink3);margin-top:2px;overflow-wrap:anywhere}
.tm .w{font-family:var(--etikett);font-size:11px;color:var(--ink3);flex-shrink:0;padding-top:2px}

/* ---------- Jahreskalender ----------
   Ein breites, schwebendes Fenster statt einer Modulfläche. Es hängt
   in dlgOffen wie ein Dialog, damit Escape und der Klick daneben ohne
   zweite Mechanik greifen — geöffnet wird es aber nicht über dialog(),
   denn das ruft dialogZu() und schlösse sich selbst, sobald man einen
   Tag anklickt. Der Termin klappt deshalb im Fenster auf. */
.jk-k{display:flex;align-items:center;gap:10px;padding-bottom:13px}
.jk-k .jahrzahl{font-family:var(--serif);font-size:22px;letter-spacing:-.01em}
.jk-k .sp{flex:1}
.jk-k .zahl{font-family:var(--etikett);font-size:11px;color:var(--ink3)}
.jpfeil{width:26px;height:26px;border-radius:7px;border:1px solid var(--rule2);
  background:var(--paper);color:var(--ink2);display:grid;place-items:center;flex-shrink:0}
.jpfeil:hover{background:var(--raise);color:var(--ink)}
.jpfeil svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.9;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

.jahr{border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:7px 9px}
.jz{display:grid;grid-template-columns:32px repeat(31,1fr);align-items:center}
.jm{font-family:var(--etikett);font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink3);font-weight:700}

/* Alle Regeln zu .jt stehen bewusst dicht beieinander: pruefen.mjs
   schlägt an, wenn derselbe Klassenname über mehr als 25 Zeilen
   verteilt gestaltet wird. */
.jt{position:relative;height:27px;display:grid;place-items:center;font-size:11px;
  color:var(--ink2);font-variant-numeric:tabular-nums;cursor:pointer;width:100%}
.jt.keiner{cursor:default}
.jt.urlaub::before{content:"";position:absolute;inset:2px -1px;background:var(--k-urlaub);z-index:0}
.jt.u-anfang::before{left:2px;border-radius:6px 0 0 6px}
.jt.u-ende::before{right:2px;border-radius:0 6px 6px 0}
.jt.sonst::after{content:"";position:absolute;inset:6px -1px;background:var(--k-sonst);z-index:1}
.jt.s-anfang::after{left:3px;border-radius:5px 0 0 5px}
.jt.s-ende::after{right:3px;border-radius:0 5px 5px 0}
.jt.heute::after{content:"";position:absolute;inset:2px 1px;border:1.5px solid var(--tinte);
  border-radius:6px;z-index:2;background:none}
.jt.heute.sonst::after{inset:6px -1px;border:0;background:var(--k-sonst);border-radius:0}
.jt.heute.sonst.s-anfang::after{left:3px;border-radius:5px 0 0 5px}
.jt.heute.sonst.s-ende::after{right:3px;border-radius:0 5px 5px 0}

.jt .n{position:relative;z-index:3;line-height:1}
.jt.we .n{color:#a6a29a}
.jt:hover .n{color:var(--ink);font-weight:700}
.jt.heute .n{color:var(--tinte);font-weight:700}
/* Heute und der gewählte Tag hängen ihre Umrandung an die Zahl, nicht
   an die Zelle: ::before trägt den Urlaub, ::after den sonstigen
   Termin. Beide sind belegt, und eine dritte Regel darauf löschte am
   gewählten Tag die Kategorie — der Urlaubsblock riss dort auf. */
.jt.heute.sonst .n::before{content:"";position:absolute;inset:-8px -6px;
  border:1.5px solid var(--tinte);border-radius:6px;z-index:2}
.jt.wahl .n{color:var(--tinte);font-weight:700}
.jt.wahl .n::after{content:"";position:absolute;inset:-8px -7px;
  border:2px solid var(--tinte);border-radius:7px;z-index:4}

.blase{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--sheet);font-size:11.5px;line-height:1.45;padding:8px 11px;
  border-radius:8px;opacity:0;pointer-events:none;transition:opacity .13s;z-index:40;
  min-width:200px;text-align:left;display:flex;flex-direction:column;gap:4px}
.jz.nachunten .blase{bottom:auto;top:calc(100% + 6px)}
.jt:hover .blase{opacity:1}
.blase b{font-size:11px;color:#b9b6ad;font-weight:600}
.blase .e{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.blase em{font-style:normal;color:#b9b6ad;font-size:10.5px}
.blase .w{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.blase .w.urlaub{background:var(--k-urlaub)}
.blase .w.sonst{background:var(--k-sonst)}
.jz .jt:nth-child(-n+5) .blase{left:0;transform:none}
.jz .jt:nth-last-child(-n+4) .blase{left:auto;right:0;transform:none}

.legende{display:flex;flex-wrap:wrap;gap:9px 20px;padding:13px 2px 0;font-size:12.5px;
  color:var(--ink2)}
.lp{display:flex;align-items:center;gap:8px}
.pr{position:relative;width:29px;height:25px;border-radius:6px;background:var(--paper);
  border:1px solid var(--rule);flex-shrink:0;display:grid;place-items:center}
.pr.urlaub::before{content:"";position:absolute;inset:2px;background:var(--k-urlaub);
  border-radius:5px;z-index:0}
.pr.sonst::after{content:"";position:absolute;inset:6px 2px;background:var(--k-sonst);
  border-radius:4px;z-index:1}
.pr.heute{border:1.5px solid var(--tinte)}
.pr .z{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1;
  position:relative;z-index:3}
.pr .z.blass{color:#a6a29a}
.pr .z.t{color:var(--tinte);font-weight:700}

/* Der Termin klappt im Fenster auf, nicht darüber */
.einbau{margin-top:16px;border-top:1px solid var(--rule);padding-top:16px}
.einbau .k{display:flex;align-items:baseline;gap:11px;padding-bottom:12px}
.einbau .k .art{font-family:var(--etikett);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);font-weight:700}
.einbau .k .tag{font-size:15px;font-weight:650;letter-spacing:-.01em}
.einbau .f{display:flex;align-items:center;gap:9px;padding-top:16px}
.einbau .f .sp{flex:1}
.wahl{display:flex;gap:8px;flex-wrap:wrap}
.wahl button{display:flex;align-items:center;gap:8px;border:1px solid var(--rule2);
  border-radius:8px;padding:8px 13px;font-size:14px;background:var(--paper);color:var(--ink2)}
.wahl button[aria-pressed="true"]{border-color:var(--tinte);background:var(--tinte-s);
  color:var(--ink);font-weight:600}
.wahl .pp{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.wahl .pp.urlaub{background:var(--k-urlaub)}
.wahl .pp.sonst{background:var(--k-sonst)}

/* ---------- Notizen ---------- */
textarea.sz{min-height:120px;font-family:var(--mono);font-size:13px}
.nz{position:relative;border:1px solid var(--rule);border-radius:11px;background:var(--sheet);
  margin-bottom:8px;overflow:hidden}
.nz:hover{border-color:var(--rule2)}
.nz.tel{border-left:2px solid var(--tinte)}
.nz-b{display:block;width:100%;padding:12px 14px}
.nz-k{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.nz-t{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.nz-a{font-family:var(--etikett);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:700}
.nz-w{font-size:12px;color:var(--tinte);background:var(--tinte-s);border-radius:5px;
  padding:1px 7px}
.nz-k .sp{flex:1}
.nz-d{font-family:var(--etikett);font-size:11px;color:var(--ink3);white-space:nowrap}
.nz-v{display:block;font-size:13.5px;line-height:1.6;color:var(--ink2);overflow-wrap:anywhere}
.nz-v > :first-child{margin-top:0}
.nz-v h3{font-size:14.5px;font-weight:650;color:var(--ink);margin:11px 0 4px}
.nz-v p{margin:0 0 7px}
.nz-v ul{margin:0 0 7px 19px}
.nz-v li{margin-top:2px}
.nz-v hr{border:0;border-top:1px solid var(--rule);margin:10px 0}
.nz-v .leerhin{color:var(--ink3);font-style:italic}
.nz-aus{position:absolute;top:10px;right:12px;font-size:11.5px;color:var(--ink3);
  padding:4px 9px;border-radius:6px;opacity:0}
.nz:hover .nz-aus,.nz-aus:focus-visible{opacity:1}
.nz-aus:hover{background:var(--raise);color:var(--ink)}

/* ---------- Schmierzettel, kompakt in der Leiste ----------
   Bewusst ärmer als im Modul: keine Formatierungsleiste, keine
   Vorschau, feste Zeilenschrift. Wer hier schreibt, will eine
   Nummer festhalten, kein Dokument setzen. */
.szk{border:1px solid var(--rule2);border-radius:10px;background:var(--sheet);overflow:hidden}
.szk textarea{width:100%;border:0;outline:0;background:transparent;resize:vertical;
  min-height:76px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;
  line-height:1.55;color:var(--ink)}
.szk:focus-within{border-color:var(--tinte);box-shadow:0 0 0 3px var(--tinte-s)}
.szk-f{display:flex;align-items:center;gap:9px;padding:6px 10px;
  border-top:1px solid var(--rule);background:var(--paper)}
.szk-f .h{font-size:11.5px;color:var(--ink3)}
.szk-f .sp{flex:1}
.szk-f button{font-size:11.5px;color:var(--ink3);padding:3px 8px;border-radius:6px}
.szk-f button:hover{background:var(--raise);color:var(--ink)}
</style>
</head>
<body>

<div class="app">
  <div class="kopf">
    <span class="zeit" id="uhr">—</span>
    <span class="dat" id="datum">—</span>
    <span class="sp"></span>
    <span class="stand" id="stand"></span>
    <button class="akt" id="sichern">Sichern</button>
    <button class="akt" id="ladenBtn">Laden</button>
    <button class="akt" id="export">Export</button>
    <!-- Gesichert wird JSON. Der Filter stand auf .md und hätte die
         Sicherungsdatei im Windows-Dialog ausgeblendet. -->
    <input type="file" id="laden" accept=".json,application/json" hidden>
    <input type="file" id="mdlesen" accept=".md,.markdown,.txt" hidden>
    <div class="wechsel" role="group" aria-label="Oberfläche">
      <button id="w-leiste"  aria-current="true">Leiste</button>
      <button id="w-planner" aria-current="false">Planner</button>
    </div>
    <div class="wechsel" role="group" aria-label="Thema">
      <button id="th-standard" aria-current="true">Standard</button>
      <button id="th-basecamp" aria-current="false">Basecamp</button>
    </div>
  </div>
  <div class="warn" id="warn" hidden></div>
  <div class="rumpf" id="rumpf"></div>
</div>

<div class="zettel" id="zettel" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================

const toMin = t => {
  const [h,m]=String(t==null?"":t).split(":").map(Number);

};

function istWerktag(d){ const t=d.getDay(); return t>=1&&t<=5; }
function naechsterWerktag(v){ const d=new Date(v); d.setHours(0,0,0,0);
  do{ d.setDate(d.getDate()+1); }while(!istWerktag(d)); return d; }
function planTage(){ const h=new Date(); h.setHours(0,0,0,0);
  const a=istWerktag(h)?h:naechsterWerktag(h); return [a,naechsterWerktag(a)]; }
let HEUTE=iso(new Date());

/* Laufendes Jahr fuer die Demodaten des Jahreskalenders. Steht hier
   und nicht in vorgabe(): pruefen.mjs erkennt den Datenbereich nur,
   solange dort woertlich `function vorgabe(){ return {` steht. */
const JJ=HEUTE.slice(0,4);

function frist(x){
  if(!x.d) return "ohne Frist";
  const diff=Math.round((new Date(x.d+"T00:00:00")-new Date(HEUTE+"T00:00:00"))/86400000);
  const d=new Date(x.d+"T00:00:00");
  if(diff<0) return "überfällig";
  if(diff===0) return x.zeit||"heute";
  if(diff===1) return "morgen";
  if(diff<7) return TAGL[d.getDay()];
  return d.getDate()+". "+MONK[d.getMonth()];
}
const istSpaet = x => !x.fertig && x.d && x.d < HEUTE;

/* ---------- Kontaktweg: anrufen und mailen ----------
   Ein echter Verweis, kein window.open. Das ist der Weg, den Edge
   bei file:// am verlässlichsten an Windows durchreicht. Fehlt der
   Weg, bleibt der Knopf trotzdem stehen — nur blass und ohne Ziel.
   So sitzen die Knöpfe auf jeder Kachel an derselben Stelle. */
function wegKnopf(art, ziel){
  const da=!!ziel, was = art==="tel" ? "Anrufen" : "Mailen";
  const n=el(da?"a":"span","iknopf"+(da?"":" leer"));
  if(da) n.href = art==="tel" ? telUri(ziel) : "mailto:"+ziel;
  n.setAttribute("aria-label", da ? was+": "+ziel
    : (art==="tel" ? "Keine Rufnummer hinterlegt" : "Keine Mailadresse hinterlegt"));
  n.innerHTML=IK[art]+'<span class="blase"><b>'+was+'</b>'
    +esc(da?ziel:"nicht hinterlegt")+'</span>';
  n.onclick=e=>e.stopPropagation();
  return n;
}
/* Aus einem Treffer der Leiste heraus gibt es kein <a> zum Anklicken.
   Ein kurz eingehängter Verweis leistet dasselbe. */
function oeffneWeg(url, neuerTab){
  const a=document.createElement("a");
  a.href=url; a.style.display="none";
  /* `rel` gehört zwingend zu `target`: Ohne das bekäme die geöffnete
     Seite über window.opener Zugriff auf diese hier. */
  if(neuerTab){ a.target="_blank"; a.rel="noopener noreferrer"; }
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
   EINE NOTIZ ALS .md — hinaus und zurück

   doku/FEHLERBUCH.md Punkt 5: Ein selbst geschriebener Parser hat
   einen Titel mit Gedankenstrich zerrissen. Deshalb hat der
   Kopfblock hier eine harte Grenze. Er gilt nur, wenn

     die Datei mit --- in Zeile 1 beginnt,
     ein zweites --- innerhalb der ersten zehn Zeilen folgt,
     und dazwischen ausschließlich `schlüssel: wert` steht.

   Trifft eines davon nicht zu, ist die ganze Datei Text. Verloren
   geht dabei nichts — es wandert höchstens in den Rumpf.

   Das ist kein Sicherungsformat. Gesichert wird weiter über JSON;
   diese Dateien sind für den Weg nach draußen.
   ============================================================ */
const KOPFFELDER=["art","titel","d","zeit","wer"];
function notizAlsMd(n){
  const k=["---"];
  KOPFFELDER.forEach(s=>{ if(n[s]) k.push(s+": "+String(n[s]).replace(/\n/g," ")); });
  const w=notizWer(n); if(w && !n.wer) k.push("wer: "+w);   /* Kontaktnamen ausschreiben */
  k.push("---","");
  return k.join("\n")+String(n.text||"").replace(/\s+$/,"")+"\n";
}
function notizAusMd(text, dateiname){
  const z=String(text).replace(/\r\n/g,"\n").split("\n");
  const n=Object.assign({},NLEER,{art:"allgemein",d:HEUTE});
  let ab=0;
  if(z[0].trim()==="---"){
    const zu=z.slice(1,11).findIndex(x=>x.trim()==="---");
    if(zu>=0){
      const kopf=z.slice(1,zu+1);
      if(kopf.length && kopf.every(x=>/^[a-zäöüß]+:\s/.test(x.trim()))){
        kopf.forEach(x=>{ const i=x.indexOf(":");
          const sc=x.slice(0,i).trim(), v=x.slice(i+1).trim();
          if(KOPFFELDER.indexOf(sc)>=0) n[sc]=v; });
        ab=zu+2;
        while(z[ab]!==undefined && z[ab].trim()==="") ab++;
      }
    }
  }
  n.text=z.slice(ab).join("\n").replace(/\s+$/,"");
  if(!n.titel){
    const u=n.text.match(/^#{1,6}\s+(.+)$/m);
    n.titel = u ? u[1].trim()
      : String(dateiname||"").replace(/\.md$/i,"").replace(/^\d{4}-\d\d-\d\d[ _-]*/,"")
        || "Ohne Titel";
  }
  n.id=neueId("n");
  /* Ein Kontaktverweis überlebt den Weg nach draußen nicht — die
     Gegenseite kennt unsere Kennungen nicht. Der Name bleibt als Text. */
  n.kontakt=null;
  return n;
}

/* ============================================================
   MARKDOWN IN MEHRZEILIGEN FELDERN

   Fünf Zeichen, mehr nicht. Der vollständige Umwandler gehört
   nach doku/ROADMAP.md in Schritt 5 — dieser hier ist sein
   Anfang und wird dort um Links, Code und Zitat erweitert,
   statt neu geschrieben zu werden.

   Unterstreichen ist bewusst nicht dabei: Markdown kennt es nicht.
   Weder `_x_` noch `__x__` ergeben eine Unterstreichung, beide sind
   kursiv beziehungsweise fett. Es ginge nur über eingebettetes HTML,
   und dafür ist es zu wenig wert.
   ============================================================ */
const MDTAT=[
  {schl:"fett",  zeichen:"fett",  nm:"Fett",           taste:"b", um:["**","**"]},
  {schl:"kursiv",zeichen:"kursiv",nm:"Kursiv",         taste:"i", um:["*","*"]},
  {strich:true},
  {schl:"gross", zeichen:"gross", nm:"Überschrift",    vor:"## "},
  {schl:"liste", zeichen:"liste", nm:"Aufzählung",     vor:"- "},
  {schl:"linie", zeichen:"linie", nm:"Trennlinie",     block:"---"}
];

/* Setzt die Auszeichnung um die Auswahl. Ohne Auswahl wird ein
   Beispielwort eingesetzt und markiert, damit man gleich tippen kann. */
function mdUm(ta, auf, zu){
  const a=ta.selectionStart, e=ta.selectionEnd, t=ta.value;
  const gewaehlt=t.slice(a,e) || "Text";
  const schon = t.slice(a-auf.length,a)===auf && t.slice(e,e+zu.length)===zu;
  if(schon){                                  /* zweiter Klick nimmt es zurück */
    ta.value = t.slice(0,a-auf.length)+gewaehlt+t.slice(e+zu.length);
    ta.setSelectionRange(a-auf.length, a-auf.length+gewaehlt.length);
  } else {
    ta.value = t.slice(0,a)+auf+gewaehlt+zu+t.slice(e);
    ta.setSelectionRange(a+auf.length, a+auf.length+gewaehlt.length);
  }
}
/* Setzt ein Vorzeichen an jeden Anfang der berührten Zeilen. */
function mdVor(ta, vor){
  const t=ta.value;
  const a=t.lastIndexOf("\n", ta.selectionStart-1)+1;
  let e=t.indexOf("\n", ta.selectionEnd); if(e<0) e=t.length;
  const zeilen=t.slice(a,e).split("\n");
  const alle=zeilen.every(z=>z.startsWith(vor));
  const neu=zeilen.map(z=>alle ? z.slice(vor.length) : vor+z).join("\n");
  ta.value=t.slice(0,a)+neu+t.slice(e);
  ta.setSelectionRange(a, a+neu.length);
}
function mdBlock(ta, block){
  const a=ta.selectionStart, t=ta.value;
  const davor = a===0 || t[a-1]==="\n" ? "" : "\n";
  const text = davor+block+"\n";
  ta.value = t.slice(0,a)+text+t.slice(ta.selectionEnd);
  ta.setSelectionRange(a+text.length, a+text.length);
}
function mdAnwenden(ta, def){
  if(def.um)        mdUm(ta, def.um[0], def.um[1]);
  else if(def.vor)  mdVor(ta, def.vor);
  else if(def.block)mdBlock(ta, def.block);
  ta.focus();
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

/* Der knappe Umwandler. Deckt genau die sechs Zeichen der Leiste ab. */
function mdMalen(text){
  if(!String(text||"").trim()) return '<span class="leerhin">Noch nichts geschrieben.</span>';
  const zeile=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>");
  const aus=[]; let liste=null;
  String(text).split("\n").forEach(z=>{
    const t=z.trim();
    if(/^-{3,}$/.test(t)){ if(liste){aus.push("</ul>");liste=null;} aus.push("<hr>"); return; }
    const u=t.match(/^(#{1,6})\s+(.*)$/);
    if(u){ if(liste){aus.push("</ul>");liste=null;} aus.push("<h3>"+zeile(u[2])+"</h3>"); return; }
    const p=t.match(/^[-*]\s+(.*)$/);
    if(p){ if(!liste){aus.push("<ul>");liste=1;} aus.push("<li>"+zeile(p[1])+"</li>"); return; }
    if(liste){ aus.push("</ul>"); liste=null; }
    if(t) aus.push("<p>"+zeile(t)+"</p>");
  });
  if(liste) aus.push("</ul>");
  return aus.join("");
}

/* ============================================================
   DER DIALOG ALS BAUSTEIN — zwei Ebenen

   Ebene 1  feldMalen / felderMalen — eine Gruppe Eigenschaften
            im Format {schl, nm, art, optionen}. Dasselbe Format
            benutzen die Workflow-Vorlagen in VORLAGEN, deshalb
            kommt Schritt 6 mit dieser Ebene allein aus.
   Ebene 2  dialog — die Hülle darum: Kopf, Fuß, Escape, Klick
            daneben, Löschen mit Rückfrage, Prüfung.
   ============================================================ */
function feldMalen(def, wert, setzen, werte){
  /* `breit` darf eine Funktion sein. Die Notiz braucht das: Steht das
     Datum neben der Uhrzeit, ist es halb so breit — fällt die Uhrzeit
     bei einer allgemeinen Notiz weg, bliebe daneben ein Loch. */
  const breit = def.art==="mehrzeilig"
    || (typeof def.breit==="function" ? def.breit(werte||{}) : def.breit);
  const f=el("div","dfeld"+(breit?" breit":"")+(def.art==="schalter"?" schalter":""));
  let n, huelle=null;
  if(def.art==="mehrzeilig"){ n=el("textarea"); n.value=wert==null?"":wert; }
  else if(def.art==="auswahl"||def.art==="kontakt"){
    n=el("select");
    const opt = def.art==="kontakt"
      ? [["","— keiner —"]].concat(KONTAKTE.slice().sort(nachNachnamen).map(k=>[k.id,knm(k)]))
      : [["","— ohne —"]].concat(def.optionen||[]);
    opt.forEach(([w,t])=>{ const o=el("option",null,esc(t)); o.value=w;
      if(String(w)===String(wert==null?"":wert)) o.selected=true; n.appendChild(o); });
  }
  else if(def.art==="schalter"){ n=el("input"); n.type="checkbox"; n.checked=!!wert; }
  else {
    n=el("input");
    n.type = def.art==="datum" ? "date" : def.art==="zeit" ? "time"
           : def.art==="zahl"  ? "number" : "text";
    n.value = wert==null ? "" : wert;
  }
  n.id="fd-"+def.schl+"-"+(++idZaehler);
  const lab=el("label",null,esc(def.nm));
  lab.setAttribute("for",n.id);
  /* Der Hinweis steht unter dem Feld, nicht zwischen Beschriftung und Feld.
     Im Label wachsen zwei Zeilen nach unten und schieben die Eingabe weg —
     das Feld daneben, das keinen Hinweis hat, beginnt dann höher, und die
     Zeile sitzt schief. Unten wirkt er sich nur auf die Gesamthöhe aus. */
  let sub=null;
  if(def.sub){
    sub=el("div","sub",esc(def.sub));
    sub.id=n.id+"-sub";
    n.setAttribute("aria-describedby",sub.id);
  }

  if(def.art==="mehrzeilig" && def.ohneLeiste!==true){
    huelle=el("div","mdfeld");
    huelle.append(mdLeiste(n), n);
    f.append(lab,huelle);
  }
  else if(def.art==="schalter") f.append(n,lab);
  else if(def.einheit){
    /* Die Einheit gehört ins Feld, nicht in die Beschriftung. Ein Label
       soll benennen („Dauer“), nicht erklären („Dauer in Minuten“). */
    const h=el("div","einheitfeld");
    h.append(n, el("span","einheit",esc(def.einheit)));
    f.append(lab,h);
  }
  else f.append(lab,n);
  if(sub) f.appendChild(sub);

  n.oninput=n.onchange=()=>setzen(
    def.art==="schalter" ? n.checked
    : def.art==="zahl"   ? (n.value===""?null:Number(n.value))
    : n.value);
  f.dazu={knoten:n, def:def};
  return f;
}

function mdLeiste(ta){
  const l=el("div","mdleiste");
  l.setAttribute("role","toolbar");
  l.setAttribute("aria-label","Formatierung");
  MDTAT.forEach(def=>{
    if(def.strich){ l.appendChild(el("span","mdstrich")); return; }
    const b=el("button","mdknopf",IK[def.zeichen]);
    b.type="button";
    b.title=def.nm+(def.taste?"  Strg+"+def.taste.toUpperCase():"");
    b.setAttribute("aria-label",def.nm);
    b.onclick=e=>{ e.preventDefault(); mdAnwenden(ta,def); };
    l.appendChild(b);
  });
  l.appendChild(el("span","sp"));
  /* Vorschau ist ein Blick, kein Zustand: Sie ersetzt das Feld,
     solange sie an ist, und gibt es unverändert zurück. */
  const vor=el("div","mdvor"); vor.hidden=true;
  const schau=el("button","mdschau","Vorschau");
  schau.type="button"; schau.setAttribute("aria-pressed","false");
  schau.onclick=()=>{
    const an = schau.getAttribute("aria-pressed")!=="true";
    schau.setAttribute("aria-pressed",String(an));
    if(an) vor.innerHTML=mdMalen(ta.value);
    vor.hidden=!an; ta.hidden=an;
    if(!an) ta.focus();
  };
  l.appendChild(schau);
  ta.after ? null : null;
  /* Die Vorschau wird gleich hinter das Feld gehängt, sobald es hängt. */
  setTimeout(()=>{ if(ta.parentNode && !vor.parentNode) ta.after(vor); },0);

  ta.addEventListener("keydown",e=>{
    if(!(e.metaKey||e.ctrlKey)) return;
    const def=MDTAT.find(d=>d.taste===e.key.toLowerCase());
    if(def){ e.preventDefault(); e.stopPropagation(); mdAnwenden(ta,def); }
  });
  return l;
}

/* Ein Feld darf sagen, wann es überhaupt gilt: `nurWenn(werte)`. Eine
   allgemeine Notiz hat keinen Anrufer und keine Uhrzeit — die Maske
   fragt dann gar nicht erst danach. Neu gezeichnet wird nur, wenn ein
   Feld mit `schaltet:true` sich ändert; bei jedem Tastendruck neu zu
   zeichnen, risse den Schreibzeiger aus dem Feld. */
function felderMalen(felder, werte, beiAenderung){
  const r=el("div","draster");
  r.felder=[];
  const gilt=def=>!def.nurWenn || def.nurWenn(werte);

  function zeichne(){
    r.innerHTML=""; r.felder.length=0;
    felder.filter(gilt).forEach(def=>{
      const f=feldMalen(def, werte[def.schl], v=>{
        werte[def.schl]=v; f.classList.remove("schief");
        if(beiAenderung) beiAenderung(werte, def);
        if(def.schaltet) neu(def.schl);
      }, werte);
      r.felder.push(f); r.appendChild(f);
    });
  }
  /* Nach dem Neuzeichnen zurück in das Feld, das die Änderung ausgelöst
     hat — sonst steht der Schreibzeiger plötzlich woanders. */
  function neu(schl){
    zeichne();
    const z=r.felder.find(f=>f.dazu.def.schl===schl);
    if(z) z.dazu.knoten.focus();
  }

  zeichne();
  return r;
}

let dlgOffen=null;
function dialogZu(){ if(dlgOffen){ dlgOffen.remove(); dlgOffen=null; } }

function dialog(o){
  dialogZu();
  /* Am Entwurf wird gearbeitet, nie an den echten Daten. Sonst
     hinterließe „Abbrechen“ die halbe Eingabe im Datenbestand. */
  const w=Object.assign({}, o.werte);
  const titel=()=> (typeof o.titel==="function" ? o.titel(w) : o.titel) || "—";

  const d=el("div","dlg");
  d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.setAttribute("aria-label", o.art||"Dialog");

  const kopf=el("div","dlg-k",'<span class="art">'+esc(o.art||"")+'</span>'
    +'<h2 class="dlg-t">'+esc(titel())+'</h2><span class="sp"></span>');
  const zu=el("button","dlg-zu","×");
  zu.setAttribute("aria-label","Schließen"); zu.onclick=dialogZu;
  kopf.appendChild(zu);
  d.appendChild(kopf);

  const rumpf=el("div","dlg-b");
  /* Auch der Merkkasten darf vom Stand abhängen. Sonst spricht er bei
     einer allgemeinen Notiz weiter vom Anrufer, den die Maske gerade
     ausgeblendet hat. */
  const merkText=()=> typeof o.merk==="function" ? o.merk(w) : o.merk;
  const merk = o.merk ? el("div","merk",merkText()) : null;
  const raster=felderMalen(o.felder, w, ()=>{
    const t=d.querySelector(".dlg-t"); if(t) t.textContent=titel();
    if(merk) merk.innerHTML=merkText();
  });
  rumpf.appendChild(raster);
  if(merk) rumpf.appendChild(merk);
  d.appendChild(rumpf);

  const fuss=el("div","dlg-f");
  if(o.loeschen){
    const lo=el("button","tat weg","Löschen");
    lo.onclick=()=>dlgLoeschfrage(o,w,rumpf,fuss);
    fuss.appendChild(lo);
  }
  fuss.appendChild(el("span","sp"));
  const ab=el("button","tat still","Abbrechen"); ab.onclick=dialogZu;
  const sp=el("button","tat","Speichern");
  sp.onclick=()=>{
    const schief = o.pruefe ? o.pruefe(w) : null;
    if(schief){
      melde(schief.text||schief);
      /* Das schuldige Feld wird gezeigt, nicht nur gemeldet. */
      const ziel=raster.felder.find(f=>f.dazu.def.schl===schief.schl);
      if(ziel){ ziel.classList.add("schief"); ziel.dazu.knoten.focus(); }
      return;
    }
    /* Was die Maske nicht zeigt, wird auch nicht gespeichert. Sonst
       bliebe an einer allgemeinen Notiz die Uhrzeit eines früheren
       Anrufs hängen — vorhanden, aber nirgends zu sehen. */
    o.felder.forEach(d=>{
      if(d.nurWenn && !d.nurWenn(w)) w[d.schl] = d.art==="text" ? "" : null;
    });
    o.speichern(w); dialogZu();
  };
  fuss.append(ab,sp);
  d.appendChild(fuss);

  const s=el("div","schleier auf");
  s.appendChild(d);
  s.onclick=ev=>{ if(ev.target===s) dialogZu(); };
  document.body.appendChild(s);
  dlgOffen=s;
  const erstes=d.querySelector("input,textarea,select"); if(erstes) erstes.focus();
  return d;
}

function dlgLoeschfrage(o,w,rumpf,fuss){
  rumpf.innerHTML="";
  rumpf.appendChild(el("div","merk warn",
    typeof o.loeschen.frage==="function" ? o.loeschen.frage(w) : o.loeschen.frage));
  fuss.innerHTML="";
  const ja=el("button","tat weg ernst","Ja, löschen");
  ja.onclick=()=>{ o.loeschen.tun(w); dialogZu(); };
  fuss.appendChild(ja);
  fuss.appendChild(el("span","sp"));
  const nein=el("button","tat still","Doch nicht");
  nein.onclick=()=>dialog(o);
  fuss.appendChild(nein);
}

   Ein Workflow ist eine Schablone: feste Teilschritte in fester
   Reihenfolge, dazu Eigenschaften — auf Instanz- und auf
   Schrittebene. Die Vorlage trägt nur Namen und Feldarten,
   keine Werte.

   Eine Instanz ist eine Ausprägung davon: gleiche Schritte,
   gleiche Eigenschaften, eigene Werte.

   Vorlagen stehen fest im Code. Ein Editor dafür ist bewusst
   nicht vorgesehen — erst wenn ein Ablauf sich eingespielt hat,
   weiß man, was ein Editor können müsste.

     Instanz     titel   — sonst ist sie in Listen nicht auffindbar
     Teilschritt frist   — sonst wüsste niemand, was überfällig ist

   Der Status ergibt sich aus der Position: Es gibt genau einen
   aktiven Schritt. Alles davor ist erledigt, alles danach offen.
   Deshalb speichert die Instanz nur den Schlüssel des aktiven
   Schritts — nicht dessen Position. Eine Position würde brechen,
   sobald jemand die Vorlage ändert.
   ============================================================ */

/* Nachbessern, was das Zeichnen sonst umwirft.
   Eine Sicherung kommt von der Platte — von Hand bearbeitet, aus einer
   älteren Fassung, halb geschrieben. Ein Termin ohne `zeit` hat früher
   `toMin` zerrissen und damit Leiste und Planner gleichzeitig geleert;
   ein Termin ohne `dauer` verschwindet still aus „Läuft gerade". Beides
   wird hier einmal geradegezogen, nicht an jeder Lesestelle einzeln.
   Läuft über Z, also für den Start aus localStorage und für das Laden
   einer Datei gleichermaßen. */
function heile(z){
  let n=0;
  (z.termine||[]).forEach(t=>{
    if(!/^\d{1,2}:\d{2}$/.test(String(t.zeit))){ t.zeit="09:00"; n++; }
    if(!(Number(t.dauer)>0)){ t.dauer=30; n++; }
  });
  /* Bookmarks hatten anfangs keine id — sie wurden über ihre Adresse
     erkannt, und `pins` merkte sich ebenfalls die Adresse. Sobald sich
     eine Adresse bearbeiten lässt, trägt das nicht mehr: Die Anheftung
     risse ab, und zwei Marken mit derselben Adresse wären nicht zu
     unterscheiden. Einmal nachgezogen — beim Start wie beim Laden einer
     älteren Sicherung. Die Vorgabe läuft absichtlich durch denselben
     Weg, damit er bei jedem Start benutzt wird und nicht verrottet. */
  (z.marken||[]).forEach((m,i)=>{ if(!m.id){ m.id="m-"+(i+1); n++; } });
  if(Array.isArray(z.pins)){
    const gilt=[];
    z.pins.forEach(p=>{
      if((z.marken||[]).some(m=>m.id===p)){ gilt.push(p); return; }
      const m=(z.marken||[]).find(x=>x.u===p);
      n++;
      /* Zeigt ein Platz ins Leere, fällt er weg. Ein leerer Platz in der
         Mitte verschöbe sonst alle Tastenkürzel dahinter. */
      if(m) gilt.push(m.id);
    });
    if(gilt.length!==z.pins.length || gilt.some((p,i)=>p!==z.pins[i])){
      z.pins.length=0; gilt.forEach(p=>z.pins.push(p));
    }
  }
  return n;
}

/* Kurznamen: dieselben Arrays, nicht Kopien */
const KONTAKTE=Z.kontakte, WORKFLOWS=Z.workflows, BAUSTEINE=Z.bausteine,
      APPS=Z.apps, MARKEN=Z.marken, PINS=Z.pins, BAUM=Z.baum;
const DATEN = Z;                       /* DATEN.termine, .aufgaben, .notizen */

/* Inhalt austauschen, ohne den Verweis zu zerreißen */
function ersetze(ziel, neu){ ziel.length=0; neu.forEach(x=>ziel.push(x)); }

/* Beide vertragen einen fehlenden Vornamen: Pflicht ist nur der
   Nachname, und ohne diese Absicherung liefert ini() „undefinedM“. */
const knm=k=>((k.vor||"")+" "+(k.nach||"")).trim();
const kfind=id=>KONTAKTE.find(k=>k.id===id);
const ini=k=>(((k.vor||"")[0]||"")+((k.nach||"")[0]||"")).toUpperCase()||"?";
/* Der einzige Weg, einen Kontakt für die Anzeige aufzulösen.
   Kontakte sind das Rückgrat — Notizen, Aufgaben, Termine und
   Workflows verweisen darauf. Zeigt ein Verweis ins Leere, darf das
   die Zeichnung nicht abbrechen, sondern nur nichts anzeigen. */
const kname=id=>{ const k=id?kfind(id):null; return k?knm(k):""; };
/* tel: verträgt keine Leerzeichen und Bindestriche. */
const telUri=t=>"tel:"+String(t||"").replace(/[^\d+]/g,"");
/* Der aktive Schritt und alles, was daraus folgt */
function wfSchritte(w){ const v=wfVorlage(w.vorlage); return v ? v.schritte : []; }
function wfIndex(w){ return wfSchritte(w).findIndex(s=>s.schl===w.aktiv); }
function wfAktiv(w){ const i=wfIndex(w); return i<0 ? null : wfSchritte(w)[i]; }
function wfFrist(w){ const a=wfAktiv(w); return a && w.schritte[a.schl] ? w.schritte[a.schl].frist : null; }
function wfSpaet(w){ const f=wfFrist(w); return !!f && f<HEUTE; }
function wfFertig(w){ return wfIndex(w)<0; }          /* aktiv zeigt ins Leere = durch */
function wfStand(w){
  const l=wfSchritte(w), i=wfIndex(w);
  if(i<0) return "abgeschlossen";
  return "Schritt "+(i+1)+" von "+l.length+" · "+l[i].nm;
}
/* Lage eines Schritts ergibt sich aus der Position, nicht aus einem Feld */
function wfLage(w, schl){
  const l=wfSchritte(w), i=wfIndex(w), j=l.findIndex(s=>s.schl===schl);
  if(i<0) return "fertig";
  if(j<i) return "fertig";
  if(j>i) return "offen";
  return wfSpaet(w) ? "spaet" : "aktiv";
}

/* Eindeutige Kennungen, auch bei schneller Eingabe */
let idZaehler=0;
function neueId(p){ return p+"-"+Date.now().toString(36)+"-"+(++idZaehler); }

/* ============================================================
   3 — DAS MODULREGISTER

   Hier liegt der eigentliche Trick. Kein Modul wird von der
   Leiste oder vom Planner namentlich gekannt. Jedes Modul meldet
   sich selbst an und sagt dabei drei Dinge:

     suche(q)    liefert Treffer für die Leiste
     erfassen(d) liefert Angebote, wenn nichts gefunden wurde
     flaeche(b)  zeichnet eine eigene Oberfläche, falls nötig

   Ein neues Modul ist damit ein Objekt in dieser Liste — an der
   Leiste, am Planner und an der Navigation ändert sich nichts.
   Outliner und Code-Beautifier unten sind genau so entstanden.
   ============================================================ */
const MODULE=[];
function registriere(m){ MODULE.push(m); return m; }
function modul(id){ return MODULE.find(m=>m.id===id); }

/* Treffer-Bausatz für die Leiste */
function treff(art,titel,meta,taste,fn){
  return {art,titel,meta,taste:taste||"↵",fn};
}

registriere({
  id:"kontakte", nr:"02", nm:"Kontakte",
  zahl:()=>KONTAKTE.length,
  /* Favoriten ab dem ersten Buchstaben, übrige ab dem dritten.
     Ein Kontakt liefert zwei eigenständige Treffer. */
  /* Treffer für die Leiste. Favoriten ab dem ersten Buchstaben, übrige
     ab dem dritten; Favoriten stehen oben. Ein Kontakt liefert einen
     Treffer je hinterlegtem Weg — wer weder Nummer noch Adresse hat,
     bekommt stattdessen einen Treffer, der ihn im Modul zeigt. Sonst
     fiele er aus der Suche heraus, ohne woanders aufzutauchen. */
  suche(q){
    const out=[];
    KONTAKTE.filter(k=>{
      const f=(knm(k)+" "+(k.firma||"")).toLowerCase();
      if(!f.includes(q)) return false;
      return k.fav ? q.length>=1 : q.length>=3;
    }).sort((a,b)=> (a.fav===b.fav) ? nachNachnamen(a,b) : (a.fav?-1:1))
    .forEach(k=>{
      const wo=(k.firma||"")+(k.fav?" · Favorit":"");
      if(k.tel) out.push(treff("Anrufen",knm(k),k.tel+(wo?" · "+wo:""),"↵",
        ()=>{ oeffneWeg(telUri(k.tel)); melde("Anruf an "+k.tel+" übergeben"); }));
      if(k.mail) out.push(treff("Mailen",knm(k),k.mail,"↵",
        ()=>{ oeffneWeg("mailto:"+k.mail); melde("Mail an "+k.mail+" übergeben"); }));
      if(!k.tel&&!k.mail) out.push(treff("Kontakt",knm(k),
        (wo?wo+" · ":"")+"kein Weg hinterlegt","↵",()=>zeigeFlaeche("kontakte")));
    });
    return out;
  },
  erfassen(d){ return [treff("Kontakt",d.titel,"als neuer Kontakt anlegen","↵",
    ()=>kontaktDialog(null, d.titel))]; },

  flaeche(b){
    const q=kSuche.trim().toLowerCase();
    const passt=k=>!q||((knm(k)+" "+(k.firma||"")+" "+(k.tel||"")+" "+(k.mail||"")
      +" "+(k.notiz||"")).toLowerCase().includes(q));
    const fav=KONTAKTE.filter(k=>k.fav&&passt(k)).sort(nachNachnamen);
    const rest=KONTAKTE.filter(k=>!k.fav&&passt(k)).sort(nachNachnamen);

    b.appendChild(abschnitt("Kontakte", String(KONTAKTE.length)));
    b.appendChild(kSuchfeld());

    if(q){
      /* Ein einziger Ergebnisraum, Favoriten zuoberst. */
      b.appendChild(abschnitt("Gefunden",(fav.length+rest.length)+" von "+KONTAKTE.length));
      if(!fav.length&&!rest.length){
        b.appendChild(el("div","leer","Kein Kontakt passt zu „"+esc(kSuche)+"“."));
        return;
      }
      if(fav.length){
        b.appendChild(el("div","hinweis","Favoriten stehen auch im Suchergebnis oben."));
        b.appendChild(kachelraster(fav));
      }
      if(rest.length){
        if(fav.length) b.appendChild(abschnitt("Weitere",String(rest.length)));
        b.appendChild(kachelraster(rest));
      }
      return;
    }

    b.appendChild(abschnitt("Favoriten", fav.length?String(fav.length):null, "jetzt"));
    if(fav.length){
      b.appendChild(el("div","hinweis",
        "Diese stehen in der Leiste als direkt verwendbare Kontakte."));
      b.appendChild(kachelraster(fav));
    } else b.appendChild(el("div","leer",
      "Noch kein Favorit. Der Stern auf einer Kachel macht einen daraus."));

    const a=abschnitt("Alle Kontakte", null);
    const neu=el("button","n","neuer Kontakt +");
    neu.onclick=()=>kontaktDialog(null);
    a.appendChild(neu);
    b.appendChild(a);
    if(rest.length) b.appendChild(kachelraster(rest));
    else b.appendChild(el("div","leer","Außer den Favoriten ist niemand erfasst."));
  }
});

/* Suchstand des Moduls. Bewusst außerhalb von Z: Er beschreibt die
   Ansicht, nicht die Daten, und hat in einer Sicherung nichts verloren. */
let kSuche="";
function kSuchfeld(){
  const s=el("div","msuche",'<span class="lupe">'+IK.lupe+'</span>');

    const n=document.querySelector(".msuche input");

  };
  s.appendChild(i);
  if(kSuche){

/* ---------- Der Kontaktdialog ----------
   Bewusst kontaktspezifisch. In Schritt 2 der Roadmap wird daraus der
   gemeinsame Baustein — die Felder sind deshalb schon in seinem Format
   beschrieben: {schl, nm, art}. Dasselbe Format tragen die
   Eigenschaften der Workflow-Vorlagen. */
/* Zwei Blöcke: wer die Person ist, dann wie man sie erreicht. Vorname
   vor Nachname wie in Outlook, Apple Kontakte und Google Kontakte.
   Die Firma steht breit dazwischen, sonst bliebe neben der E-Mail ein
   Loch in der Zeile. */
const KFELDER=[
  {schl:"vor",   nm:"Vorname",  art:"text"},
  {schl:"nach",  nm:"Nachname", art:"text"},
  {schl:"firma", nm:"Firma",    art:"text", breit:true},
  {schl:"tel",   nm:"Telefon",  art:"text"},
  {schl:"mail",  nm:"E-Mail",   art:"text"},
  {schl:"notiz", nm:"Notizen",  art:"mehrzeilig"},
  {schl:"fav",   nm:"Als Favorit markieren", art:"schalter",
   sub:"Favoriten stehen im Modul und in der Leiste oben."}
];
const KLEER={id:null,nach:"",vor:"",firma:"",tel:"",mail:"",fav:false,notiz:""};

/* Der ganze Dialog ist jetzt ein Aufruf. Kopf, Fuß, Escape, Klick
   daneben, Löschrückfrage und Prüfung stecken im Baustein. */
function kontaktDialog(k, vorbelegt){
  const neu=!k;
  const start=Object.assign({}, KLEER, k||{});
  if(neu&&vorbelegt) start.nach=vorbelegt;
  dialog({
    art: neu ? "Neuer Kontakt" : "Kontakt bearbeiten",
    titel: w=>knm(w),
    felder: KFELDER,
    werte: start,
    merk: "<b>Pflicht ist nur der Nachname.</b> Alles Übrige darf leer bleiben. Fehlt eine "
      +"Nummer oder eine Adresse, bleibt der zugehörige Knopf auf der Kachel sichtbar, "
      +"aber blass und ohne Wirkung.",
    pruefe: w=>String(w.nach||"").trim() ? null
      : {schl:"nach", text:"Ohne Nachnamen geht es nicht."},
    loeschen: neu ? null : {
      frage: w=>{
        const n=kVerweise(k.id,false);
        return "<b>"+esc(knm(w))+" wirklich löschen?</b><ul>"
          +"<li>Die Kachel verschwindet aus dem Modul und aus der Leiste.</li>"
          +"<li>"+(n
            ? n+" Verweis"+(n>1?"e":"")+" in Aufgaben, Terminen, Notizen und Workflows "
              +"werden geleert — auch in den Teilschritten der Workflows."
            : "Kein Eintrag verweist auf diesen Kontakt.")+"</li>"
          +"<li>Die Einträge selbst bleiben erhalten. Es verschwindet nur der Name daneben.</li>"
          +"</ul>";
      },
      tun: ()=>kLoeschen(k)
    },
    speichern: w=>kSpeichern(w,neu)
  });
}

function kSpeichern(w,neu){
  ["nach","vor","firma","tel","mail"].forEach(s=>w[s]=String(w[s]||"").trim());
  if(neu){ w.id=neueId("k"); KONTAKTE.push(w); }
  else {
    /* An Ort und Stelle ändern. Ein Austausch des Eintrags im Array
       risse die Verweise ab, die anderswo auf dieses Objekt zeigen. */
    const z=kfind(w.id);
    if(!z){ melde("Der Kontakt ist nicht mehr da."); male(); return; }
    Object.keys(KLEER).forEach(s=>{ z[s]=w[s]; });
  }
  bewahre(); male();
  melde(knm(w)+(neu?" angelegt":" gespeichert"));
}

/* ---------- Verweise auf einen Kontakt ----------
   Mit leeren=false wird nur gezählt, sonst auf null gesetzt.

   Die betroffenen Schlüssel der Workflows stehen absichtlich nicht
   fest im Code. Sie ergeben sich aus VORLAGEN — aus jeder Eigenschaft
   mit art:"kontakt", auf Instanz- wie auf Teilschrittebene. Fest
   eingetragene Namen brächen still, sobald eine Vorlage wächst. */
function kVerweise(id, leeren){
  let n=0;
  const pruef=(o,s)=>{ if(o&&o[s]===id){ n++; if(leeren) o[s]=null; } };
  [DATEN.termine, DATEN.aufgaben, DATEN.notizen].forEach(l=>
    l.forEach(x=>pruef(x,"kontakt")));
  WORKFLOWS.forEach(w=>{
    const v=wfVorlage(w.vorlage); if(!v) return;
    (v.eigenschaften||[]).forEach(e=>{
      if(e.art==="kontakt") pruef(w.werte, e.schl); });
    (v.schritte||[]).forEach(s=>{
      const st=w.schritte&&w.schritte[s.schl];
      (s.eigenschaften||[]).forEach(e=>{
        if(e.art==="kontakt") pruef(st&&st.werte, e.schl); });
    });
  });
  return n;
}

function kLoeschen(k){
  const nm=knm(k), n=kVerweise(k.id,true);
  const i=KONTAKTE.indexOf(k);
  if(i>=0) KONTAKTE.splice(i,1);       /* splice, nie neu zuweisen */
  bewahre(); male();
  melde(nm+" gelöscht"+(n?" · "+n+" Verweis"+(n>1?"e":"")+" geleert":""));
}
