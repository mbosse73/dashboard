let vorlage=null;

/* ---------- Der Code-Beautifier, ausführlich ---------- */

/* JSON erkennt man an der Klammer, SQL am ersten Wort. Beides bewusst
   streng: Ein Angebot, das bei jedem zweiten Buchstaben aufpoppt, ist
   lästiger als keins. */
const cbIstJSON = t => (t.startsWith("{")||t.startsWith("[")) && t.length>6;
const CB_SQL_ANFANG=/^\s*(--|\/\*)?[\s\S]{0,80}?\b(select|with|insert\s+into|update|delete\s+from|create\s+(table|view)|alter\s+table|drop\s+table|truncate)\b/i;
function cbIstSQL(t){
  if(!t || t.length<10 || cbIstJSON(t)) return false;
  /* Nur der Anfang zählt. Ein „select“ mitten in einem Fließtext macht
     daraus keine Abfrage. */
  const erstesWort=(t.match(/[A-Za-zÄÖÜäöü]+/)||[""])[0].toLowerCase();
  if(!["select","with","insert","update","delete","create","alter","drop","truncate"].includes(erstesWort)
     && !t.trimStart().startsWith("--") && !t.trimStart().startsWith("/*")) return false;
  return CB_SQL_ANFANG.test(t);
}

let cbArt="json", cbEin="", cbAus="", cbFehler="";

function cbMalen(b){
  if(vorlage){ cbArt=vorlage.art; cbEin=vorlage.text; cbAus=""; cbFehler=""; vorlage=null; }
  if(!cbEin) cbEin = cbArt==="sql"
    ? "select k.name, count(a.id) as offen from kontakte k left join aufgaben a on a.kontakt=k.id where k.fav=true group by k.name order by offen desc"
    : '{"name":"Nordstern","tags":["a","b"],"aktiv":true}';

  /* Keine eigene Überschrift: `male()` setzt schon „16 · Code-Beautifier“
     darüber, und der Schalter sagt die Art. Zweimal dasselbe zu lesen
     kostet nur Platz. */
  const schalter=el("div","cb-schalter");
  [["json","JSON"],["sql","SQL"]].forEach(([id,nm])=>{
    const kn=el("button",null,nm);
    kn.setAttribute("aria-current",String(cbArt===id));
    kn.onclick=()=>{ cbArt=id; cbAus=""; cbFehler=""; male(); };
    schalter.appendChild(kn);
  });
  b.appendChild(schalter);

  const ein=el("textarea","code");
  ein.value=cbEin;
  ein.setAttribute("aria-label", cbArt==="sql" ? "SQL eingeben" : "JSON eingeben");
  ein.oninput=()=>{ cbEin=ein.value; };
  b.appendChild(ein);

  const knopf=el("button","tat","Formatieren");
  knopf.style.margin="10px 0";
  knopf.onclick=()=>{
    if(cbArt==="json"){
      try{ cbAus=JSON.stringify(JSON.parse(cbEin),null,2); cbFehler=""; melde("Formatiert"); }
      catch(e){ cbAus=""; cbFehler="Kein gültiges JSON: "+e.message; melde("Kein gültiges JSON"); }
    } else {
      const r=sqlFormatiere(cbEin);
      if(r.ok){ cbAus=r.text; cbFehler=""; melde("Formatiert · "+(r.zeilen||0)+" Zeilen"); }
      else { cbAus=""; cbFehler=r.grund; melde("Nicht formatiert"); }
    }
    male();
  };
  b.appendChild(knopf);

  if(cbFehler){
    /* Kein Ergebnis heißt: kein Ergebnis. Halb formatierter Code, dem
       ein Wort fehlt, wäre schlimmer als eine Meldung. */
    b.appendChild(el("div","merk warn",esc(cbFehler)));
  }
  const aus=el("textarea","code"); aus.readOnly=true; aus.value=cbAus;
  aus.setAttribute("aria-label","Ergebnis");
  b.appendChild(aus);

  if(cbArt==="sql") b.appendChild(el("div","hinweis",
    "Der Formatierer setzt Zeilenumbrüche — er ist kein Parser und kennt "
    +"keinen Dialekt. Großgeschrieben werden nur Schlüsselwörter; Tabellen- "
    +"und Spaltennamen bleiben Zeichen für Zeichen so stehen, wie sie "
    +"getippt wurden. Danach wird die Ausgabe erneut zerlegt und mit der "
    +"Eingabe verglichen. Weicht etwas ab, wird nichts ausgegeben."));
}

/* ---------- Zerlegen ----------
   Reihenfolge ist Absicht: Kommentare und Zeichenketten zuerst, sonst
   zerlegt der Rest ihren Inhalt mit. */
/* Mehrzeichige Operatoren, nach Laenge getrennt. Was hier fehlt,
   zerfaellt in Einzelzeichen — die Klebeprobe unten faengt das ab und
   verweigert, statt still etwas Kaputtes auszugeben. */
const OP3=["->>","#>>","!~*","<=>","<<=",">>=","||/"];
const OP2=["<=",">=","<>","!=","||","::","->","=>","#>","@>","<@","&&",
  "<<",">>","!~","~*","|/","^=",":=","+=","-=","*=","/=","%="];

function sqlZerlege(s){
  const t=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){ let j=i; while(j<s.length && /\s/.test(s[j])) j++;
      t.push({a:"raum", w:s.slice(i,j)}); i=j; continue; }
    if(c==="-" && s[i+1]==="-"){ let j=s.indexOf("\n",i); if(j<0) j=s.length;
      t.push({a:"komm", w:s.slice(i,j).trimEnd()}); i=j; continue; }
    if(c==="/" && s[i+1]==="*"){ let j=s.indexOf("*/",i+2); j=j<0?s.length:j+2;
      t.push({a:"komm", w:s.slice(i,j)}); i=j; continue; }
    if(c==="'"){
      /* Ein doppeltes Hochkomma steht für eines im Text und beendet die
         Zeichenkette nicht. */
      let j=i+1;
      while(j<s.length){
        if(s[j]==="'"){ if(s[j+1]==="'") j+=2; else { j++; break; } } else j++;
      }
      t.push({a:"text", w:s.slice(i,j)}); i=j; continue;
    }
    if(c==='"' || c==="`"){ let j=i+1; while(j<s.length && s[j]!==c) j++;
      t.push({a:"name", w:s.slice(i,Math.min(j+1,s.length))}); i=Math.min(j+1,s.length); continue; }
    if(c==="["){ let j=s.indexOf("]",i); j=j<0?s.length:j+1;
      t.push({a:"name", w:s.slice(i,j)}); i=j; continue; }
    /* Hexzahlen zuerst, sonst frisst die Zehnerregel die Null und
       laesst `x1F` als Wort stehen. */
    if(c==="0" && /[xX]/.test(s[i+1]||"") && /[0-9a-fA-F]/.test(s[i+2]||"")){
      let j=i+2; while(j<s.length && /[0-9a-fA-F]/.test(s[j])) j++;
      t.push({a:"zahl", w:s.slice(i,j)}); i=j; continue; }
    if(/[0-9]/.test(c) || (c==="." && /[0-9]/.test(s[i+1]||""))){
      let j=i; while(j<s.length && /[0-9._]/.test(s[j])) j++;
      /* Der Exponent gehoert zur Zahl. Ohne diese Zeilen zerfiel
         `1.5e10` in `1.5` und ein „Wort" `e10`, und beim Zusammenbauen
         kam ein Zwischenraum dazwischen. */
      if(/[eE]/.test(s[j]||"")){
        let k=j+1;
        if(/[+-]/.test(s[k]||"")) k++;
        if(/[0-9]/.test(s[k]||"")){ while(k<s.length && /[0-9]/.test(s[k])) k++; j=k; }
      }
      t.push({a:"zahl", w:s.slice(i,j)}); i=j; continue; }
    /* `@` und `#` beginnen nur dann ein Wort, wenn ein Wortzeichen
       folgt — `@v` und `#temp` sind Namen, `@>` und `#>>` sind
       Operatoren. Vorher verschluckte die Wortregel das `@` von
       `tags @> '{a}'` und das `#` von `a#>>'{b}'`. */
    if(/[A-Za-z_$:]/.test(c) || (/[@#]/.test(c) && /[A-Za-z0-9_]/.test(s[i+1]||""))){
      let j=i+1;
      while(j<s.length){
        if(/[A-Za-z0-9_$:]/.test(s[j])){ j++; continue; }
        if(/[@#]/.test(s[j]) && /[A-Za-z0-9_]/.test(s[j+1]||"")){ j++; continue; }
        break;
      }
      t.push({a:"wort", w:s.slice(i,j)}); i=j; continue; }
    /* Nach Laenge, laengste zuerst. Ohne die Dreierliste zerfiel `->>`
       in `->` und `>`; aus `data->>'x'` wurde `data -> > 'x'`, und das
       ist kein gueltiges SQL mehr. */
    const drei=s.substr(i,3);
    if(OP3.includes(drei)){ t.push({a:"op", w:drei}); i+=3; continue; }
    const zwei=s.substr(i,2);
    if(OP2.includes(zwei)){ t.push({a:"op", w:zwei}); i+=2; continue; }
    t.push({a:"op", w:c}); i++;
  }
  return t;
}

/* ---------- Kleben und Trennen ----------
   Zu jedem Bestandteil merken, ob im Urtext unmittelbar davor ein
   Zwischenraum stand. Die Rueckprobe braucht das: Ein eingefuegter
   Zwischenraum ist an der Bestandteilfolge allein nicht zu erkennen —
   `->` `>` ist vor und nach dem Formatieren dieselbe Folge, aber
   `-> >` ist kaputt. Genau daran ging die alte Probe vorbei.

   Ein Kommentar zaehlt als Trenner: Was durch ihn getrennt ist, klebte
   ohnehin nicht. */
function sqlMitKleber(s){
  const roh=sqlZerlege(s), aus=[];
  let klebt=false;
  for(const x of roh){
    if(x.a==="raum"){ klebt=false; continue; }
    aus.push(Object.assign({klebt: aus.length>0 && klebt && x.a!=="komm"}, x));
    klebt = x.a!=="komm";
  }
  return aus;
}

/* Klammern, Komma und Strichpunkt trennen sich immer selbst: `count(*)`
   darf zu `count( * )` werden, ohne dass sich etwas aendert. Alles
   andere ist verdaechtig — zwei Operatorzeichen nebeneinander koennen
   zusammen etwas anderes bedeuten als einzeln, und eine Zahl mit einem
   Wort dahinter war fast sicher eine Zahl. */
const SELBSTTRENNER=new Set(["(",")",",",";"]);
function trennGefahr(a,b){
  if(a.a==="op" && b.a==="op")
    return !SELBSTTRENNER.has(a.w) && !SELBSTTRENNER.has(b.w);
  /* Ein Wort mit `@` oder `#` vorn ist ein Name — steht unmittelbar
     davor noch so ein Zeichen, war es in Wahrheit etwas anderes:
     `a@@b` sucht in Postgres im Volltext, `@@rowcount` ist im SQL
     Server eine Systemvariable. Welches von beiden, hängt vom Dialekt
     ab. Der Formatierer entscheidet das nicht — er verweigert. */
  if(a.a==="op" && /^[@#]$/.test(a.w) && b.a==="wort" && /^[@#]/.test(b.w)) return true;
  return a.a==="zahl" && (b.a==="wort" || b.a==="zahl");
}

/* ---------- Was eine neue Zeile bekommt ----------
   Mehrwortige zuerst, damit `GROUP BY` nicht als `GROUP` und `BY`
   auseinanderfällt. */
const KLAUSEL=[
  "WITH RECURSIVE","WITH","SELECT DISTINCT","SELECT","FROM","WHERE",
  "GROUP BY","HAVING","ORDER BY","LIMIT","OFFSET","FETCH FIRST","WINDOW",
  "UNION ALL","UNION","EXCEPT","INTERSECT",
  "INSERT INTO","VALUES","UPDATE","SET","DELETE FROM","RETURNING",
  "CREATE TABLE","CREATE VIEW","ALTER TABLE","DROP TABLE","TRUNCATE"
];
const VERBUND=[
  "LEFT OUTER JOIN","RIGHT OUTER JOIN","FULL OUTER JOIN","INNER JOIN",
  "CROSS JOIN","LEFT JOIN","RIGHT JOIN","FULL JOIN","NATURAL JOIN","JOIN",
  "ON","USING"
];
/* Nach diesen Klauseln steht die Liste eingerückt unter der Klausel. */
const MIT_LISTE=new Set(["SELECT","SELECT DISTINCT","GROUP BY","ORDER BY","SET","VALUES","RETURNING"]);

/* ---------- Was großgeschrieben werden darf ----------
   **Nur das hier.** Alles andere bleibt Zeichen für Zeichen so stehen,
   wie es getippt wurde — ein Tabellen- oder Spaltenname wird nie
   angefasst, auch nicht im Schriftfall.

   Die Liste war einmal deutlich länger und enthielt Datentypen und
   Wörter wie TEXT, DATE, KEY, NAME, FIRST, ROW. Das war falsch: Eine
   Spalte darf so heißen, und dann hätte der Formatierer sie
   umgeschrieben. Was nur in einer Wortfolge vorkommt — LEFT, INNER,
   OUTER, INTO — steht ebenfalls nicht hier; das erledigt die
   Folgenerkennung, und `left(name,3)` bleibt damit unberührt. */
/* Wörter, die nur als Teil einer erkannten Wortfolge großgeschrieben
   werden — SELECT, LEFT JOIN, INSERT INTO und so fort. */
const SCHRITT_WORT=new Set(
  [...KLAUSEL, ...VERBUND].flatMap(k=>k.split(" ")));
const GROSS_ERLAUBT=new Set([
  "AND","OR","NOT","IS","IN","LIKE","ILIKE","BETWEEN","EXISTS","NULL",
  "CASE","WHEN","THEN","ELSE","END","AS","ASC","DESC","DISTINCT",
  "ALL","ANY","OVER","PARTITION","BY","TRUE","FALSE"
]);

/* Sucht ab Stelle `i` die längste passende Wortfolge aus `liste`. */
function phrase(t,i,liste){
  for(const p of liste){
    const w=p.split(" ");
    let j=i, k=0;
    while(k<w.length && j<t.length){
      if(t[j].a==="raum" || t[j].a==="komm"){ j++; continue; }
      if(t[j].a!=="wort" || t[j].w.toUpperCase()!==w[k]) break;
      j++; k++;
    }
    if(k===w.length) return {text:p, bis:j};
  }
  return null;
}

/* Vor einer Klammer steht ein Zwischenraum nur nach diesen Wörtern.
   Sonst ist es ein Funktionsaufruf und die Klammer klebt am Namen:
   `count(*)`, aber `IN (…)`. */
const KLAMMER_RAUM=new Set(["IN","VALUES","EXISTS","ALL","ANY","USING","NOT",
  "AND","OR","ON","INTO","RETURNING","BY","SETS","OVER","PARTITION","AS",
  "SELECT","FROM","WHERE","SET","UNION","BETWEEN","WHEN","THEN","ELSE",
  "TABLE","VIEW","KEY","REFERENCES","FILTER","DISTINCT"]);

function sqlFormatiere(quelle, opt){
  opt=opt||{};
  const EIN=opt.einzug || "  ";
  const t=sqlZerlege(quelle).filter(x=>x.a!=="raum");
  if(!t.length) return {text:"", ok:true, leer:true};

  const zeilen=[];
  let puffer="", tiefe=0, vorher=null;
  /* Nach `INSERT INTO kunden` ist `(…)` eine Spaltenliste, kein
     Funktionsaufruf — sie bekommt einen Zwischenraum. */
  let nachTabelle=false;
  /* `zusatz` ist die eine Ebene, die eine Liste oder ein ON öffnet. Sie
     wird beim nächsten Klausel- oder Verbundwort wieder eingezogen. */
  let zusatz=0;
  /* Je offener Klammer merken, ob sie umgebrochen wurde. Nur dann wird
     beim Schließen wieder ausgerückt. */
  const klammern=[];
  /* Je offenem CASE ein Eintrag — damit auch ein CASE in einem CASE
     wieder richtig ausrückt. */
  const faelle=[];

  const flush=()=>{
    if(puffer.trim()) zeilen.push(EIN.repeat(Math.max(0,tiefe))+puffer.trim());
    puffer="";
  };
  /* Ein einziger Ort entscheidet über den Zwischenraum. Vorher stand
     das an fünf Stellen, und hinterher rückte ein `replace` die Reste
     gerade — das griff auch in Zeichenketten hinein und hätte
     `'a . b'` still verändert. */
  const raumDavor=(x)=>{
    if(!puffer) return false;
    if(x.a==="op" && [",",";",")",".","::"].includes(x.w)) return false;
    if(vorher && vorher.a==="op" && (vorher.w==="." || vorher.w==="(")) return false;
    if(x.a==="op" && x.w==="("){
      if(!vorher) return false;
      if(vorher.a==="tabelle") return true;
      if(vorher.a==="wort") return KLAMMER_RAUM.has(vorher.w.toUpperCase());
      if(vorher.a==="name") return false;
      return true;
    }
    return true;
  };
  const setz=(x, text)=>{
    puffer += (raumDavor(x) ? " " : "") + (text!==undefined ? text : x.w);
    vorher=x;
  };
  const roh=(s)=>{ puffer += (puffer?" ":"")+s; vorher={a:"wort",w:s}; };

  /* Flush **vor** dem Ausrücken: Was noch im Puffer steht, gehört zur
     eingerückten Ebene. Andersherum verlor der letzte Eintrag einer
     Liste seinen Einzug — sichtbar an einem `firma`, das unter zwei
     eingerückten Geschwistern plötzlich links stand. */
  const zusatzZu=()=>{ flush(); if(zusatz){ tiefe-=zusatz; zusatz=0; } };

  const istUnterabfrage=i=>{
    for(let j=i+1;j<t.length;j++){
      if(t[j].a==="komm") continue;
      return t[j].a==="wort" && ["SELECT","WITH","VALUES"].includes(t[j].w.toUpperCase());
    }
    return false;
  };

  let i=0;
  while(i<t.length){
    const x=t[i];

    if(x.a==="komm"){
      if(x.w.startsWith("--")){ setz(x,x.w); flush(); }
      else if(puffer) setz(x,x.w);          /* Blockkommentar bleibt in der Zeile */
      else { zeilen.push(EIN.repeat(Math.max(0,tiefe))+x.w); }
      i++; continue;
    }

    if(x.a==="wort"){
      const kl=phrase(t,i,KLAUSEL);
      if(kl){
        zusatzZu(); roh(kl.text);
        nachTabelle=["INSERT INTO","UPDATE","CREATE TABLE","ALTER TABLE"].includes(kl.text);
        if(MIT_LISTE.has(kl.text)){ flush(); tiefe++; zusatz=1; }
        i=kl.bis; continue;
      }
      const vb=phrase(t,i,VERBUND);
      if(vb){
        zusatzZu();
        if(vb.text==="ON" || vb.text==="USING"){
          /* Die Bedingung gehört unter ihren Verbund und in dieselbe
             Zeile — sonst steht `ON` allein und das Folgende links. */
          tiefe++; zusatz=1; roh(vb.text);
        } else roh(vb.text);
        i=vb.bis; continue;
      }
      const gross=x.w.toUpperCase();

      /* CASE bricht um: WHEN, ELSE und END beginnen je eine Zeile,
         THEN bleibt bei seinem WHEN. Bei drei Zweigen wäre eine Zeile
         noch zu lesen, bei acht nicht mehr. */
      if(gross==="CASE"){ flush(); roh("CASE"); flush(); tiefe++; faelle.push(true);
        i++; continue; }
      if(faelle.length && (gross==="WHEN" || gross==="ELSE")){
        flush(); roh(gross); i++; continue; }
      if(faelle.length && gross==="END"){
        flush(); tiefe--; faelle.pop(); roh("END"); i++; continue; }

      if(gross==="AND" || gross==="OR"){ flush(); roh(gross); i++; continue; }
      setz(x, GROSS_ERLAUBT.has(gross) ? gross : x.w);
      if(nachTabelle) vorher={a:"tabelle", w:x.w};
      nachTabelle=false;
      i++; continue;
    }

    if(x.a==="op"){
      if(x.w==="("){
        if(istUnterabfrage(i)){ setz(x,"("); flush(); tiefe++; klammern.push(true); }
        else { setz(x,"("); klammern.push(false); }
        i++; continue;
      }
      if(x.w===")"){
        /* Erst die Zusatzebene schließen, die eine Liste innerhalb der
           Klammer geöffnet hat. Ohne das stand die schließende Klammer
           einer CTE um eine Ebene zu weit rechts. */
        if(klammern[klammern.length-1]) zusatzZu();
        if(klammern.pop()){ flush(); tiefe--; setz(x,")"); }
        else setz(x,")");
        i++; continue;
      }
      if(x.w===","){
        setz(x,",");
        /* Eine Liste bricht auf ihrer eigenen Ebene um — auch innerhalb
           einer umgebrochenen Klammer, denn dort steht wieder eine
           eigene Abfrage. Nur in einer Funktionsklammer bleibt sie in
           der Zeile: `count(a, b)` gehört zusammen. */
        const innen = klammern.length ? klammern[klammern.length-1] : true;
        if(zusatz && innen) flush();
        i++; continue;
      }
      if(x.w===";"){
        setz(x,";"); flush(); zeilen.push("");
        tiefe=0; zusatz=0; klammern.length=0; vorher=null;
        i++; continue;
      }
      setz(x); i++; continue;
    }

    setz(x);
    i++;
  }
  flush();

  const text=zeilen.join("\n").replace(/\n{3,}/g,"\n\n").trimEnd();

  /* ---------- Die Rückprobe ----------
     Ausgabe erneut zerlegen und Bestandteil für Bestandteil
     vergleichen. Nur der Schriftfall der Schlüsselwörter darf sich
     unterscheiden. Stimmt etwas nicht, wird nichts ausgegeben. */
  const vor=sqlMitKleber(quelle);
  const nach=sqlMitKleber(text);
  if(vor.length!==nach.length)
    return {text:"", ok:false,
      grund:"Die Rückprobe fand "+nach.length+" Bestandteile statt "+vor.length+"."};
  for(let k=0;k<vor.length;k++){
    const a=vor[k], b=nach[k];
    if(a.a!==b.a)
      return {text:"", ok:false, grund:"Die Rückprobe stolperte bei „"+a.w+"“."};
    /* Die Klebeprobe. Ein Zwischenraum, der zwischen zwei Zeichen
       gerät, die zusammengehören, macht aus gültigem SQL Unsinn —
       ohne dass die Bestandteilfolge sich ändert. */
    if(k>0 && a.klebt!==b.klebt && trennGefahr(vor[k-1],a))
      return {text:"", ok:false,
        grund:"„"+vor[k-1].w+a.w+"“ gehört zusammen und wäre auseinandergefallen. "
          +"Diese Schreibweise kennt der Formatierer nicht."};
    if(a.a==="wort"){
      if(a.w.toUpperCase()!==b.w.toUpperCase())
        return {text:"", ok:false, grund:"Die Rückprobe stolperte bei „"+a.w+"“."};
      /* Der Schriftfall darf sich nur bei den wenigen erlaubten Wörtern
         unterscheiden. Vorher verglich die Probe alle Wörter ohne
         Rücksicht auf Groß und Klein — ein umgeschriebener Spaltenname
         wäre ihr damit nie aufgefallen, und genau das soll sie fangen. */
      if(a.w!==b.w && !GROSS_ERLAUBT.has(a.w.toUpperCase()) && !SCHRITT_WORT.has(a.w.toUpperCase()))
        return {text:"", ok:false,
          grund:"„"+a.w+"“ hätte seinen Schriftfall verloren. Namen bleiben, wie sie stehen."};
    } else if(a.w!==b.w)
      return {text:"", ok:false, grund:"Die Rückprobe stolperte bei „"+a.w+"“."};
  }
  return {text, ok:true, zeilen:text.split("\n").length};
}


/* ============================================================
   5 — DEUTUNG DER EINGABE
   ============================================================ */
const KUERZEL={so:0,mo:1,di:2,mi:3,"do":4,fr:5,sa:6};
/* ---------- Die Eingabemuster ----------
   Eine Stelle, zwei Verwendungen: `deuten()` liest hier seine Regeln,
   und die Hilfe liest dieselbe Liste. Eine Aufstellung daneben wuerde
   abdriften — derselbe Fehler wie bei den Tastenkuerzeln.
   Ein neues Muster erscheint dadurch von selbst in der Hilfe. */
const MUSTER=[
  {re:/(^|\s)\?(\s|$)/, bsp:"?",
   was:"Macht daraus eine Aufgabe zum Nachverfolgen."},
  {re:/\s@(\S+)/, bsp:"@kowalski",
   was:"Hängt den Eintrag an einen Kontakt."},
  {re:/\s(\d{1,2}):(\d{2})(\s|$)/, bsp:"14:30",
   was:"Setzt die Uhrzeit. Ohne Tag gilt heute."},
  {re:/\s(heute|übermorgen|uebermorgen|morgen|mo|di|mi|do|fr)(\s|$)/i,
   bsp:"heute · morgen · übermorgen · mo–fr",
   was:"Setzt den Tag."},
  {re:null, bsp:"17*1,19",
   was:"Rechnet. Das Komma gilt wie ein Punkt."},
  {re:null, bsp:'{"a":1}',
   was:"Erkennt JSON und bietet Formatieren an."}
];

function deuten(text){
  let rest=" "+text+" ";
  const o={};
  if(MUSTER[0].re.test(rest)){ o.nach=true; rest=rest.replace(MUSTER[0].re," "); }
  const p=rest.match(MUSTER[1].re); if(p){ o.person=p[1]; rest=rest.replace(p[0]," "); }
  let z=rest.match(MUSTER[2].re);
  if(z){ o.zeit=p2(+z[1])+":"+z[2]; rest=rest.replace(z[0]," "); }
  const t=rest.match(MUSTER[3].re);
  if(t){ const w=t[1].toLowerCase(); const h=new Date(); h.setHours(0,0,0,0); let ziel;
    if(w==="heute"){ ziel=h; o.tag="heute"; }
    else if(w==="übermorgen"||w==="uebermorgen"){ ziel=new Date(h);
      ziel.setDate(ziel.getDate()+2); o.tag="übermorgen"; }
    else if(w==="morgen"){ ziel=new Date(h); ziel.setDate(ziel.getDate()+1); o.tag="morgen"; }
    else { ziel=new Date(h); let diff=(KUERZEL[w]-ziel.getDay()+7)%7; if(!diff) diff=7;
      ziel.setDate(ziel.getDate()+diff); o.tag=TAGL[KUERZEL[w]]; }
    o.datum=iso(ziel); rest=rest.replace(t[0]," "); }
  if(o.zeit && !o.datum){ o.datum=iso(planTage()[0]); o.tag="heute"; }
  o.titel=rest.replace(/\s+/g," ").trim();
  return o;
}

/* ============================================================
   6 — DIE LEISTE
   Leer heißt nicht leer: ohne Eingabe stehen hier Überfälliges,
   der nächste Termin und die angehefteten Bookmarks.
   ============================================================ */
let eingabe="", treffer=[], zeiger=-1;

function ueberfaellig(){
  /* Termine mit vergangenem Datum waren vorher nirgends mehr zu
     sehen: der Planner zeigt nur die beiden Werktage, der Vorrat
     nur Aufgaben. Sie standen noch in den Daten, aber unsichtbar.
     Jetzt tauchen sie hier auf und lassen sich zurückholen. */
  const [d1,d2]=planTage(), k1=iso(d1), k2=iso(d2);
  return [].concat(
    /* Termine kennen kein „erledigt“ — ein vergangener Termin ist vorbei,
       nicht abgehakt. Er lässt sich hier nur zurückholen oder löschen. */
    DATEN.termine.filter(t=>t.d && t.d!==k1 && t.d!==k2)
      .map(t=>({typ:"Termin",obj:t,titel:t.titel,verschieben:t,
        m:"war am "+t.d+" um "+t.zeit+(t.anm?" · "+t.anm:"")})),
    DATEN.aufgaben.filter(istSpaet).map(a=>({typ:"Aufgabe",obj:a,titel:a.titel,
      m:(a.notiz||"")+(a.kontakt?" · "+kname(a.kontakt):"")})),
    WORKFLOWS.filter(wfSpaet).map(w=>({typ:"Workflow",obj:w,titel:w.titel,
      m:wfStand(w)}))
  );
}
function naechsterTermin(){
  const n=nowMin();
  return DATEN.termine.filter(t=>t.d===HEUTE && toMin(t.zeit)+t.dauer>n)
    .sort((a,b)=>toMin(a.zeit)-toMin(b.zeit))[0]||null;
}

function leisteMalen(rumpf){
  const b=el("div","mitte");
  const s=el("div","schwelle");
  const f=el("div","feld",'<span class="c">›</span>'
    +'<input id="q" type="text" autocomplete="off" spellcheck="false" '
    +'placeholder="Tippen — suchen, rechnen, erfassen" aria-label="Suchen oder erfassen">'
    +'<span class="k">ESC leert</span>');
  s.appendChild(f); b.appendChild(s);
  const erg=el("div"); erg.id="erg"; b.appendChild(erg);
  rumpf.appendChild(b);
  const q=$("#q"); q.value=eingabe;
  q.addEventListener("input",e=>{ eingabe=e.target.value; suchen(); });
  suchen();
  setTimeout(()=>q.focus(),20);
}

function suchen(){
  const erg=$("#erg"); if(!erg) return;
  erg.innerHTML=""; treffer=[]; zeiger=-1;
  const roh=eingabe.trim(), q=roh.toLowerCase();
  /* Nur der Ruhezustand wird zweispaltig. Ein Suchergebnis ist nach Rang
     geordnet und bleibt schmal — sonst stuende der zweitbeste Treffer
     neben dem besten statt darunter. */
  erg.className = roh ? "eng" : "";

  if(!roh){ ruhezustand(erg); return; }

  const rz=rechne(roh);
  if(rz!==null) erg.appendChild(el("div","rechner",'<div class="frage">'+esc(roh)+' =</div>'
    +'<div class="zahl">'+String(rz).replace(".",",")+'</div>'));

  /* Jedes Modul wird gefragt — die Leiste kennt keines beim Namen */
  MODULE.forEach(m=>{ if(m.suche) (m.suche(q,roh)||[]).forEach(t=>zeigeTreffer(erg,t)); });

  if(roh.length>=3){
    const d=deuten(roh);
    if(d.titel){
      erg.appendChild(abschnitt("Erfassen",null));
      MODULE.forEach(m=>{ if(m.erfassen) (m.erfassen(d)||[]).forEach(t=>zeigeTreffer(erg,t)); });
      zeigeTreffer(erg,treff("Kopieren",d.titel,"in die Zwischenablage","↵",
        ()=>melde("Kopiert: "+d.titel)));
      erfassenHinweis(erg, roh);
    }
  }
  if(!treffer.length) erg.appendChild(el("div","leer","Nichts gefunden."));
  zeiger=treffer.length?0:-1; markiere();
}
/* Zeigt, was in dieser Eingabe **noch fehlt** — nie mehr als drei
   Stück, und nichts, was schon dasteht. Quelle ist `MUSTER`, dieselbe
   Tabelle, aus der sich die Hilfe baut: Eine zweite Liste driftete weg,
   sobald jemand eine Schreibweise ergänzt.

   Die Muster tragen kein `g`, `test` ist damit zustandslos und darf
   hier gefahrlos ein zweites Mal laufen. */
function erfassenHinweis(box, roh){
  const pruef=" "+roh+" ";
  const offen=MUSTER.filter(m=>m.re && !m.re.test(pruef)).slice(0,3);
  if(!offen.length) return;
  const teil=offen.map(m=>{
    /* Beim Tag stehen vier Beispiele nebeneinander — hier genügt das
       erste. */
    const bsp=m.bsp.split(" · ")[0];
    /* Nur der erste Satz. Bei der Uhrzeit steht in `MUSTER` noch
       „Ohne Tag gilt heute." dahinter — richtig in der Hilfe, zu lang
       für eine Zeile unter den Treffern. */
    const was=m.was.split(". ")[0].replace(/\.$/,"");
    return '<b>'+esc(bsp)+'</b> '+esc(was.charAt(0).toLowerCase()+was.slice(1));
  });
  box.appendChild(el("div","erf-hin","Geht auch: "+teil.join(" · ")));
}

function zeigeTreffer(box,t){
  const n=el("button","tr",'<span class="tr-a">'+esc(t.art)+'</span>'
    +'<span class="tr-b"><span class="tr-t">'+esc(t.titel)+'</span>'
    +(t.meta?'<span class="tr-m">'+esc(t.meta)+'</span>':'')+'</span>'
    +'<span class="tr-k">'+esc(t.taste)+'</span>');
  n.onclick=()=>{ t.fn(); if(t.bleibt) suchen(); else { eingabe=""; male(); } };
  box.appendChild(n); treffer.push(n);
}
function markiere(){
  treffer.forEach((n,i)=>n.classList.toggle("wahl",i===zeiger));
  if(zeiger>=0&&treffer[zeiger]) treffer[zeiger].scrollIntoView({block:"nearest"});
}

function ruhezustand(raum){
  /* Zwei Stapel statt einer Kette. Links steht, was zu einer Handlung
     auffordert, rechts, wonach man greift. Der Inhalt war einspaltig
     1181 px hoch und passte damit nicht auf einen 24-Zoll-Schirm, der
     im Rumpf 895 px laesst; zweispaltig sind es 646.
     Beide Stapel haengen in .zweispalt — unter 1100 px legt die
     Medienabfrage sie wieder untereinander, links vor rechts. */
  const zwei=el("div","zweispalt");
  const box=el("div"), rechts=el("div");
  zwei.append(box,rechts);
  raum.appendChild(zwei);

  const sp=ANZ.leiste.spaet ? ueberfaellig() : [];
  if(sp.length){
    box.appendChild(abschnitt("Überfällig",String(sp.length),"eilig"));
    sp.forEach(x=>{
      const r=zeile(x.obj,{titel:x.titel,meta:x.typ+" · "+x.m,
        rechts:x.verschieben?"":"überfällig",k:"eilig",hakbar:x.typ==="Aufgabe"});
      if(x.verschieben){
        const t=el("button","tat still","auf heute holen");
        t.onclick=ev=>{ ev.stopPropagation();
          x.verschieben.d=iso(planTage()[0]); bewahre(); male();
          melde('"'+x.titel+'" liegt jetzt auf heute'); };
        r.appendChild(t);
        /* Der zweite Weg heraus. Termine kennen kein Abhaken, also
           bleibt nur zurückholen oder löschen — sonst stünde ein
           vergangener Termin hier für immer. */
        const w=el("button","tat weg","löschen");
        w.onclick=ev=>{ ev.stopPropagation(); terminDialog(x.verschieben); };
        w.style.marginLeft="4px";
        r.appendChild(w);
      }
      box.appendChild(r);
    });
  }
  const nt=ANZ.leiste.termin ? naechsterTermin() : null;
  if(ANZ.leiste.termin){
  box.appendChild(abschnitt(nt?"Als Nächstes":"Heute",null,"jetzt"));
  const w=el("div");
  if(nt){
    const diff=toMin(nt.zeit)-nowMin();
    w.innerHTML='<div class="naechst-t">'+esc(nt.titel)+'</div><div class="naechst-m">'
      +esc((nt.anm||"")+(nt.kontakt?" · "+kname(nt.kontakt):"")+" · "
      +(diff>0?"in "+diff+" Minuten":"läuft gerade"))+'</div>';
  } else w.innerHTML='<div class="naechst-t">Kein Termin mehr.</div>'
    +'<div class="naechst-m">Der Rest des Tages gehört dir.</div>';
  box.appendChild(w);
  }

  /* Favoriten stehen zwischen dem nächsten Termin und den Bookmarks:
     erst was drängt, dann wen man am häufigsten braucht, dann der Rest. */
  const favK=KONTAKTE.filter(k=>k.fav).sort(nachNachnamen);
  /* Der Schmierzettel steht hier, weil die Leiste von oben nach unten
     von „drängt“ zu „liegt bereit“ geht — und er das Einzige ist, in
     das man schreibt. Derselbe Text steht groß im Modul Notizen. */
  if(ANZ.leiste.zettel){
    const sa=abschnitt("Schmierzettel",null);
    const zumModul=el("button","n","Notizen ›");
    zumModul.onclick=()=>zeigeFlaeche("notizen"); sa.appendChild(zumModul);
    box.appendChild(sa);
    box.appendChild(schmierKlein());
  }

  /* Die Pinnwand, links unter dem Schmierzettel. Sie stand zuerst
     rechts — dort trug die Spalte sie nicht: Mit Favoriten, Pinnwand und
     Modulliste war sie ab dem sechsten belegten Platz 918 px hoch, bei
     895 px sichtbarer Hoehe. Links passt sie bis zum zwoelften.
     Zwölf Plätze, von Hand belegt — sie wächst nicht mit
     der Sammlung, egal ob es zwanzig Bookmarks sind oder zweihundert.
     Gezeigt werden nur die belegten, dazu ein Feld mit der Restzahl:
     Acht leere Kästen wären Unruhe, aber gar nichts zu sagen hieße, dass
     man nie merkt, dass noch Platz ist. */
  if(ANZ.leiste.pinnwand){
  const stand=heftStand();
  const a=abschnitt("Häufig benutzt",
    stand.length+" von "+HEFT_MAX+" · Strg+1 bis Strg+"+HEFT_TASTEN);
  box.appendChild(a);
  const g=el("div","bm-schnell");
  stand.forEach(({t,i})=>{
    const k=el("button","bm-platz",'<b>'+(i<HEFT_TASTEN?String(i+1):"·")+'</b>'
      +(t.mod.heftbar.zeichen||"")+'<span>'+esc(t.e.titel)+'</span>');
    k.setAttribute("aria-label",t.e.titel+" öffnen — "+(t.e.meta||t.mod.nm)
      +(i<HEFT_TASTEN?", Tastenkürzel Strg+"+(i+1):""));
    k.onclick=()=>heftOeffne(t.p||PINS[i]);
    g.appendChild(k);
  });
  const frei=HEFT_MAX-stand.length;
  if(frei>0){
    /* Führt dorthin, wo am meisten anzuheften ist — nicht zu einem
       Auswahlmenü, das es nicht gibt. */
    const quelle=MODULE.filter(m=>m.heftbar&&m.flaeche)
      .sort((x,y)=>(y.heftbar.liste()||[]).length-(x.heftbar.liste()||[]).length)[0];
    const z=el("button","bm-platz mehr",'<b>+</b><span>'
      +(stand.length?"noch "+frei+" frei":"nichts angeheftet")+'</span>');
    z.setAttribute("aria-label","Etwas anheften — "+frei+" Plätze frei"
      +(quelle?", öffnet "+quelle.nm:""));
    z.onclick=()=> quelle ? zeigeFlaeche(quelle.id)
      : melde("Kein Modul bietet etwas zum Anheften an");
    g.appendChild(z);
  }
  box.appendChild(g);
  }

  if(ANZ.leiste.favoriten){
  const fa=abschnitt("Favoriten",null);
  const alleK=el("button","n","alle "+KONTAKTE.length+" ›");
  alleK.onclick=()=>zeigeFlaeche("kontakte"); fa.appendChild(alleK);
  rechts.appendChild(fa);
  if(favK.length) rechts.appendChild(kachelraster(favK));
  else rechts.appendChild(el("div","leer",
    "Noch kein Favorit. Im Modul Kontakte den Stern auf einer Kachel setzen — "
    +"dann steht der Kontakt hier."));
  }

  if(ANZ.leiste.module){
  rechts.appendChild(abschnitt("Module",MODULE.filter(m=>!m.versteckt).length+" angemeldet"));
  rechts.appendChild(el("div","hinweis",
    "Diese Liste erzeugt sich aus dem Register. Ein neues Modul erscheint hier von selbst."));
  const ml=el("div","modliste");
  MODULE.filter(m=>!m.versteckt).sort((a,b)=>a.nr<b.nr?-1:1).forEach(m=>{
    const n=el("button","ml",'<b>'+esc(m.nr)+'</b><span>'+esc(m.nm)+'</span>'
      +(m.zahl?'<em>'+m.zahl()+'</em>':'')
      +(m.geruest?'<em class="gz"'+(m.zahl?'':' style="margin-left:auto"')
        +' title="'+esc(m.geruest)+'">Gerüst</em>':''));
    n.onclick=()=> m.flaeche ? zeigeFlaeche(m.id) : melde(m.nm+" — keine eigene Fläche");
    ml.appendChild(n);
  });
  rechts.appendChild(ml);
  /* Der Planner steht **unter** der Liste, nicht darin. Er meldet sich
     nicht über `registriere` an und trägt deshalb auch keine
     Modulnummer. Angehängt trug er die 07 hinter der 17 — eine
     sortierte Reihe, die mit einem Sprung endet, sieht kaputt aus. */
  const pl=el("button","ml planner",'<span>Planner öffnen</span><em>Strg+P</em>');
  pl.onclick=()=>zeigeFlaeche("planner");
  rechts.appendChild(pl);
  }

  /* „Die Leiste nie leer lassen“ ist eine harte Regel. Wer alle sechs
     Blöcke abschaltet, bekommt deshalb nicht nichts, sondern den Weg
     zurück. */
  if(!zwei.textContent.trim()){
    const l=el("div","leer",
      "Alle Blöcke der Leiste sind ausgeschaltet. Das Suchfeld oben "
      +"funktioniert weiter.");
    const k=el("button","tat still","Einstellungen öffnen");
    k.style.marginTop="10px";
    k.onclick=()=>zeigeFlaeche("einstellungen");
    box.append(l,k);
  }
}

/* ============================================================
   7 — DER PLANNER
   ============================================================ */
let zieht=null;

/* Rund und ohne Beschriftung — deshalb trägt er seinen Namen in
   aria-label und title. Das Plus ist Inline-SVG mit stroke, kein
   Schriftzeichen: Ein gesetztes „+“ sitzt je nach Schrift anders in der
   Zeile und zentriert sich in einem Kreis nie sauber. */
function plusKnopf(name, tun){
  const n=el("button","sp-neu",
    '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2.6v8.8M2.6 7h8.8"/></svg>');
  n.setAttribute("aria-label",name); n.title=name;
  n.onclick=e=>{ e.stopPropagation(); tun(); };
  return n;
}

function plannerMalen(rumpf){
  rumpf.classList.add("keinScroll");
  const box=el("div","planer");
  const [d1,d2]=planTage();

  const v=el("div","spalte vorrat");
  const offen=DATEN.aufgaben.filter(a=>!a.fertig && (!a.d || (a.d!==iso(d1)&&a.d!==iso(d2))));
  const vk=el("div","sp-k",'<div class="sp-d">Nicht eingeplant</div>');
  const vn=el("div","sp-n","Aufgaben <em>"+offen.length+"</em>");
  vn.appendChild(plusKnopf("Neue Aufgabe anlegen", ()=>aufgabeDialog(null,"todo")));
  vk.appendChild(vn); v.appendChild(vk);
  const vb=el("div","sp-b");
  if(!offen.length) vb.appendChild(el("div","leer","Alles eingeplant."));
  offen.forEach(a=>vb.appendChild(vorratZeile(a)));
  const wfs=WORKFLOWS.filter(wfSpaet);
  if(wfs.length){
    vb.appendChild(abschnitt("Workflows überfällig",String(wfs.length),"eilig"));
    vb.appendChild(el("div","hinweis","Nur zur Information, nicht planbar."));
    wfs.forEach(w=>{
      const n=el("div","wf",'<div class="t">'+esc(w.titel)+'</div>'
        +'<div class="m">'+esc(wfStand(w))+'</div>');
      n.onclick=()=>zeigeFlaeche("workflows");
      vb.appendChild(n);
    });
  }
  v.appendChild(vb);
  v.addEventListener("dragover",e=>{ if(zieht&&zieht.kat) e.preventDefault(); });
  v.addEventListener("drop",e=>{ e.preventDefault();
    if(!zieht||!zieht.kat) return;
    zieht.zeit=null; zieht.d=null; bewahre();
    melde('"'+zieht.titel+'" zurück in die Aufgabenliste'); zieht=null; male(); });
  box.appendChild(v);

  [d1,d2].forEach((d,i)=>{
    const key=iso(d), heute=key===HEUTE;
    const s=el("div","spalte"+(heute?" heute":""));
    const termine=DATEN.termine.filter(t=>t.d===key);
    const aufg=DATEN.aufgaben.filter(a=>a.d===key);
    const sk=el("div","sp-k",
      '<div class="sp-d">'+(heute?"Heute":(i===0?"Nächster Werktag":"Danach"))+'</div>');
    const sn=el("div","sp-n",TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()]
      +'<em>'+(termine.length+aufg.length)+'</em>');
    /* Vorbelegt wird die nächste volle Stunde — aber nur heute. An einem
       künftigen Tag gibt es kein „jetzt“, dort ist 09:00 der Anfang. */
    const start=()=>{
      if(!heute) return "09:00";
      const h=Math.ceil((nowMin()+1)/60);
      return p2(Math.min(Math.max(h,7),18))+":00";
    };
    sn.appendChild(plusKnopf("Neuen Termin an diesem Tag anlegen",
      ()=>terminDialog(null,key,start())));
    sk.appendChild(sn); s.appendChild(sk);
    const b=el("div","sp-b");
    const ohne=aufg.filter(a=>!a.zeit);
    if(ohne.length){
      b.appendChild(el("div","hinweis","Für diesen Tag fällig, ohne Uhrzeit — "
        +"auf eine Stunde ziehen."));
      ohne.forEach(a=>b.appendChild(vorratZeile(a)));
    }
    const raster=el("div","raster");
    for(let h=7;h<=18;h++){
      const st=el("div","stunde");
      st.appendChild(el("span","st-t",p2(h)+":00"));
      const lane=el("div","st-l");
      termine.filter(t=>toMin(t.zeit)>=h*60&&toMin(t.zeit)<(h+1)*60).forEach(t=>
        lane.appendChild(block(t,"termin",t.zeit+(t.anm?" · "+t.anm:"")
          +(t.kontakt?" · "+kname(t.kontakt):""))));
      aufg.filter(a=>a.zeit&&toMin(a.zeit)>=h*60&&toMin(a.zeit)<(h+1)*60).forEach(a=>
        lane.appendChild(block(a,"aufgabe","Aufgabe · "+a.zeit)));
      /* Klick in eine freie Stunde legt dort einen Termin an, Tag und
         Uhrzeit aus der angeklickten Stelle. Nur wenn der Klick die
         Fläche selbst trifft: Ein Block darin hat seinen eigenen Klick,
         der sonst zusätzlich einen neuen Termin anlegte. */
      lane.onclick=e=>{ if(e.target===lane) terminDialog(null,key,p2(h)+":00"); };
      lane.title="Klicken: neuer Termin um "+p2(h)+":00";
      st.appendChild(lane);
      st.addEventListener("dragover",e=>{ if(!zieht) return; e.preventDefault();
        st.classList.add("ziel"); });
      st.addEventListener("dragleave",()=>st.classList.remove("ziel"));
      st.addEventListener("drop",e=>{ e.preventDefault(); st.classList.remove("ziel");
        if(!zieht) return;
        zieht.d=key; zieht.zeit=p2(h)+":00"; bewahre();
        melde('"'+zieht.titel+'" auf '+TAGL[d.getDay()]+" "+p2(h)+":00");
        zieht=null; male(); });
      raster.appendChild(st);
    }
    if(heute){
      const n=nowMin();
      if(n>=7*60&&n<=19*60){
        const l=el("div","jetztlinie","<span>"+p2(new Date().getHours())+":"
          +p2(new Date().getMinutes())+"</span>");
        l.style.top=((n-7*60)/60*44)+"px"; raster.appendChild(l);
      }
    }
    b.appendChild(raster); s.appendChild(b); box.appendChild(s);
  });
  rumpf.appendChild(box);
}
function block(x,art,meta){
  const n=el("div","blk "+art+(istSpaet(x)?" spaet":"")+(x.fertig?" fertig":""));
  n.draggable=true;
  /* Nur Aufgaben lassen sich abhaken. Termine kennen kein „erledigt“ —
     ein vergangener Termin ist vorbei, nicht abgearbeitet. */
  if(art==="aufgabe"){
    const kast=el("button","kast");
    kast.innerHTML='<svg viewBox="0 0 12 12"><path d="M2 6.2 4.6 9 10 3"/></svg>';
    kast.setAttribute("aria-label",(x.fertig?"Wieder öffnen: ":"Erledigen: ")+x.titel);
    kast.onclick=e=>{ e.stopPropagation(); x.fertig=!x.fertig; bewahre(); male();
      melde(x.fertig?"Abgehakt: "+x.titel:"Wieder offen: "+x.titel); };
    n.appendChild(kast);
  }
  n.appendChild(el("span","blk-b",
    '<span class="t">'+esc(x.titel)+'</span><span class="m">'+esc(meta)+'</span>'));
  n.setAttribute("role","button"); n.tabIndex=0;
  n.setAttribute("aria-label",(art==="termin"?"Termin":"Aufgabe")+" bearbeiten: "+x.titel);
  const auf=()=> art==="termin" ? terminDialog(x) : aufgabeDialog(x);
  n.onclick=auf;
  n.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); auf(); } };
  n.addEventListener("dragstart",()=>{ zieht=x; n.classList.add("zieht"); });
  n.addEventListener("dragend",()=>{ n.classList.remove("zieht"); zieht=null;
    document.querySelectorAll(".stunde.ziel").forEach(s=>s.classList.remove("ziel")); });
  return n;
}
function vorratZeile(a){
  const n=el("div","vz"+(istSpaet(a)?" spaet":""));
  n.draggable=true;
  n.innerHTML='<span class="zb"><span class="zt">'+esc(a.titel)+'</span>'
    +'<span class="zm">'+esc((a.kat==="nach"?"Nachverfolgen · ":"")+frist(a)
    +(a.kontakt?" · "+kname(a.kontakt):""))+'</span></span>';
  n.setAttribute("role","button"); n.tabIndex=0;
  n.setAttribute("aria-label","Aufgabe bearbeiten: "+a.titel);
  n.onclick=()=>aufgabeDialog(a);
  n.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); aufgabeDialog(a); } };
  n.addEventListener("dragstart",()=>{ zieht=a; n.classList.add("zieht"); });
  n.addEventListener("dragend",()=>{ n.classList.remove("zieht"); zieht=null;
    document.querySelectorAll(".stunde.ziel").forEach(s=>s.classList.remove("ziel")); });
  return n;
}

/* ============================================================
   8 — DER SCHALTER
   Zwei feste Oberflächen, dazu die Flächen einzelner Module.
   Aus einer Modulfläche führt ESC zurück zur Leiste.
   ============================================================ */
/* Womit die App startet. Bisher immer die Leiste. */
let flaeche = ANZ.start==="planner" ? "planner" : "leiste";
function zeigeFlaeche(id){ dialogZu(); flaeche=id; if(id==="leiste") eingabe=""; male(); }

function male(){
  const rumpf=$("#rumpf"); rumpf.innerHTML="";
  rumpf.style.overflowY="auto";
  $("#w-leiste").setAttribute("aria-current",String(flaeche==="leiste"));
  $("#w-planner").setAttribute("aria-current",String(flaeche==="planner"));

  if(flaeche==="leiste"){ leisteMalen(rumpf); return; }
  if(flaeche==="planner"){ rumpf.style.overflowY="hidden"; plannerMalen(rumpf); return; }

  const m=modul(flaeche);
  const b=el("div","mitte");
  const zur=el("button","zurueck","‹ zurück zur Leiste");
  zur.onclick=()=>zeigeFlaeche("leiste");
  b.appendChild(zur);
  b.appendChild(abschnitt(m.nr+" · "+m.nm,null));
  /* Ein Modul, das sich als Gerüst anmeldet, sagt das auf seiner Fläche —
     an einer Stelle für alle, damit kein Gerüst es vergessen kann. */
  if(m.geruest) b.appendChild(el("div","geruest",
    "<b>Gerüst</b><span>"+esc(m.geruest)+"</span>"));
  if(m.flaeche) m.flaeche(b); else b.appendChild(el("div","leer","Keine eigene Fläche."));
  rumpf.appendChild(b);
}
$("#w-leiste").onclick=()=>zeigeFlaeche("leiste");
$("#w-planner").onclick=()=>zeigeFlaeche("planner");

/* Thema ist eine Anzeigeeinstellung, kein Anwendungsdatum — es lebt
   deshalb für sich in localStorage und nicht im Objekt Z, landet also
   auch nicht in Sicherung oder Export. */
function themaSetzen(t){
  /* An body, nicht an .app — Dialoge und der Meldungszettel hängen als
     eigene Zweige direkt an body, ein Thema an .app erreichte sie nie. */
  document.body.dataset.theme = t==="basecamp" ? "basecamp" : "";
  $("#th-standard").setAttribute("aria-current",String(t!=="basecamp"));
  $("#th-basecamp").setAttribute("aria-current",String(t==="basecamp"));
  store.set("thema",t);
}
function schriftSetzen(w){
  ANZ.schrift = ["klein","normal","gross"].includes(w) ? w : "normal";
  /* An `body`, nicht an `.app` — Dialoge und der Meldungszettel hängen
     als eigene Zweige direkt an `body` und blieben sonst klein. */
  if(ANZ.schrift==="normal") delete document.body.dataset.schrift;
  else document.body.dataset.schrift=ANZ.schrift;
  anzSichern();
}

/* ============================================================
   9 — SICHERN, LADEN, EXPORTIEREN

   Zwei verschiedene Zwecke, deshalb zwei Formate:

   JSON      vollständig und verlustfrei, mit Versionsfeld.
             Das ist die Sicherung. Kein eigener Parser, also
             auch keine Parser-Fehler.
   Markdown  einbahnig, zum Lesen und Ablegen. Kein Rückweg,
             deshalb auch keine Verluste durch Fehldeutung.

   Der frühere Weg — Markdown in beide Richtungen — war ein
   Fehler: er brauchte vierzig Zeilen Zerlegungslogik, deckte
   nur Termine und Aufgaben ab und verlor Notizen still.
   ============================================================ */
function datei(name, inhalt, typ){
  const blob=new Blob([inhalt],{type:typ+";charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

    let neu;

    if(!neu || typeof neu!=="object" || !neu.format){
      melde("Datei stammt nicht aus diesem Dashboard"); return; }
    if(neu.format>1){

    /* Bereichsweise ersetzen, damit die Verweise halten.

    let zahl=0;
    ["kontakte","termine","jahrestermine","aufgaben","notizen","workflows",
     "bausteine","apps","marken","pins","baum"].forEach(k=>{
      if(Array.isArray(neu[k])){ ersetze(Z[k], neu[k]); zahl+=neu[k].length; }
    });

    ["schmierzettel"].forEach(k=>{

       gebracht, hier fallen die weg, die ins Leere zeigen. */
    const leer=heftAufraeumen();

      +(leer?" · "+leer+(leer>1?" Plätze":" Platz")+" ins Leere entfernt":""));

};

/* ---------- Export: Markdown, nur zum Lesen ---------- */
function alsMarkdown(){
  const z=["# Dashboard", "", "_Stand "+new Date().toLocaleString("de-DE")+"_", ""];
  const [d1,d2]=planTage();

  [d1,d2].forEach(d=>{
    const key=iso(d);
    z.push("## "+TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()]
      +(key===HEUTE?" (heute)":""), "");
    const posten=[].concat(
      DATEN.termine.filter(t=>t.d===key).map(t=>({s:t.zeit, x:t, art:"Termin"})),
      DATEN.aufgaben.filter(a=>a.d===key).map(a=>({s:a.zeit||"—", x:a, art:"Aufgabe"}))
    ).sort((a,b)=>(a.s<b.s?-1:1));
    if(!posten.length) z.push("_nichts geplant_","");
    posten.forEach(p=>{
      const k=p.x.kontakt?kfind(p.x.kontakt):null;
      z.push("- "+(p.x.fertig?"~~":"")+p.s.padEnd(5)+" "+p.x.titel+(p.x.fertig?"~~":"")
        +"  \n  "+p.art+(p.x.anm||p.x.notiz?" · "+(p.x.anm||p.x.notiz):"")
        +(k?" · "+knm(k):""));
    });
    z.push("");
  });

  const spaet=DATEN.aufgaben.filter(istSpaet);
  if(spaet.length){
    z.push("## Überfällig","");
    spaet.forEach(a=>z.push("- "+a.titel+" — fällig war "+a.d));
    z.push("");
  }
  const wfs=WORKFLOWS.filter(wfSpaet);
  if(wfs.length){
    z.push("## Workflows überfällig","");
    wfs.forEach(w=>z.push("- "+w.titel+" — "+wfStand(w)));
    z.push("");
  }
  const rest=DATEN.aufgaben.filter(a=>!a.fertig && !istSpaet(a)
    && a.d!==iso(d1) && a.d!==iso(d2));
  if(rest.length){
    z.push("## Offen, nicht eingeplant","");
    ["todo","nach"].forEach(kat=>{
      const l=rest.filter(a=>a.kat===kat); if(!l.length) return;
      z.push("### "+(kat==="todo"?"To-do":"Nachverfolgen"),"");
      l.forEach(a=>z.push("- "+a.titel+" — "+frist(a)));
      z.push("");
    });
  }
  const heute=DATEN.notizen.filter(n=>n.d===HEUTE);
  if(heute.length){
    z.push("## Notizen von heute","");
    heute.forEach(n=>z.push("- **"+n.titel+"**"+(n.zeit?" ("+n.zeit+")":"")
      +(n.text?"  \n  "+n.text:"")));
    z.push("");
  }
  return z.join("\n");
}

/* ============================================================
   9b — EIN PDF VON HAND SCHREIBEN

   Ohne Bibliothek und ohne Druckdialog — beides zusammen lässt nur
   einen Weg: die Datei selbst bauen. Eine Bibliothek wäre erlaubt
   gewesen; jsPDF steht unter MIT und dürfte eingebettet werden. Es
   sind aber 420 KB gegenüber diesen rund 200 Zeilen, sie brächte
   nichts, was Gantt und Mindmap brauchen, und ihre Zeichengrenze
   wäre dieselbe. Die Messung steht in `doku/SPEC.md`.

   Ein PDF ist ein Textformat aus nummerierten Objekten, einer Tabelle
   ihrer Byte-Positionen und einem Strom von Zeichenbefehlen. Benutzt
   werden nur die vierzehn Standardschriften — Helvetica ist darunter
   und muss deshalb nicht eingebettet werden. Das spart die
   Schriftdatei und die Lizenzfrage.

   Zwei Fallen sind hier ausgeräumt:

   * Der Nullpunkt liegt **unten links**, nicht oben links. `hoch()`
     rechnet um, damit der Zeichencode von oben denken darf.
   * Die Standardschriften erwarten **WinAnsi**, nicht UTF-8. Ein „ä“
     ist dort ein einzelnes Byte. Ohne die Umrechnung stünde
     Kauderwelsch im Blatt.

   Die Grenze: Pfeile und Häkchen werden zu „?“. Namen, Umlaute und
   das Eurozeichen nicht.
   ============================================================ */
const PDF_NORM=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,
1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,
667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,
333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,
556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PDF_FETT=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,
975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,
667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,
333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,
611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const PDF_SONDER={0xE4:[556,556],0xF6:[556,611],0xFC:[556,611],0xC4:[667,722],
  0xD6:[778,778],0xDC:[722,722],0xDF:[611,611],0xB7:[278,278],0x96:[556,556],
  0x97:[1000,1000],0xA0:[278,278],0xE9:[556,556],0xE8:[556,556]};
const PDF_UMSETZ={0x2013:0x96,0x2014:0x97,0x2018:0x91,0x2019:0x92,0x201A:0x82,
  0x201C:0x93,0x201D:0x94,0x201E:0x84,0x2022:0x95,0x2026:0x85,0x20AC:0x80,
  0x2039:0x8B,0x203A:0x9B};

function pdfBytes(s){
  const aus=[];
  for(const z of String(s)){
    const c=z.codePointAt(0);
    if(PDF_UMSETZ[c]!==undefined) aus.push(PDF_UMSETZ[c]);
    else if(c<=0xFF) aus.push(c);
    else aus.push(0x3F);
  }
  return aus;
}
function pdfBreite(text, groesse, fett){
  let s=0;
  for(const c of pdfBytes(text)){
    if(c>=32 && c<=126) s+=(fett?PDF_FETT:PDF_NORM)[c-32];
    else if(PDF_SONDER[c]) s+=PDF_SONDER[c][fett?1:0];
    else s+=556;
  }
  return s/1000*groesse;
}
const pdfRoh = t => pdfBytes(t).map(c =>
  (c===40||c===41||c===92) ? "\\"+String.fromCharCode(c)
  : (c<32||c>126) ? "\\"+c.toString(8).padStart(3,"0")
  : String.fromCharCode(c)).join("");
const pz = n => (Math.round(n*100)/100).toString();

function pdfBlatt(B,H){
  const op=[], hoch=y=>H-y;
  const S={
    B,H,hoch,
    fuell(f){ op.push(pz(f[0])+" "+pz(f[1])+" "+pz(f[2])+" rg"); return S; },
    strich(f){ op.push(pz(f[0])+" "+pz(f[1])+" "+pz(f[2])+" RG"); return S; },
    dick(w){ op.push(pz(w)+" w"); return S; },
    rechteck(x,y,b,h,a){ op.push(pz(x)+" "+pz(hoch(y+h))+" "+pz(b)+" "+pz(h)+" re "+(a||"f")); return S; },
    rund(x,y,b,h,r,a){
      r=Math.min(r,b/2,h/2); const k=r*0.5523, Y=v=>hoch(v);
      op.push(pz(x+r)+" "+Y(y)+" m", pz(x+b-r)+" "+Y(y)+" l",
        pz(x+b-r+k)+" "+Y(y)+" "+pz(x+b)+" "+Y(y+r-k)+" "+pz(x+b)+" "+Y(y+r)+" c",
        pz(x+b)+" "+Y(y+h-r)+" l",
        pz(x+b)+" "+Y(y+h-r+k)+" "+pz(x+b-r+k)+" "+Y(y+h)+" "+pz(x+b-r)+" "+Y(y+h)+" c",
        pz(x+r)+" "+Y(y+h)+" l",
        pz(x+r-k)+" "+Y(y+h)+" "+pz(x)+" "+Y(y+h-r+k)+" "+pz(x)+" "+Y(y+h-r)+" c",
        pz(x)+" "+Y(y+r)+" l",
        pz(x)+" "+Y(y+r-k)+" "+pz(x+r-k)+" "+Y(y)+" "+pz(x+r)+" "+Y(y)+" c",
        "h "+(a||"f"));
      return S;
    },
    linie(x1,y1,x2,y2){ op.push(pz(x1)+" "+pz(hoch(y1))+" m "+pz(x2)+" "+pz(hoch(y2))+" l S"); return S; },
    bogen(x1,y1,x2,y2){ const mx=(x1+x2)/2;
      op.push(pz(x1)+" "+pz(hoch(y1))+" m "+pz(mx)+" "+pz(hoch(y1))+" "
        +pz(mx)+" "+pz(hoch(y2))+" "+pz(x2)+" "+pz(hoch(y2))+" c S"); return S; },
    weg(pk,a){ pk.forEach(([x,y],i)=>op.push(pz(x)+" "+pz(hoch(y))+" "+(i?"l":"m")));
      op.push("h "+(a||"f")); return S; },
    text(t,x,y,gr,o){
      o=o||{}; const b=pdfBreite(t,gr,o.fett);
      const px = o.wo==="m" ? x-b/2 : o.wo==="r" ? x-b : x;
      op.push("BT /"+(o.fett?"F2":"F1")+" "+pz(gr)+" Tf 1 0 0 1 "
        +pz(px)+" "+pz(hoch(y))+" Tm ("+pdfRoh(t)+") Tj ET");
      return S;
    },
    textEng(t,x,y,gr,max,o){
      t=String(t);
      if(pdfBreite(t,gr,o&&o.fett)>max){
        while(t.length>1 && pdfBreite(t+"…",gr,o&&o.fett)>max) t=t.slice(0,-1);
        t+="…";
      }
      return S.text(t,x,y,gr,o);
    },
    strom:()=>op.join("\n")
  };
  return S;
}

function pdfBauen(seiten){
  let aus="", pos=[];
  const schreib=s=>{ aus+=s; };
  const objekt=(nr,inhalt)=>{ pos[nr]=aus.length; schreib(nr+" 0 obj\n"+inhalt+"\nendobj\n"); };
  schreib("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const ERST=5, nrn=seiten.map((_,i)=>ERST+i*2);
  objekt(1,"<< /Type /Catalog /Pages 2 0 R >>");
  objekt(2,"<< /Type /Pages /Kids ["+nrn.map(n=>n+" 0 R").join(" ")
    +"] /Count "+seiten.length+" >>");
  objekt(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objekt(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  seiten.forEach((s,i)=>{
    const nr=nrn[i];
    objekt(nr,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pz(s.B)+" "+pz(s.H)
      +"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(nr+1)+" 0 R >>");
    const inhalt=s.strom();
    objekt(nr+1,"<< /Length "+inhalt.length+" >>\nstream\n"+inhalt+"\nendstream");
  });
  const xref=aus.length, anz=ERST+seiten.length*2;
  let t="xref\n0 "+anz+"\n0000000000 65535 f \n";
  for(let n=1;n<anz;n++) t+=String(pos[n]||0).padStart(10,"0")+" 00000 n \n";
  schreib(t);
  schreib("trailer\n<< /Size "+anz+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF\n");
  /* Als Bytes ausgeben, nicht als Text: Die Byte-Positionen in der
     Tabelle oben zählen Bytes. Ginge die Datei als UTF-8 hinaus, wäre
     jedes Zeichen über 127 zwei Bytes lang und jede Position falsch. */
  const bytes=new Uint8Array(aus.length);
  for(let i=0;i<aus.length;i++) bytes[i]=aus.charCodeAt(i)&0xFF;
  return bytes;
}

/* ---------- Die Tastenkuerzel ----------
   Eine Tabelle, zwei Verwendungen: Sie schaltet die Tasten, und die
   Schnellhilfe zeigt sie an. Eine Aufstellung daneben wuerde abdriften —
   ein Kuerzel, das nicht funktioniert, koennte dort stehen. Genau das
   ist Fehlerbuch Punkt 9.

   `tun` fehlt bei den ortsabhaengigen Tasten. Escape bedeutet je nach
   Ort etwas anderes, und die Pfeile gelten nur bei getippter Eingabe;
   beide bleiben unten als Sonderfaelle stehen. Sie stehen hier
   trotzdem, weil die Hilfe sie nennen muss.

   `pruefen:true` heisst: Das Kuerzel ist noch nicht am Zielrechner
   bestaetigt. Die Hilfe schreibt das dazu. Eine Beschriftung ohne
   nachgewiesene Tat waere Fehlerbuch Punkt 9. */

document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey, imFeld=e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA";
  if(dlgOffen){
    if(e.key==="Escape"){ e.preventDefault(); dialogZu(); }
    /* Die Schnellhilfe soll sich mit derselben Taste wieder schliessen. */

    const p=PINS[+e.key-1];
    if(p) heftOeffne(p);
    else melde("Platz Strg+"+e.key+" ist frei");
    return; }
  /* Alles, was ein `tun` hat, kommt aus der Tabelle. */
  const tr=TASTEN.find(x=>x.tun && x.key===e.key
    && !!x.mod===!!mod && !!x.umschalt===!!e.shiftKey);
  if(tr){ e.preventDefault(); tr.tun(); return; }

    if(flaeche==="leiste"&&eingabe){ eingabe=""; male(); }
    else if(flaeche!=="leiste") zeigeFlaeche("leiste");
    return; }
  if(flaeche==="leiste"&&treffer.length){
    if(e.key==="ArrowDown"){ e.preventDefault(); zeiger=Math.min(zeiger+1,treffer.length-1); markiere(); }
    if(e.key==="ArrowUp"){ e.preventDefault(); zeiger=Math.max(zeiger-1,0); markiere(); }
    if(e.key==="Enter"&&zeiger>=0){ e.preventDefault(); treffer[zeiger].click(); }
  }
  if(!mod&&!imFeld&&e.key.length===1&&flaeche==="leiste"){ const q=$("#q"); if(q) q.focus(); }
});

/* ============================================================
   11 — UHR UND START
   ============================================================ */
let letzteMin=-1;
function uhr(){
  const d=new Date(); HEUTE=iso(d);
  $("#uhr").textContent=p2(d.getHours())+":"+p2(d.getMinutes());
  $("#datum").textContent=TAGL[d.getDay()]+", "+d.getDate()+". "+MONL[d.getMonth()];
  if(d.getMinutes()!==letzteMin){ letzteMin=d.getMinutes(); if(!eingabe) male(); }
}
standZeigen();
/* Nach allen Modulanmeldungen: Plätze aufräumen, die ins Leere zeigen. */
heftAufraeumen();
male();
uhr();
setInterval(uhr,15000);
</script>
