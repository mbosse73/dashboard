<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard — Notion-Stil</title>
<style>
/* ============================================================
   NOTION-VARIANTE

   Farben und Maße nach Notions hellem Thema. Alles liegt in
   diesem einen Block — nichts weiter unten ist hart codiert.
   Vergleich am besten mit einem Farbwähler nebeneinander und
   hier oben nachjustieren.

   Was ich nicht nachbauen kann: Notions Serifenschrift
   (Lyon Text) und Monospace (iA Writer Mono) sind lizenziert.
   Die UI-Schrift dagegen ist auch bei Notion ein System-Stack,
   die stimmt also überein.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;

  /* Notions eigener Stack. Auf Windows greift Segoe UI. */
  --ff:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,
       "Apple Color Emoji",Arial,sans-serif;
  --serif:Lyon-Text,Georgia,ui-serif,serif;          /* Ersatz: Georgia */
  --mono:"SFMono-Regular",Menlo,Consolas,"PT Mono","Liberation Mono",monospace;

  /* Flächen */
  --paper:#ffffff;              /* Hauptfläche */
  --sheet:#fbfbfa;              /* Seitenleiste, ruhige Blöcke */
  --raise:rgba(55,53,47,.06);   /* Hover — Notion arbeitet mit Transparenz */
  --raise-fest:#efefee;
  --rule:rgba(55,53,47,.09);    /* Trennlinien */
  --rule2:rgba(55,53,47,.16);   /* Rahmen von Eingaben */

  /* Text — Notions Grundton ist warmes Schwarzbraun, nicht Grau */
  --ink:rgb(55,53,47);
  --ink2:rgba(55,53,47,.65);
  --ink3:rgba(55,53,47,.45);

  /* Akzent */
  --tinte:#2383e2;              /* Notion-Blau */
  --tinte-s:#ddebf1;            /* Notion blauer Blockhintergrund */
  --tinte-tx:#0b6e99;           /* Notion blauer Text */

  /* „Kontaktweg hinterlegt“ — ein Zustand, keine Kategorie. Notions
     blauer Blockhintergrund, eine Spur heller als --tinte-s. */
  --weg-s:#e8f2f7; --weg-i:#0b6e99; --weg-r:rgba(11,110,153,.22);

  /* Dringlichkeit — Notions Rot statt eines eigenen Signaltons */
  --signal:#e03e3e;
  --signal-tx:#e03e3e;
  --signal-s:#fbe4e4;
  --gut:#0f7b6c;                /* Notion Grün */
  --gut-s:#ddedea;

  --r:3px;                      /* Notions kleine Rundung */
  --r-gross:5px;
}
html,body{background:var(--paper)!important;color:var(--ink)!important;height:100%}
body{font-family:var(--ff);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow:hidden;letter-spacing:normal}
button{font:inherit;border:0;background:transparent;cursor:pointer;color:inherit;text-align:left}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--tinte);outline-offset:1px;border-radius:var(--r)}
::selection{background:rgba(35,131,226,.28)}
*{scrollbar-color:rgba(55,53,47,.2) transparent;scrollbar-width:thin}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(55,53,47,.2);border-radius:6px;
  border:3px solid var(--paper);background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(55,53,47,.3);background-clip:padding-box}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:var(--paper)}

/* ---------- Kopf: Notions Topbar ist flach und leise ---------- */
.kopf{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 14px;height:45px;
  background:var(--paper);border-bottom:1px solid var(--rule)}
.kopf .zeit{font-size:14px;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.kopf .dat{font-size:14px;color:var(--ink3)}
.kopf .sp{flex:1}
.wechsel{display:flex;gap:0}
.wechsel button{font-size:14px;color:var(--ink2);padding:4px 8px;border-radius:var(--r);
  transition:background 20ms ease-in}
.wechsel button:hover{background:var(--raise)}
.wechsel button[aria-current="true"]{background:var(--raise);color:var(--ink);font-weight:500}
.kopf .akt{font-size:14px;color:var(--ink2);border-radius:var(--r);padding:4px 8px;
  background:transparent;transition:background 20ms ease-in}
.kopf .akt:hover{background:var(--raise);color:var(--ink)}
.kopf .stand{font-size:12px;color:var(--ink3)}
.warn{flex-shrink:0;padding:9px 16px;background:var(--signal-s);color:var(--ink);
  font-size:14px;line-height:1.5}
.warn b{font-weight:600}

.rumpf{flex:1;min-height:0;overflow-y:auto;background:var(--paper)}
.mitte{max-width:900px;margin:0 auto;padding:0 96px 90px;width:100%}
@media(max-width:900px){.mitte{padding-left:24px;padding-right:24px}}
.weit{max-width:1180px}

/* ---------- Überschriften: Notion setzt eng und fett ---------- */
.abs{display:flex;align-items:center;gap:10px;padding:32px 0 6px}
.abs h2{font-size:16px;font-weight:600;letter-spacing:-.01em;color:var(--ink);
  text-transform:none;font-family:var(--ff)}
.abs h2.eilig{color:var(--signal-tx)}
.abs h2.jetzt{color:var(--ink)}
.abs .r{display:none}
.abs .n{font-size:12px;color:var(--ink3);margin-left:auto}
.abs button.n{border-radius:var(--r);padding:2px 6px}
.abs button.n:hover{background:var(--raise);color:var(--ink2)}
.hinweis{font-size:14px;color:var(--ink3);line-height:1.5;padding:2px 0 8px}

/* ---------- Zeilen: Notion-Blöcke mit weichem Hover ---------- */
.z{display:flex;align-items:flex-start;gap:8px;padding:5px 8px 5px 6px;
  border-radius:var(--r);margin:1px -8px;transition:background 20ms ease-in}
.z:hover{background:var(--raise)}
.z + .z{box-shadow:none}
.z.eilig{box-shadow:inset 2px 0 0 var(--signal)}
.z.jetzt{box-shadow:inset 2px 0 0 var(--tinte)}
.kast{width:16px;height:16px;border-radius:var(--r);border:1.3px solid rgba(55,53,47,.35);
  flex-shrink:0;display:grid;place-items:center;background:transparent;margin-top:3px;
  transition:background 20ms ease-in,border-color 20ms ease-in}
.kast:hover{border-color:var(--ink2)}
.kast svg{width:9px;height:9px;stroke:#fff;stroke-width:3;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.z.fertig .kast{background:var(--tinte);border-color:var(--tinte)}
.z.fertig .kast svg{opacity:1}
.zb{flex:1;min-width:0}
.zt{display:block;font-size:14px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.z.fertig .zt{color:var(--ink3);text-decoration:line-through}
.zm{display:block;font-size:12px;color:var(--ink3);margin-top:1px;line-height:1.4}
.zr{font-size:12px;color:var(--ink3);flex-shrink:0;padding-top:3px;
  font-variant-numeric:tabular-nums}
.zr.eilig{color:var(--signal-tx);font-weight:500}
.zr.jetzt{color:var(--tinte-tx);font-weight:500}
.sig{width:22px;height:22px;border-radius:50%;background:var(--raise-fest);color:var(--ink2);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.sig.fav{background:var(--tinte-s);color:var(--tinte-tx)}
.leer{padding:8px 0;font-size:14px;color:var(--ink3);line-height:1.5}

/* ---------- Kontaktkacheln ----------
   Dieselbe Struktur wie in dashboard.html, nur Notions Maße:
   kleine Rundung, dünne Linien, kein Schlagschatten im Ruhezustand. */
.kkarten{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:6px}
.kk{position:relative;display:flex;flex-direction:column;gap:9px;padding:11px 12px;
  border:1px solid var(--rule);border-radius:var(--r-gross);background:var(--paper);
  transition:background .1s}
.kk:hover{background:var(--sheet)}
.kk.ist-fav{border-left:2px solid var(--tinte)}
.kk-o{display:flex;align-items:flex-start;gap:10px}
.kk-b{flex:1;min-width:0}
.kk-n{display:block;font-size:14px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.kk-f{display:block;font-size:12px;color:var(--ink3);margin-top:2px;line-height:1.4;
  overflow-wrap:anywhere}
.kk-u{display:flex;align-items:center;gap:5px;padding-top:1px}
.kk-flaeche{position:absolute;inset:0;border-radius:var(--r-gross);z-index:1}
.kk-u,.kk-stern{position:relative;z-index:2}
.kk-stern{display:grid;place-items:center;width:26px;height:26px;border-radius:var(--r);
  color:var(--ink3);flex-shrink:0;margin:-1px -2px 0 0}
.kk-stern:hover{background:var(--raise);color:var(--ink2)}
.kk-stern.an,.kk-stern.an:hover{color:var(--tinte-tx)}
.iknopf{position:relative;display:grid;place-items:center;width:32px;height:29px;
  border:1px solid var(--weg-r);border-radius:var(--r);background:var(--weg-s);
  color:var(--weg-i);transition:background .1s,border-color .1s,color .1s}
.iknopf:hover{background:#d9eaf3;border-color:var(--weg-i)}
.iknopf.leer{background:transparent;border-color:var(--rule);color:var(--ink3);opacity:.45;
  cursor:default}
.iknopf.leer:hover{background:transparent;border-color:var(--rule);color:var(--ink3)}
.iknopf .blase{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:12px;line-height:1.35;white-space:nowrap;
  padding:5px 9px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .1s;
  z-index:40;font-family:var(--mono)}
.iknopf .blase b{display:block;font-family:var(--ff);font-weight:600;margin-bottom:1px}
.iknopf:hover .blase{opacity:1}

/* ---------- Suche innerhalb eines Moduls ---------- */
.msuche{position:relative;margin-top:2px}
.msuche input{width:100%;border:1px solid var(--rule2);border-radius:var(--r);
  padding:7px 38px 7px 34px;background:var(--paper);font-size:14px;color:var(--ink)}
.msuche input:focus{outline:0;border-color:var(--tinte);
  box-shadow:0 0 0 2px rgba(35,131,226,.24)}
.msuche .lupe{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--ink3);pointer-events:none;display:grid}
.msuche .weg{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  color:var(--ink3);padding:4px 7px;border-radius:var(--r);font-size:12px}
.msuche .weg:hover{background:var(--raise);color:var(--ink)}

/* ---------- Dialog ----------
   Notion legt Dialoge auf Weiß mit weichem Schatten und fast ohne
   Rahmen. Auf und Zu laufen über .schleier und .schleier.auf,
   niemals über eine ID-Regel — Fehlerbuch Punkt 6. */
.schleier{position:fixed;inset:0;background:rgba(15,15,15,.6);display:none;
  place-items:center;padding:18px;z-index:500}
.schleier.auf{display:grid}
.dlg{width:min(620px,100%);max-height:calc(100vh - 36px);background:var(--paper);
  border-radius:var(--r-gross);box-shadow:0 14px 44px rgba(15,15,15,.16),
  0 2px 6px rgba(15,15,15,.1);display:flex;flex-direction:column;overflow:hidden}
.dlg-k{flex-shrink:0;display:flex;align-items:baseline;gap:11px;padding:14px 18px 11px;
  border-bottom:1px solid var(--rule)}
.dlg-k .art{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);font-weight:600;white-space:nowrap}
.dlg-t{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.dlg-k .sp{flex:1}
.dlg-zu{font-size:18px;color:var(--ink3);line-height:1;padding:2px 7px;border-radius:var(--r)}
.dlg-zu:hover{background:var(--raise);color:var(--ink)}
.dlg-b{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px}
.dlg-f{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:11px 18px;
  border-top:1px solid var(--rule);background:var(--sheet)}
.dlg-f .sp{flex:1}
.draster{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px 12px}
.dfeld{display:flex;flex-direction:column;gap:4px}
.dfeld.breit{grid-column:1/-1}
.dfeld label{font-size:12px;color:var(--ink3);font-weight:500}
.dfeld input,.dfeld textarea{border:1px solid var(--rule2);border-radius:var(--r);
  padding:6px 9px;background:var(--paper);font-size:14px;color:var(--ink);width:100%}
.dfeld input:focus,.dfeld textarea:focus{outline:0;border-color:var(--tinte);
  box-shadow:0 0 0 2px rgba(35,131,226,.24)}
.dfeld textarea{min-height:72px;resize:vertical;line-height:1.5}
.dfeld select{border:1px solid var(--rule2);border-radius:var(--r);padding:6px 9px;
  background:var(--paper);font-size:14px;color:var(--ink);width:100%}
.dfeld select:focus{outline:0;border-color:var(--tinte);
  box-shadow:0 0 0 2px rgba(35,131,226,.24)}
.dfeld.schief input,.dfeld.schief textarea,.dfeld.schief select{border-color:var(--signal);
  background:var(--signal-s)}

.dfeld.schalter{flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;
  padding:8px 9px;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.dfeld.schalter input{width:16px;height:16px;padding:0;accent-color:var(--tinte);flex-shrink:0}
.dfeld.schalter label{font-size:14px;color:var(--ink)}
.dfeld .sub{display:block;font-size:12px;color:var(--ink3);margin-top:1px}

/* ---------- Formatierungsleiste über mehrzeiligen Feldern ---------- */
.mdfeld{display:flex;flex-direction:column}
.mdleiste{display:flex;align-items:center;gap:1px;padding:3px 4px;flex-wrap:wrap;
  border:1px solid var(--rule2);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  background:var(--sheet)}
.mdfeld textarea{border-radius:0 0 var(--r) var(--r);min-height:100px}
.mdknopf{display:grid;place-items:center;width:26px;height:24px;border-radius:var(--r);
  color:var(--ink2);flex-shrink:0}
.mdknopf:hover{background:var(--raise);color:var(--ink)}
.mdknopf svg{width:15px;height:15px}
.mdstrich{width:1px;height:16px;background:var(--rule);margin:0 3px;flex-shrink:0}
.mdleiste .sp{flex:1}
.mdschau{font-size:12px;color:var(--ink3);padding:3px 8px;border-radius:var(--r)}
.mdschau:hover{background:var(--raise);color:var(--ink)}
.mdschau[aria-pressed="true"]{background:var(--tinte-s);color:var(--tinte-tx)}
.mdvor{border:1px solid var(--rule2);border-radius:0 0 var(--r) var(--r);
  background:var(--paper);padding:10px 11px;font-size:14px;line-height:1.6;min-height:100px;
  overflow-wrap:anywhere}
.mdvor > :first-child{margin-top:0}
.mdvor h3{font-size:15px;font-weight:600;margin:12px 0 4px}
.mdvor p{margin:0 0 7px}
.mdvor ul{margin:0 0 7px 19px}
.mdvor li{margin-top:2px}
.mdvor hr{border:0;border-top:1px solid var(--rule);margin:11px 0}
.mdvor .leerhin{color:var(--ink3);font-style:italic}
.merk{font-size:14px;color:var(--ink2);background:var(--sheet);border-radius:var(--r);
  padding:9px 11px;margin-top:12px;line-height:1.5}
.merk.warn{color:var(--signal-tx);background:var(--signal-s)}
.merk b{font-weight:600}
.merk ul{margin:5px 0 0 17px}
.merk li{margin-top:2px}
.tat.weg{color:var(--signal-tx);border-color:transparent;background:transparent}
.tat.weg:hover{background:var(--signal-s)}
.tat.weg.ernst{border-color:rgba(224,62,62,.4);background:var(--signal-s);font-weight:600}
kbd{font-family:var(--mono);font-size:12px;background:var(--raise-fest);border:0;
  border-radius:var(--r);padding:1px 5px;color:var(--signal-tx)}

/* ---------- Knöpfe im Notion-Stil ---------- */
.tat{font-size:14px;font-weight:500;background:var(--tinte);color:#fff;border:0;
  padding:4px 10px;border-radius:var(--r);flex-shrink:0;transition:background 20ms ease-in}
.tat:hover{background:#0b7ad1}
.tat.still{background:transparent;color:var(--ink2);
  box-shadow:inset 0 0 0 1px var(--rule2)}
.tat.still:hover{background:var(--raise);color:var(--ink)}

/* ---------- Eingabefeld: Notions Suchfeld ---------- */
.feld{display:flex;align-items:center;gap:10px;background:var(--sheet);
  border-radius:var(--r-gross);padding:10px 14px;
  box-shadow:inset 0 0 0 1px var(--rule2);transition:box-shadow 20ms ease-in}
.feld:focus-within{box-shadow:inset 0 0 0 1px var(--tinte),0 0 0 2px rgba(35,131,226,.2)}
.feld .c{font-size:16px;color:var(--ink3);line-height:1}
.feld:focus-within .c{color:var(--tinte)}
.feld input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;
  font-weight:400;color:var(--ink);letter-spacing:normal}
.feld input::placeholder{color:var(--ink3)}
.feld .k{font-size:12px;color:var(--ink3);flex-shrink:0;background:var(--raise-fest);
  border-radius:var(--r);padding:2px 6px}
.schwelle{padding:64px 0 0}
@media(max-height:820px){.schwelle{padding-top:36px}}

/* ---------- Trefferzeilen ---------- */
.tr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r);
  margin:1px -8px;width:calc(100% + 16px);transition:background 20ms ease-in}
.tr:hover,.tr.wahl{background:var(--raise)}
.tr-a{font-size:12px;color:var(--ink3);flex-shrink:0;min-width:80px;font-weight:400}
.tr.wahl .tr-a{color:var(--tinte-tx)}
.tr-b{flex:1;min-width:0}
.tr-t{display:block;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.tr-m{display:block;font-size:12px;color:var(--ink3);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tr-k{font-size:12px;color:var(--ink3);flex-shrink:0;opacity:0}
.tr:hover .tr-k,.tr.wahl .tr-k{opacity:1}
.rechner{padding:14px 16px;border-radius:var(--r);background:var(--tinte-s);margin:10px 0 4px}
.rechner .frage{font-size:12px;color:var(--tinte-tx)}
.rechner .zahl{font-size:28px;color:var(--ink);margin-top:3px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- Der große Satz: Notions H1 ---------- */
.naechst-t{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;
  color:var(--ink);font-family:var(--ff)}
.naechst-m{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.5}

/* ---------- Raster ---------- */
.marken{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:0}
.mk{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:var(--r);
  transition:background 20ms ease-in}
.mk:hover{background:var(--raise)}
.mk b{font-size:12px;color:var(--ink3);font-weight:400;min-width:22px}
.mk:hover b{color:var(--ink2)}
.mk span{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;border-bottom:.05em solid rgba(55,53,47,.25)}
.modliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:0}
.ml{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:var(--r);
  transition:background 20ms ease-in}
.ml:hover{background:var(--raise)}
.ml b{font-size:12px;color:var(--ink3);min-width:20px}
.ml span{font-size:14px;color:var(--ink)}
.ml em{font-style:normal;font-size:12px;color:var(--ink3);margin-left:auto}

/* ---------- Planner ---------- */
.planer{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--paper)}
.spalte{flex:1;min-width:225px;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--rule);background:var(--paper)}
.spalte:last-child{border-right:0}
.spalte.vorrat{flex:0 0 260px;background:var(--sheet)}
.spalte.heute{background:var(--paper)}
.sp-k{flex-shrink:0;padding:12px 14px 8px;border-bottom:1px solid var(--rule)}
.sp-d{font-size:12px;color:var(--ink3);font-weight:400}
.spalte.heute .sp-d{color:var(--tinte-tx);font-weight:500}
.sp-n{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-top:2px;
  display:flex;align-items:baseline;gap:8px}
.sp-n em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:400;margin-left:auto}
.sp-b{flex:1;overflow-y:auto;padding:4px 8px 24px}
.raster{position:relative}
.stunde{display:flex;min-height:44px;border-top:1px solid var(--rule)}
.stunde:first-child{border-top:0}
.stunde.ziel{background:var(--tinte-s)}
.st-t{width:42px;flex-shrink:0;font-size:12px;color:var(--ink3);padding-top:4px;
  font-variant-numeric:tabular-nums}
.st-l{flex:1;min-width:0;padding:3px 0 3px 6px;display:flex;flex-direction:column;gap:2px}
.blk{border-radius:var(--r);padding:5px 8px;background:var(--raise-fest);cursor:grab;
  box-shadow:inset 3px 0 0 var(--ink3);transition:background 20ms ease-in}
.blk:hover{background:rgba(55,53,47,.11)}
.blk.zieht{opacity:.4}
.blk.termin{background:var(--tinte-s);box-shadow:inset 3px 0 0 var(--tinte)}
.blk.aufgabe{background:var(--gut-s);box-shadow:inset 3px 0 0 var(--gut)}
.blk.spaet{background:var(--signal-s);box-shadow:inset 3px 0 0 var(--signal)}
.blk{display:flex;align-items:flex-start;gap:7px;cursor:pointer}
.blk-b{flex:1;min-width:0}
.blk .t{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.blk .m{display:block;font-size:12px;color:var(--ink2);margin-top:1px}
.blk .kast{width:15px;height:15px;border-radius:3px;margin-top:2px}
.blk .kast svg{width:9px;height:9px}
.blk.fertig .t{text-decoration:line-through;color:var(--ink3)}
.vz{cursor:pointer}
.jetztlinie{position:absolute;left:42px;right:0;height:2px;background:var(--signal);z-index:3}
.jetztlinie::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--signal)}
.jetztlinie span{position:absolute;right:2px;top:-15px;font-size:11px;font-weight:600;
  color:var(--signal-tx)}
.vz{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border-radius:var(--r);
  cursor:grab;transition:background 20ms ease-in}
.vz:hover{background:var(--raise)}
.vz.zieht{opacity:.4}
.vz.spaet{box-shadow:inset 2px 0 0 var(--signal)}
.wf{padding:6px 8px;border-radius:var(--r);background:var(--signal-s);margin-bottom:2px}
.wf .t{font-size:14px;font-weight:500;color:var(--ink)}
.wf .m{font-size:12px;color:var(--ink2);margin-top:1px}

/* ---------- Modulflächen ---------- */
.zurueck{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink3);
  padding:4px 8px;margin:14px -8px 0;border-radius:var(--r);
  transition:background 20ms ease-in}
.zurueck:hover{background:var(--raise);color:var(--ink)}
.karte{padding:12px 14px;border-radius:var(--r);background:var(--sheet);
  box-shadow:inset 0 0 0 1px var(--rule);margin-bottom:4px}
.baum{padding-left:0}
.knoten{display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-radius:var(--r);
  transition:background 20ms ease-in}
.knoten:hover{background:var(--raise)}
.knoten .pkt{width:5px;height:5px;border-radius:50%;background:var(--ink3);flex-shrink:0}
.knoten .tx{font-size:14px;color:var(--ink)}
textarea.code{width:100%;min-height:150px;border:0;border-radius:var(--r);
  background:var(--sheet);box-shadow:inset 0 0 0 1px var(--rule);padding:12px;
  font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;color:var(--ink)}
textarea.code:focus{outline:0;box-shadow:inset 0 0 0 1px var(--tinte)}

.zettel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(70px);
  background:var(--ink);color:#fff;font-size:14px;padding:8px 14px;border-radius:var(--r);
  opacity:0;pointer-events:none;z-index:9500;
  box-shadow:0 6px 16px rgba(15,15,15,.16),0 3px 6px rgba(15,15,15,.1);
  transition:transform .2s ease-out,opacity .2s ease-out}
.zettel.an{transform:translateX(-50%) translateY(0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Kalender: zwei Werktage nebeneinander ---------- */
.tage{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
.tag{border:1px solid var(--rule);border-radius:var(--r-gross);background:var(--paper);
  overflow:hidden}
.tag-k{display:flex;align-items:baseline;gap:8px;padding:9px 12px;
  border-bottom:1px solid var(--rule);background:var(--sheet)}
.tag-k .d{font-size:14px;font-weight:600}
.tag-k .h{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tinte-tx);font-weight:600}
.tag-k .sp{flex:1}
.tag-k .n{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.tag-b{padding:4px 6px 8px}
.tagfuss{padding:2px 6px 6px}
.tm{display:flex;align-items:flex-start;gap:10px;padding:6px 7px;border-radius:var(--r);
  width:100%;text-align:left}
.tm:hover{background:var(--raise)}
.tm .u{font-family:var(--mono);font-size:12px;color:var(--ink2);font-weight:600;flex-shrink:0;
  padding-top:1px;font-variant-numeric:tabular-nums}
.tm .b{flex:1;min-width:0}
.tm .t{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.tm .m{display:block;font-size:12px;color:var(--ink3);margin-top:1px;overflow-wrap:anywhere}
.tm .w{font-size:12px;color:var(--ink3);flex-shrink:0;padding-top:2px}

/* ---------- Notizen ---------- */
textarea.sz{min-height:118px;font-family:var(--mono);font-size:13px}
.nz{position:relative;border:1px solid var(--rule);border-radius:var(--r-gross);
  background:var(--paper);margin-bottom:6px;overflow:hidden}
.nz:hover{background:var(--sheet)}
.nz.tel{border-left:2px solid var(--tinte)}
.nz-b{display:block;width:100%;padding:11px 13px}
.nz-k{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.nz-t{font-size:14px;font-weight:600}
.nz-a{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);font-weight:600}
.nz-w{font-size:12px;color:var(--tinte-tx);background:var(--tinte-s);border-radius:var(--r);
  padding:1px 6px}
.nz-k .sp{flex:1}
.nz-d{font-family:var(--mono);font-size:12px;color:var(--ink3);white-space:nowrap}
.nz-v{display:block;font-size:14px;line-height:1.55;color:var(--ink2);overflow-wrap:anywhere}
.nz-v > :first-child{margin-top:0}
.nz-v h3{font-size:14px;font-weight:600;color:var(--ink);margin:10px 0 3px}
.nz-v p{margin:0 0 6px}

.nz-v li{margin-top:2px}

/* ---------- Schmierzettel, kompakt in der Leiste ---------- */
.szk{border:1px solid var(--rule2);border-radius:var(--r);background:var(--paper);
  overflow:hidden}

<body>

<div class="app">
  <div class="kopf">
    <span class="zeit" id="uhr">—</span>

</div>

<div class="zettel" id="zettel" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   1 — GRUNDLAGEN
   ============================================================ */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c;
  if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2 = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const TAGL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August",
            "September","Oktober","November","Dezember"];
const MONK=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
let melT;
function melde(m){ const t=$("#zettel"); t.textContent=m; t.classList.add("an");
  clearTimeout(melT); melT=setTimeout(()=>t.classList.remove("an"),2200); }

const LS_OK=(()=>{ try{localStorage.setItem("db-probe","1");
  localStorage.removeItem("db-probe"); return true;}catch(e){return false;} })();
const store={ get(k,d){ try{const v=localStorage.getItem(k); return v?JSON.parse(v):d;}catch(e){return d;} },
              set(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} } };

function istWerktag(d){ const t=d.getDay(); return t>=1&&t<=5; }
function naechsterWerktag(v){ const d=new Date(v); d.setHours(0,0,0,0);
  do{ d.setDate(d.getDate()+1); }while(!istWerktag(d)); return d; }
function planTage(){ const h=new Date(); h.setHours(0,0,0,0);
  const a=istWerktag(h)?h:naechsterWerktag(h); return [a,naechsterWerktag(a)]; }
let HEUTE=iso(new Date());
function tagPlus(n){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return iso(d); }
const K0=planTage().map(iso);

function frist(x){
  if(!x.d) return "ohne Frist";
  const diff=Math.round((new Date(x.d+"T00:00:00")-new Date(HEUTE+"T00:00:00"))/86400000);
  const d=new Date(x.d+"T00:00:00");
  if(diff<0) return "überfällig";
  if(diff===0) return x.zeit||"heute";
  if(diff===1) return "morgen";
  if(diff<7) return TAGL[d.getDay()];
  return d.getDate()+". "+MONK[d.getMonth()];
}
const istSpaet = x => !x.fertig && x.d && x.d < HEUTE;

function abschnitt(t,n,kl){
  const a=el("div","abs",'<h2'+(kl?' class="'+kl+'"':'')+'>'+esc(t)+'</h2><span class="r"></span>');
  if(n) a.appendChild(el("span","n",esc(n)));
  return a;
}
function zeile(x,opt){
  opt=opt||{};
  const r=el("div","z"+(x.fertig?" fertig":"")+(opt.k?" "+opt.k:""));
  if(opt.hakbar!==false){
    const kast=el("button","kast");
    kast.innerHTML='<svg viewBox="0 0 12 12"><path d="M2 6.2 4.6 9 10 3"/></svg>';
    kast.setAttribute("aria-label",(x.fertig?"Wieder öffnen: ":"Erledigen: ")+x.titel);
    kast.onclick=e=>{ e.stopPropagation(); x.fertig=!x.fertig; bewahre(); male();
      melde(x.fertig?"Erledigt: "+x.titel:"Wieder offen: "+x.titel); };
    r.appendChild(kast);
  }
  r.appendChild(el("span","zb",'<span class="zt">'+esc(opt.titel||x.titel)+'</span>'
    +(opt.meta?'<span class="zm">'+esc(opt.meta)+'</span>':'')));
  if(opt.rechts) r.appendChild(el("span","zr "+(opt.k||""),esc(opt.rechts)));
  return r;
}

/* ---------- Zeichen ----------
   Inline-SVG mit stroke="currentColor" und fill="none". Gefüllte
   Unicode-Zeichen rendern auf dieser Größe als dunkle Blöcke —
   Fehlerbuch Punkt 2. Das gilt auch für den Stern: U+2605 heißt im
   Standard wörtlich BLACK STAR. */
const IKON=d=>'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" '
  +'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" '
  +'stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';
const IK={
  tel:  IKON('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6'
       +' 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1'
       +'-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
  mail: IKON('<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>'
       +'<path d="m3 7 8.1 5.6a1.6 1.6 0 0 0 1.8 0L21 7"/>'),
  stern:IKON('<path d="m12 3.2 2.7 5.5 6.1.9-4.4 4.3 1 6-5.4-2.8-5.4 2.8 1-6L3.2 9.6l6.1-.9z"/>'),
  lupe: IKON('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.9-3.9"/>'),
  /* Zeichen der Formatierungsleiste */
  fett:  IKON('<path d="M6.5 4h6a3.8 3.8 0 0 1 0 7.6h-6z"/><path d="M6.5 11.6h6.8a4.2 4.2 0 0 1 0 8.4H6.5z"/>'),
  kursiv:IKON('<path d="M15.5 4h-6M14.5 20h-6M15 4 9 20"/>'),
  gross: IKON('<path d="M5.5 19V5h6.2M5.5 12h5.4"/><path d="M15 19v-8.5h4.5M15 15h3.6"/>'),
  liste: IKON('<path d="M9.5 6.5h11M9.5 12h11M9.5 17.5h11"/>'
        +'<path d="M4 6.5h.01M4 12h.01M4 17.5h.01"/>'),
  linie: IKON('<path d="M3.5 12h17"/>')
};

/* ---------- Kontaktweg: anrufen und mailen ----------
   Ein echter Verweis, kein window.open. Das ist der Weg, den Edge
   bei file:// am verlässlichsten an Windows durchreicht. Fehlt der
   Weg, bleibt der Knopf trotzdem stehen — nur blass und ohne Ziel.
   So sitzen die Knöpfe auf jeder Kachel an derselben Stelle. */
function wegKnopf(art, ziel){
  const da=!!ziel, was = art==="tel" ? "Anrufen" : "Mailen";
  const n=el(da?"a":"span","iknopf"+(da?"":" leer"));
  if(da) n.href = art==="tel" ? telUri(ziel) : "mailto:"+ziel;
  n.setAttribute("aria-label", da ? was+": "+ziel
    : (art==="tel" ? "Keine Rufnummer hinterlegt" : "Keine Mailadresse hinterlegt"));
  n.innerHTML=IK[art]+'<span class="blase"><b>'+was+'</b>'
    +esc(da?ziel:"nicht hinterlegt")+'</span>';
  n.onclick=e=>e.stopPropagation();
  return n;
}
/* Aus einem Treffer der Leiste heraus gibt es kein <a> zum Anklicken.
   Ein kurz eingehängter Verweis leistet dasselbe. */
function oeffneWeg(url){
  const a=document.createElement("a");
  a.href=url; a.style.display="none";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Die Kontaktkachel ----------
   Wird an zwei Stellen gebraucht: im Modul und im Ruhezustand der
   Leiste. Deshalb steht sie hier und nicht in einem Modulblock. */
function kontaktKachel(k){
  const c=el("div","kk"+(k.fav?" ist-fav":""));
  const f=el("button","kk-flaeche");
  f.setAttribute("aria-label","Kontakt "+knm(k)+" öffnen");
  f.onclick=()=>kontaktDialog(k);
  c.appendChild(f);

  const o=el("div","kk-o");
  o.appendChild(el("span","sig"+(k.fav?" fav":""),ini(k)));
  o.appendChild(el("span","kk-b",'<span class="kk-n">'+esc(knm(k))+'</span>'
    +'<span class="kk-f">'+esc(k.firma||"—")+'</span>'));
  const st=el("button","kk-stern"+(k.fav?" an":""),IK.stern);
  st.setAttribute("aria-label",(k.fav?"Favorit aufheben: ":"Als Favorit markieren: ")+knm(k));
  st.setAttribute("aria-pressed",String(!!k.fav));
  st.onclick=e=>{ e.stopPropagation(); k.fav=!k.fav; bewahre(); male();
    melde(k.fav ? knm(k)+" ist jetzt Favorit" : knm(k)+" ist kein Favorit mehr"); };
  o.appendChild(st);
  c.appendChild(o);

  const u=el("div","kk-u");
  u.append(wegKnopf("tel",k.tel), wegKnopf("mail",k.mail));
  c.appendChild(u);
  return c;
}
function kachelraster(liste){
  const g=el("div","kkarten");
  liste.forEach(k=>g.appendChild(kontaktKachel(k)));
  return g;
}
const nachNachnamen=(a,b)=>String(a.nach||"").localeCompare(String(b.nach||""),"de");
function datumLang(d){ const x=new Date(d+"T00:00:00");
  return TAGL[x.getDay()]+", "+x.getDate()+". "+MONK[x.getMonth()]; }

/* ============================================================
   EINE NOTIZ ALS .md — hinaus und zurück

   doku/FEHLERBUCH.md Punkt 5: Ein selbst geschriebener Parser hat
   einen Titel mit Gedankenstrich zerrissen. Deshalb hat der
   Kopfblock hier eine harte Grenze. Er gilt nur, wenn

     die Datei mit --- in Zeile 1 beginnt,
     ein zweites --- innerhalb der ersten zehn Zeilen folgt,
     und dazwischen ausschließlich `schlüssel: wert` steht.

   Trifft eines davon nicht zu, ist die ganze Datei Text. Verloren
   geht dabei nichts — es wandert höchstens in den Rumpf.

   Das ist kein Sicherungsformat. Gesichert wird weiter über JSON;
   diese Dateien sind für den Weg nach draußen.
   ============================================================ */
const KOPFFELDER=["art","titel","d","zeit","wer"];
function notizAlsMd(n){
  const k=["---"];
  KOPFFELDER.forEach(s=>{ if(n[s]) k.push(s+": "+String(n[s]).replace(/\n/g," ")); });
  const w=notizWer(n); if(w && !n.wer) k.push("wer: "+w);   /* Kontaktnamen ausschreiben */
  k.push("---","");
  return k.join("\n")+String(n.text||"").replace(/\s+$/,"")+"\n";
}
function notizAusMd(text, dateiname){
  const z=String(text).replace(/\r\n/g,"\n").split("\n");
  const n=Object.assign({},NLEER,{art:"allgemein",d:HEUTE});
  let ab=0;
  if(z[0].trim()==="---"){
    const zu=z.slice(1,11).findIndex(x=>x.trim()==="---");
    if(zu>=0){
      const kopf=z.slice(1,zu+1);
      if(kopf.length && kopf.every(x=>/^[a-zäöüß]+:\s/.test(x.trim()))){
        kopf.forEach(x=>{ const i=x.indexOf(":");
          const sc=x.slice(0,i).trim(), v=x.slice(i+1).trim();
          if(KOPFFELDER.indexOf(sc)>=0) n[sc]=v; });
        ab=zu+2;
        while(z[ab]!==undefined && z[ab].trim()==="") ab++;
      }
    }
  }
  n.text=z.slice(ab).join("\n").replace(/\s+$/,"");
  if(!n.titel){
    const u=n.text.match(/^#{1,6}\s+(.+)$/m);
    n.titel = u ? u[1].trim()
      : String(dateiname||"").replace(/\.md$/i,"").replace(/^\d{4}-\d\d-\d\d[ _-]*/,"")
        || "Ohne Titel";
  }
  n.id=neueId("n");
  /* Ein Kontaktverweis überlebt den Weg nach draußen nicht — die
     Gegenseite kennt unsere Kennungen nicht. Der Name bleibt als Text. */
  n.kontakt=null;
  return n;
}

/* ============================================================
   DER SCHMIERZETTEL — ein Text, zwei Fenster darauf

   Beide schreiben in dieselbe Stelle. Zwei getrennte Zettel, die
   sich stillschweigend widersprechen, wären das Schlimmste daran.
   ============================================================ */
function schmierGross(){
  const k=el("div","mdfeld");
  const ta=el("textarea"); ta.className="sz"; ta.value=Z.schmierzettel||"";
  ta.setAttribute("aria-label","Schmierzettel");
  ta.oninput=()=>{ Z.schmierzettel=ta.value; bewahre(); };
  k.append(mdLeiste(ta), ta);
  return k;
}
function schmierKlein(){
  const k=el("div","szk");
  const ta=el("textarea"); ta.value=Z.schmierzettel||"";
  ta.setAttribute("aria-label","Schmierzettel");
  ta.placeholder="Schnell etwas merken …";
  ta.oninput=()=>{ Z.schmierzettel=ta.value; bewahre(); };
  k.appendChild(ta);
  const f=el("div","szk-f",'<span class="h">speichert beim Tippen</span>'
    +'<span class="sp"></span>');
  const gross=el("button",null,"im Modul öffnen ›");
  gross.onclick=()=>zeigeFlaeche("notizen");
  f.appendChild(gross);
  const leeren=el("button",null,"leeren");
  leeren.onclick=()=>{ Z.schmierzettel=""; bewahre(); male(); melde("Schmierzettel geleert"); };
  f.appendChild(leeren);
  k.appendChild(f);
  return k;
}

/* ============================================================
   MARKDOWN IN MEHRZEILIGEN FELDERN

   Fünf Zeichen, mehr nicht. Der vollständige Umwandler gehört
   nach doku/ROADMAP.md in Schritt 5 — dieser hier ist sein
   Anfang und wird dort um Links, Code und Zitat erweitert,
   statt neu geschrieben zu werden.

   Unterstreichen ist bewusst nicht dabei: Markdown kennt es nicht.
   Weder `_x_` noch `__x__` ergeben eine Unterstreichung, beide sind
   kursiv beziehungsweise fett. Es ginge nur über eingebettetes HTML,
   und dafür ist es zu wenig wert.
   ============================================================ */
const MDTAT=[
  {schl:"fett",  zeichen:"fett",  nm:"Fett",           taste:"b", um:["**","**"]},
  {schl:"kursiv",zeichen:"kursiv",nm:"Kursiv",         taste:"i", um:["*","*"]},
  {strich:true},
  {schl:"gross", zeichen:"gross", nm:"Überschrift",    vor:"## "},
  {schl:"liste", zeichen:"liste", nm:"Aufzählung",     vor:"- "},
  {schl:"linie", zeichen:"linie", nm:"Trennlinie",     block:"---"}
];

/* Setzt die Auszeichnung um die Auswahl. Ohne Auswahl wird ein
   Beispielwort eingesetzt und markiert, damit man gleich tippen kann. */
function mdUm(ta, auf, zu){
  const a=ta.selectionStart, e=ta.selectionEnd, t=ta.value;
  const gewaehlt=t.slice(a,e) || "Text";
  const schon = t.slice(a-auf.length,a)===auf && t.slice(e,e+zu.length)===zu;
  if(schon){                                  /* zweiter Klick nimmt es zurück */
    ta.value = t.slice(0,a-auf.length)+gewaehlt+t.slice(e+zu.length);
    ta.setSelectionRange(a-auf.length, a-auf.length+gewaehlt.length);
  } else {
    ta.value = t.slice(0,a)+auf+gewaehlt+zu+t.slice(e);
    ta.setSelectionRange(a+auf.length, a+auf.length+gewaehlt.length);
  }
}
/* Setzt ein Vorzeichen an jeden Anfang der berührten Zeilen. */
function mdVor(ta, vor){
  const t=ta.value;
  const a=t.lastIndexOf("\n", ta.selectionStart-1)+1;
  let e=t.indexOf("\n", ta.selectionEnd); if(e<0) e=t.length;
  const zeilen=t.slice(a,e).split("\n");
  const alle=zeilen.every(z=>z.startsWith(vor));
  const neu=zeilen.map(z=>alle ? z.slice(vor.length) : vor+z).join("\n");
  ta.value=t.slice(0,a)+neu+t.slice(e);
  ta.setSelectionRange(a, a+neu.length);
}
function mdBlock(ta, block){
  const a=ta.selectionStart, t=ta.value;
  const davor = a===0 || t[a-1]==="\n" ? "" : "\n";
  const text = davor+block+"\n";
  ta.value = t.slice(0,a)+text+t.slice(ta.selectionEnd);
  ta.setSelectionRange(a+text.length, a+text.length);
}
function mdAnwenden(ta, def){
  if(def.um)        mdUm(ta, def.um[0], def.um[1]);
  else if(def.vor)  mdVor(ta, def.vor);
  else if(def.block)mdBlock(ta, def.block);
  ta.focus();
  ta.dispatchEvent(new Event("input",{bubbles:true}));
}

/* Der knappe Umwandler. Deckt genau die sechs Zeichen der Leiste ab. */
function mdMalen(text){
  if(!String(text||"").trim()) return '<span class="leerhin">Noch nichts geschrieben.</span>';
  const zeile=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>");
  const aus=[]; let liste=null;
  String(text).split("\n").forEach(z=>{
    const t=z.trim();
    if(/^-{3,}$/.test(t)){ if(liste){aus.push("</ul>");liste=null;} aus.push("<hr>"); return; }
    const u=t.match(/^(#{1,6})\s+(.*)$/);
    if(u){ if(liste){aus.push("</ul>");liste=null;} aus.push("<h3>"+zeile(u[2])+"</h3>"); return; }
    const p=t.match(/^[-*]\s+(.*)$/);
    if(p){ if(!liste){aus.push("<ul>");liste=1;} aus.push("<li>"+zeile(p[1])+"</li>"); return; }
    if(liste){ aus.push("</ul>"); liste=null; }
    if(t) aus.push("<p>"+zeile(t)+"</p>");
  });
  if(liste) aus.push("</ul>");
  return aus.join("");
}

/* ============================================================
   DER DIALOG ALS BAUSTEIN — zwei Ebenen

   Ebene 1  feldMalen / felderMalen — eine Gruppe Eigenschaften
            im Format {schl, nm, art, optionen}. Dasselbe Format
            benutzen die Workflow-Vorlagen in VORLAGEN, deshalb
            kommt Schritt 6 mit dieser Ebene allein aus.
   Ebene 2  dialog — die Hülle darum: Kopf, Fuß, Escape, Klick
            daneben, Löschen mit Rückfrage, Prüfung.
   ============================================================ */
function feldMalen(def, wert, setzen){
  const breit = def.art==="mehrzeilig" || def.breit;
  const f=el("div","dfeld"+(breit?" breit":"")+(def.art==="schalter"?" schalter":""));
  let n, huelle=null;
  if(def.art==="mehrzeilig"){ n=el("textarea"); n.value=wert==null?"":wert; }
  else if(def.art==="auswahl"||def.art==="kontakt"){
    n=el("select");
    const opt = def.art==="kontakt"
      ? [["","— keiner —"]].concat(KONTAKTE.slice().sort(nachNachnamen).map(k=>[k.id,knm(k)]))
      : [["","— ohne —"]].concat(def.optionen||[]);
    opt.forEach(([w,t])=>{ const o=el("option",null,esc(t)); o.value=w;
      if(String(w)===String(wert==null?"":wert)) o.selected=true; n.appendChild(o); });
  }
  else if(def.art==="schalter"){ n=el("input"); n.type="checkbox"; n.checked=!!wert; }
  else {
    n=el("input");
    n.type = def.art==="datum" ? "date" : def.art==="zeit" ? "time"
           : def.art==="zahl"  ? "number" : "text";
    n.value = wert==null ? "" : wert;
  }
  n.id="fd-"+def.schl+"-"+(++idZaehler);
  const lab=el("label",null,esc(def.nm)+(def.sub?'<span class="sub">'+esc(def.sub)+'</span>':""));
  lab.setAttribute("for",n.id);

  if(def.art==="mehrzeilig" && def.ohneLeiste!==true){
    huelle=el("div","mdfeld");
    huelle.append(mdLeiste(n), n);
    f.append(lab,huelle);
  }
  else if(def.art==="schalter") f.append(n,lab);
  else f.append(lab,n);

  n.oninput=n.onchange=()=>setzen(
    def.art==="schalter" ? n.checked
    : def.art==="zahl"   ? (n.value===""?null:Number(n.value))
    : n.value);
  f.dazu={knoten:n, def:def};
  return f;
}

function mdLeiste(ta){
  const l=el("div","mdleiste");
  l.setAttribute("role","toolbar");
  l.setAttribute("aria-label","Formatierung");
  MDTAT.forEach(def=>{
    if(def.strich){ l.appendChild(el("span","mdstrich")); return; }
    const b=el("button","mdknopf",IK[def.zeichen]);
    b.type="button";
    b.title=def.nm+(def.taste?"  Strg+"+def.taste.toUpperCase():"");
    b.setAttribute("aria-label",def.nm);
    b.onclick=e=>{ e.preventDefault(); mdAnwenden(ta,def); };
    l.appendChild(b);
  });
  l.appendChild(el("span","sp"));
  /* Vorschau ist ein Blick, kein Zustand: Sie ersetzt das Feld,
     solange sie an ist, und gibt es unverändert zurück. */
  const vor=el("div","mdvor"); vor.hidden=true;
  const schau=el("button","mdschau","Vorschau");
  schau.type="button"; schau.setAttribute("aria-pressed","false");
  schau.onclick=()=>{
    const an = schau.getAttribute("aria-pressed")!=="true";
    schau.setAttribute("aria-pressed",String(an));
    if(an) vor.innerHTML=mdMalen(ta.value);
    vor.hidden=!an; ta.hidden=an;
    if(!an) ta.focus();
  };
  l.appendChild(schau);
  ta.after ? null : null;
  /* Die Vorschau wird gleich hinter das Feld gehängt, sobald es hängt. */
  setTimeout(()=>{ if(ta.parentNode && !vor.parentNode) ta.after(vor); },0);

  ta.addEventListener("keydown",e=>{
    if(!(e.metaKey||e.ctrlKey)) return;
    const def=MDTAT.find(d=>d.taste===e.key.toLowerCase());
    if(def){ e.preventDefault(); e.stopPropagation(); mdAnwenden(ta,def); }
  });
  return l;
}

function felderMalen(felder, werte, beiAenderung){
  const r=el("div","draster");
  r.felder=[];
  felder.forEach(def=>{
    const f=feldMalen(def, werte[def.schl], v=>{
      werte[def.schl]=v; f.classList.remove("schief");
      if(beiAenderung) beiAenderung(werte, def);
    });
    r.felder.push(f); r.appendChild(f);
  });
  return r;
}

let dlgOffen=null;
function dialogZu(){ if(dlgOffen){ dlgOffen.remove(); dlgOffen=null; } }

function dialog(o){
  dialogZu();
  /* Am Entwurf wird gearbeitet, nie an den echten Daten. Sonst
     hinterließe „Abbrechen“ die halbe Eingabe im Datenbestand. */
  const w=Object.assign({}, o.werte);
  const titel=()=> (typeof o.titel==="function" ? o.titel(w) : o.titel) || "—";

  const d=el("div","dlg");
  d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
  d.setAttribute("aria-label", o.art||"Dialog");

  const kopf=el("div","dlg-k",'<span class="art">'+esc(o.art||"")+'</span>'
    +'<h2 class="dlg-t">'+esc(titel())+'</h2><span class="sp"></span>');
  const zu=el("button","dlg-zu","×");
  zu.setAttribute("aria-label","Schließen"); zu.onclick=dialogZu;
  kopf.appendChild(zu);
  d.appendChild(kopf);

  const rumpf=el("div","dlg-b");
  const raster=felderMalen(o.felder, w, ()=>{
    const t=d.querySelector(".dlg-t"); if(t) t.textContent=titel();
  });
  rumpf.appendChild(raster);
  if(o.merk) rumpf.appendChild(el("div","merk",o.merk));
  d.appendChild(rumpf);

  const fuss=el("div","dlg-f");
  if(o.loeschen){
    const lo=el("button","tat weg","Löschen");
    lo.onclick=()=>dlgLoeschfrage(o,w,rumpf,fuss);
    fuss.appendChild(lo);
  }
  fuss.appendChild(el("span","sp"));
  const ab=el("button","tat still","Abbrechen"); ab.onclick=dialogZu;
  const sp=el("button","tat","Speichern");
  sp.onclick=()=>{
    const schief = o.pruefe ? o.pruefe(w) : null;
    if(schief){
      melde(schief.text||schief);
      /* Das schuldige Feld wird gezeigt, nicht nur gemeldet. */
      const ziel=raster.felder.find(f=>f.dazu.def.schl===schief.schl);
      if(ziel){ ziel.classList.add("schief"); ziel.dazu.knoten.focus(); }
      return;
    }
    o.speichern(w); dialogZu();
  };
  fuss.append(ab,sp);
  d.appendChild(fuss);

  const s=el("div","schleier auf");
  s.appendChild(d);
  s.onclick=ev=>{ if(ev.target===s) dialogZu(); };
  document.body.appendChild(s);
  dlgOffen=s;
  const erstes=d.querySelector("input,textarea,select"); if(erstes) erstes.focus();
  return d;
}

function dlgLoeschfrage(o,w,rumpf,fuss){
  rumpf.innerHTML="";
  rumpf.appendChild(el("div","merk warn",
    typeof o.loeschen.frage==="function" ? o.loeschen.frage(w) : o.loeschen.frage));
  fuss.innerHTML="";
  const ja=el("button","tat weg ernst","Ja, löschen");
  ja.onclick=()=>{ o.loeschen.tun(w); dialogZu(); };
  fuss.appendChild(ja);
  fuss.appendChild(el("span","sp"));
  const nein=el("button","tat still","Doch nicht");
  nein.onclick=()=>dialog(o);
  fuss.appendChild(nein);
}

   2 — DATEN: EINE EINZIGE QUELLE

   Alles Veränderliche liegt in Z. Die Kurznamen darunter sind
   Verweise auf dieselben Arrays — der übrige Code bleibt lesbar,
   aber gesichert wird alles auf einen Schlag.

   Regel: nie neu zuweisen. Immer an Ort und Stelle ändern
   (push, splice, Feld setzen), sonst reißt der Verweis ab.
   Dafür gibt es ersetze().
   ============================================================ */
/* ============================================================
   WORKFLOW-VORLAGE

   Ein Workflow ist eine Schablone: feste Teilschritte in fester
   Reihenfolge, dazu Eigenschaften — auf Instanz- und auf
   Schrittebene. Die Vorlage trägt nur Namen und Feldarten,
   keine Werte.

   Eine Instanz ist eine Ausprägung davon: gleiche Schritte,
   gleiche Eigenschaften, eigene Werte.

   Vorlagen stehen fest im Code. Ein Editor dafür ist bewusst
   nicht vorgesehen — erst wenn ein Ablauf sich eingespielt hat,
   weiß man, was ein Editor können müsste.

   Zwei Felder sind eingebaut und nicht abwählbar:
     Instanz     titel   — sonst ist sie in Listen nicht auffindbar
     Teilschritt frist   — sonst wüsste niemand, was überfällig ist

   Der Status ergibt sich aus der Position: Es gibt genau einen
   aktiven Schritt. Alles davor ist erledigt, alles danach offen.
   Deshalb speichert die Instanz nur den Schlüssel des aktiven
   Schritts — nicht dessen Position. Eine Position würde brechen,
   sobald jemand die Vorlage ändert.
   ============================================================ */

const Z = (()=>{
  const gesichert = store.get("db", null);
  const frisch = vorgabe();
  if(!gesichert) return frisch;
  /* Fehlende Bereiche aus der Vorgabe ergänzen — so überlebt eine
     alte Sicherung das Hinzufügen eines neuen Moduls. */
  Object.keys(frisch).forEach(k=>{ if(gesichert[k]===undefined) gesichert[k]=frisch[k]; });
  gesichert.format = 1;

/* Kurznamen: dieselben Arrays, nicht Kopien */
const KONTAKTE=Z.kontakte, WORKFLOWS=Z.workflows, BAUSTEINE=Z.bausteine,
      APPS=Z.apps, MARKEN=Z.marken, PINS=Z.pins, BAUM=Z.baum;

/* Inhalt austauschen, ohne den Verweis zu zerreißen */
function ersetze(ziel, neu){ ziel.length=0; neu.forEach(x=>ziel.push(x)); }

/* Beide vertragen einen fehlenden Vornamen: Pflicht ist nur der
   Nachname, und ohne diese Absicherung liefert ini() „undefinedM“. */
const knm=k=>((k.vor||"")+" "+(k.nach||"")).trim();
const kfind=id=>KONTAKTE.find(k=>k.id===id);
const ini=k=>(((k.vor||"")[0]||"")+((k.nach||"")[0]||"")).toUpperCase()||"?";
/* Der einzige Weg, einen Kontakt für die Anzeige aufzulösen.
   Kontakte sind das Rückgrat — Notizen, Aufgaben, Termine und
   Workflows verweisen darauf. Zeigt ein Verweis ins Leere, darf das
   die Zeichnung nicht abbrechen, sondern nur nichts anzeigen. */
const kname=id=>{ const k=id?kfind(id):null; return k?knm(k):""; };
/* tel: verträgt keine Leerzeichen und Bindestriche. */
const telUri=t=>"tel:"+String(t||"").replace(/[^\d+]/g,"");
/* Der aktive Schritt und alles, was daraus folgt */
function wfSchritte(w){ const v=wfVorlage(w.vorlage); return v ? v.schritte : []; }
function wfIndex(w){ return wfSchritte(w).findIndex(s=>s.schl===w.aktiv); }
function wfAktiv(w){ const i=wfIndex(w); return i<0 ? null : wfSchritte(w)[i]; }
function wfFrist(w){ const a=wfAktiv(w); return a && w.schritte[a.schl] ? w.schritte[a.schl].frist : null; }
function wfSpaet(w){ const f=wfFrist(w); return !!f && f<HEUTE; }
function wfFertig(w){ return wfIndex(w)<0; }          /* aktiv zeigt ins Leere = durch */
function wfStand(w){
  const l=wfSchritte(w), i=wfIndex(w);
  if(i<0) return "abgeschlossen";
  return "Schritt "+(i+1)+" von "+l.length+" · "+l[i].nm;
}
/* Lage eines Schritts ergibt sich aus der Position, nicht aus einem Feld */
function wfLage(w, schl){
  const l=wfSchritte(w), i=wfIndex(w), j=l.findIndex(s=>s.schl===schl);
  if(i<0) return "fertig";
  if(j<i) return "fertig";
  if(j>i) return "offen";
  return wfSpaet(w) ? "spaet" : "aktiv";
}

/* Eindeutige Kennungen, auch bei schneller Eingabe */
let idZaehler=0;
function neueId(p){ return p+"-"+Date.now().toString(36)+"-"+(++idZaehler); }

/* ============================================================
   3 — DAS MODULREGISTER

   Hier liegt der eigentliche Trick. Kein Modul wird von der
   Leiste oder vom Planner namentlich gekannt. Jedes Modul meldet
   sich selbst an und sagt dabei drei Dinge:

     suche(q)    liefert Treffer für die Leiste
     erfassen(d) liefert Angebote, wenn nichts gefunden wurde
     flaeche(b)  zeichnet eine eigene Oberfläche, falls nötig

   Ein neues Modul ist damit ein Objekt in dieser Liste — an der
   Leiste, am Planner und an der Navigation ändert sich nichts.
   Outliner und Code-Beautifier unten sind genau so entstanden.
   ============================================================ */
const MODULE=[];
function registriere(m){ MODULE.push(m); return m; }
function modul(id){ return MODULE.find(m=>m.id===id); }

/* Treffer-Bausatz für die Leiste */
function treff(art,titel,meta,taste,fn){
  return {art,titel,meta,taste:taste||"↵",fn};
}

/* ===== MODUL kontakte ===== */
registriere({
  id:"kontakte", nr:"02", nm:"Kontakte",
  zahl:()=>KONTAKTE.length,
  /* Favoriten ab dem ersten Buchstaben, übrige ab dem dritten.
     Ein Kontakt liefert zwei eigenständige Treffer. */
  /* Treffer für die Leiste. Favoriten ab dem ersten Buchstaben, übrige
     ab dem dritten; Favoriten stehen oben. Ein Kontakt liefert einen
     Treffer je hinterlegtem Weg — wer weder Nummer noch Adresse hat,
     bekommt stattdessen einen Treffer, der ihn im Modul zeigt. Sonst
     fiele er aus der Suche heraus, ohne woanders aufzutauchen. */
  suche(q){
    const out=[];
    KONTAKTE.filter(k=>{
      const f=(knm(k)+" "+(k.firma||"")).toLowerCase();
      if(!f.includes(q)) return false;
      return k.fav ? q.length>=1 : q.length>=3;
    }).sort((a,b)=> (a.fav===b.fav) ? nachNachnamen(a,b) : (a.fav?-1:1))
    .forEach(k=>{
      const wo=(k.firma||"")+(k.fav?" · Favorit":"");
      if(k.tel) out.push(treff("Anrufen",knm(k),k.tel+(wo?" · "+wo:""),"↵",
        ()=>{ oeffneWeg(telUri(k.tel)); melde("Anruf an "+k.tel+" übergeben"); }));
      if(k.mail) out.push(treff("Mailen",knm(k),k.mail,"↵",
        ()=>{ oeffneWeg("mailto:"+k.mail); melde("Mail an "+k.mail+" übergeben"); }));
      if(!k.tel&&!k.mail) out.push(treff("Kontakt",knm(k),
        (wo?wo+" · ":"")+"kein Weg hinterlegt","↵",()=>zeigeFlaeche("kontakte")));
    });
    return out;
  },
  erfassen(d){ return [treff("Kontakt",d.titel,"als neuer Kontakt anlegen","↵",
    ()=>kontaktDialog(null, d.titel))]; },

  flaeche(b){
    const q=kSuche.trim().toLowerCase();
    const passt=k=>!q||((knm(k)+" "+(k.firma||"")+" "+(k.tel||"")+" "+(k.mail||"")
      +" "+(k.notiz||"")).toLowerCase().includes(q));
    const fav=KONTAKTE.filter(k=>k.fav&&passt(k)).sort(nachNachnamen);
    const rest=KONTAKTE.filter(k=>!k.fav&&passt(k)).sort(nachNachnamen);

    b.appendChild(abschnitt("Kontakte", String(KONTAKTE.length)));
    b.appendChild(kSuchfeld());

    if(q){
      /* Ein einziger Ergebnisraum, Favoriten zuoberst. */
      b.appendChild(abschnitt("Gefunden",(fav.length+rest.length)+" von "+KONTAKTE.length));
      if(!fav.length&&!rest.length){
        b.appendChild(el("div","leer","Kein Kontakt passt zu „"+esc(kSuche)+"“."));
        return;
      }
      if(fav.length){
        b.appendChild(el("div","hinweis","Favoriten stehen auch im Suchergebnis oben."));
        b.appendChild(kachelraster(fav));
      }
      if(rest.length){
        if(fav.length) b.appendChild(abschnitt("Weitere",String(rest.length)));
        b.appendChild(kachelraster(rest));
      }
      return;
    }

    b.appendChild(abschnitt("Favoriten", fav.length?String(fav.length):null, "jetzt"));
    if(fav.length){
      b.appendChild(el("div","hinweis",
        "Diese stehen in der Leiste als direkt verwendbare Kontakte."));
      b.appendChild(kachelraster(fav));
    } else b.appendChild(el("div","leer",
      "Noch kein Favorit. Der Stern auf einer Kachel macht einen daraus."));

    const a=abschnitt("Alle Kontakte", null);
    const neu=el("button","n","neuer Kontakt +");
    neu.onclick=()=>kontaktDialog(null);
    a.appendChild(neu);
    b.appendChild(a);
    if(rest.length) b.appendChild(kachelraster(rest));
    else b.appendChild(el("div","leer","Außer den Favoriten ist niemand erfasst."));
  }
});

/* Suchstand des Moduls. Bewusst außerhalb von Z: Er beschreibt die
   Ansicht, nicht die Daten, und hat in einer Sicherung nichts verloren. */
let kSuche="";
function kSuchfeld(){
  const s=el("div","msuche",'<span class="lupe">'+IK.lupe+'</span>');
  const i=el("input");
  i.type="text"; i.value=kSuche;
  i.placeholder="Kontakte durchsuchen — Name, Firma, Nummer, Mail";
  i.setAttribute("aria-label","Kontakte durchsuchen");
  i.oninput=()=>{
    const stelle=i.selectionStart;
    kSuche=i.value; male();
    /* male() baut die Fläche neu auf; das Feld ist danach ein anderes. */
    const n=document.querySelector(".msuche input");
    if(n){ n.focus(); n.setSelectionRange(stelle,stelle); }
  };
  s.appendChild(i);
  if(kSuche){
    const w=el("button","weg","zurücksetzen");
    w.onclick=()=>{ kSuche=""; male(); };
    s.appendChild(w);
  }
  return s;
}

/* ---------- Der Kontaktdialog ----------
   Bewusst kontaktspezifisch. In Schritt 2 der Roadmap wird daraus der
   gemeinsame Baustein — die Felder sind deshalb schon in seinem Format
   beschrieben: {schl, nm, art}. Dasselbe Format tragen die
   Eigenschaften der Workflow-Vorlagen. */
const KFELDER=[
  {schl:"nach",  nm:"Nachname", art:"text"},
  {schl:"vor",   nm:"Vorname",  art:"text"},
  {schl:"firma", nm:"Firma",    art:"text"},
  {schl:"tel",   nm:"Telefon",  art:"text"},
  {schl:"mail",  nm:"E-Mail",   art:"text"},
  {schl:"notiz", nm:"Notizen",  art:"mehrzeilig"},
  {schl:"fav",   nm:"Als Favorit markieren", art:"schalter",
   sub:"Favoriten stehen im Modul und in der Leiste oben."}
];
const KLEER={id:null,nach:"",vor:"",firma:"",tel:"",mail:"",fav:false,notiz:""};

/* Der ganze Dialog ist jetzt ein Aufruf. Kopf, Fuß, Escape, Klick
   daneben, Löschrückfrage und Prüfung stecken im Baustein. */
function kontaktDialog(k, vorbelegt){
  const neu=!k;
  const start=Object.assign({}, KLEER, k||{});
  if(neu&&vorbelegt) start.nach=vorbelegt;
  dialog({
    art: neu ? "Neuer Kontakt" : "Kontakt bearbeiten",
    titel: w=>knm(w),
    felder: KFELDER,
    werte: start,
    merk: "<b>Pflicht ist nur der Nachname.</b> Alles Übrige darf leer bleiben. Fehlt eine "
      +"Nummer oder eine Adresse, bleibt der zugehörige Knopf auf der Kachel sichtbar, "
      +"aber blass und ohne Wirkung.",
    pruefe: w=>String(w.nach||"").trim() ? null
      : {schl:"nach", text:"Ohne Nachnamen geht es nicht."},
    loeschen: neu ? null : {
      frage: w=>{
        const n=kVerweise(k.id,false);
        return "<b>"+esc(knm(w))+" wirklich löschen?</b><ul>"
          +"<li>Die Kachel verschwindet aus dem Modul und aus der Leiste.</li>"
          +"<li>"+(n
            ? n+" Verweis"+(n>1?"e":"")+" in Aufgaben, Terminen, Notizen und Workflows "
              +"werden geleert — auch in den Teilschritten der Workflows."
            : "Kein Eintrag verweist auf diesen Kontakt.")+"</li>"
          +"<li>Die Einträge selbst bleiben erhalten. Es verschwindet nur der Name daneben.</li>"
          +"</ul>";
      },
      tun: ()=>kLoeschen(k)
    },
    speichern: w=>kSpeichern(w,neu)
  });
}

function kSpeichern(w,neu){
  ["nach","vor","firma","tel","mail"].forEach(s=>w[s]=String(w[s]||"").trim());
  if(neu){ w.id=neueId("k"); KONTAKTE.push(w); }
  else {
    /* An Ort und Stelle ändern. Ein Austausch des Eintrags im Array
       risse die Verweise ab, die anderswo auf dieses Objekt zeigen. */
    const z=kfind(w.id);
    if(!z){ melde("Der Kontakt ist nicht mehr da."); male(); return; }
    Object.keys(KLEER).forEach(s=>{ z[s]=w[s]; });
  }
  bewahre(); male();
  melde(knm(w)+(neu?" angelegt":" gespeichert"));
}

/* ---------- Verweise auf einen Kontakt ----------
   Mit leeren=false wird nur gezählt, sonst auf null gesetzt.

   Die betroffenen Schlüssel der Workflows stehen absichtlich nicht
   fest im Code. Sie ergeben sich aus VORLAGEN — aus jeder Eigenschaft
   mit art:"kontakt", auf Instanz- wie auf Teilschrittebene. Fest
   eingetragene Namen brächen still, sobald eine Vorlage wächst. */
function kVerweise(id, leeren){
  let n=0;
  const pruef=(o,s)=>{ if(o&&o[s]===id){ n++; if(leeren) o[s]=null; } };
  [DATEN.termine, DATEN.aufgaben, DATEN.notizen].forEach(l=>
    l.forEach(x=>pruef(x,"kontakt")));
  WORKFLOWS.forEach(w=>{
    const v=wfVorlage(w.vorlage); if(!v) return;
    (v.eigenschaften||[]).forEach(e=>{
      if(e.art==="kontakt") pruef(w.werte, e.schl); });
    (v.schritte||[]).forEach(s=>{
      const st=w.schritte&&w.schritte[s.schl];
      (s.eigenschaften||[]).forEach(e=>{
        if(e.art==="kontakt") pruef(st&&st.werte, e.schl); });
    });
  });
  return n;
}

function kLoeschen(k){
  const nm=knm(k), n=kVerweise(k.id,true);
  const i=KONTAKTE.indexOf(k);
  if(i>=0) KONTAKTE.splice(i,1);       /* splice, nie neu zuweisen */
  bewahre(); male();
  melde(nm+" gelöscht"+(n?" · "+n+" Verweis"+(n>1?"e":"")+" geleert":""));
}

registriere({
  id:"aufgaben", nr:"04", nm:"Aufgaben",
  zahl:()=>DATEN.aufgaben.filter(a=>!a.fertig).length,
  suche(q){
    return DATEN.aufgaben.filter(a=>a.titel.toLowerCase().includes(q)).map(a=>

        (a.kat==="nach"?"Nachverfolgen":"To-do")+" · "+frist(a),"↵",
        ()=>{ a.fertig=!a.fertig; bewahre();
          melde(a.fertig?"Abgehakt: "+a.titel:"Wieder offen: "+a.titel); }),{bleibt:true}));
  },
  /* Legt bewusst sofort an, statt den Dialog zu öffnen. Eine Aufgabe aus
     „Rückruf Kanzlei ? mo“ ist auf der Stelle brauchbar — das ist der Sinn
     der Leiste. Bei Kontakten ist es umgekehrt, ein bloßer Name genügt nicht. */
  erfassen(d){

        d:d.datum,zeit:d.zeit,notiz:"",kontakt:null,fertig:false});
        bewahre(); melde("Aufgabe angelegt"); })];
  },
  flaeche(b){
    [["todo","To-do","Was du selbst abarbeitest."],
     ["nach","Nachverfolgen","Was bei anderen liegt und beobachtet wird."]].forEach(([kat,nm,sub])=>{
      const l=DATEN.aufgaben.filter(a=>a.kat===kat&&!a.fertig)
        .sort((x,y)=>(x.d||"9999")<(y.d||"9999")?-1:1);
      const k=abschnitt(nm,null);
      const neu=el("button","n","neue Aufgabe +");
      neu.onclick=()=>aufgabeDialog(null,kat);
      k.appendChild(neu);
      b.appendChild(k);
      b.appendChild(el("div","hinweis",sub));
      if(!l.length) b.appendChild(el("div","leer","Nichts offen."));
      l.forEach(a=>b.appendChild(aufgabeZeile(a)));
    });

    /* Erledigte verschwinden nicht, sie ziehen um. Hier haben sie
       ihren Platz und hier lassen sie sich gesammelt wegräumen. */
    const fertig=DATEN.aufgaben.filter(a=>a.fertig)
      .sort((x,y)=>(y.d||"")<(x.d||"")?-1:1);
    const kf=abschnitt("Erledigt", fertig.length?null:"nichts");
    if(fertig.length){
      const alle=el("button","n","alle "+fertig.length+" löschen");
      alle.onclick=()=>erledigteLoeschen(fertig.length);
      kf.appendChild(alle);
    }
    b.appendChild(kf);
    if(!fertig.length) b.appendChild(el("div","leer",
      "Abgehakte Aufgaben sammeln sich hier, bis du sie löschst."));
    fertig.forEach(a=>b.appendChild(aufgabeZeile(a)));
  }
});

function aufgabeDialog(a, katVor){

      +"Planners und bleibt dort sichtbar, bis sie eingeplant oder abgehakt wird.",
    pruefe: w=>String(w.titel||"").trim()?null:{schl:"titel",text:"Ohne Titel geht es nicht."},
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b><ul>"

function aufgabeZeile(a){
  const r=el("div","z"+(a.fertig?" fertig":"")+(istSpaet(a)?" eilig":""));
  const kast=el("button","kast");
  kast.innerHTML='<svg viewBox="0 0 12 12"><path d="M2 6.2 4.6 9 10 3"/></svg>';
  kast.setAttribute("aria-label",(a.fertig?"Wieder öffnen: ":"Erledigen: ")+a.titel);
  kast.onclick=e=>{ e.stopPropagation(); a.fertig=!a.fertig; bewahre(); male();
    melde(a.fertig?"Abgehakt: "+a.titel:"Wieder offen: "+a.titel); };
  r.appendChild(kast);
  const b=el("button","zb",'<span class="zt">'+esc(a.titel)+'</span>'
    +'<span class="zm">'+esc([a.notiz, kname(a.kontakt)].filter(Boolean).join(" · "))+'</span>');
  b.setAttribute("aria-label","Aufgabe bearbeiten: "+a.titel);

/* Der Tag ist eine Auswahl aus genau zwei Werktagen, kein freies Datum.
   Damit kann ein Termin gar nicht erst irgendwo landen, wo ihn niemand
   sieht — die Regel steckt in der Maske statt in einer Prüfung dahinter.
   Die Liste wird bei jedem Öffnen neu gebaut, weil sich die beiden
   Werktage über Nacht verschieben. */
function tFelder(){
  const [d1,d2]=planTage();
  const nm=d=>TAGL[d.getDay()]+", "+d.getDate()+". "+MONK[d.getMonth()];
  return [
    {schl:"titel", nm:"Titel", art:"text", breit:true},
    {schl:"d",     nm:"Tag", art:"auswahl",
     optionen:[[iso(d1),nm(d1)],[iso(d2),nm(d2)]], sub:"Nur diese beiden Werktage."},
    {schl:"zeit",  nm:"Uhrzeit", art:"zeit"},
    {schl:"dauer", nm:"Dauer in Minuten", art:"zahl"},
    {schl:"kontakt",nm:"Kontakt", art:"kontakt"},
    {schl:"anm",   nm:"Anmerkung", art:"mehrzeilig"}
  ];
}
const TLEER={id:null,d:null,zeit:"09:00",dauer:30,titel:"",anm:"",kontakt:null};

function terminDialog(t, tagVor){
  const neu=!t;
  const start=Object.assign({}, TLEER, t||{});
  if(neu) start.d=tagVor||iso(planTage()[0]);
  dialog({
    art: neu?"Neuer Termin":"Termin bearbeiten",
    titel: w=>w.titel,
    felder: tFelder(),
    werte: start,
    merk: "<b>Termine gibt es nur für den aktuellen und den nächsten Werktag.</b> "
      +"Im Planner lassen sie sich zwischen beiden Tagen hin und her ziehen.",
    pruefe: w=>{
      if(!String(w.titel||"").trim()) return {schl:"titel",text:"Ohne Titel geht es nicht."};
      if(!w.zeit) return {schl:"zeit",text:"Ein Termin braucht eine Uhrzeit."};
      if(!w.d)    return {schl:"d",   text:"Ein Termin braucht einen Tag."};
      return null;
    },
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Der Termin verschwindet aus "
        +"dem Kalender und aus dem Planner. Auf Termine verweist nichts.",
      tun: w=>{ const i=DATEN.termine.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.termine.splice(i,1);
        bewahre(); male(); melde("Termin gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.dauer=Number(w.dauer)>0 ? Number(w.dauer) : 30;
      if(neu){ w.id=neueId("t"); DATEN.termine.push(w); }
      else { const z=DATEN.termine.find(x=>x.id===w.id);
        if(!z){ melde("Der Termin ist nicht mehr da."); male(); return; }
        Object.keys(TLEER).forEach(k=>{ if(k!=="id") z[k]=w[k]; }); }
      bewahre(); male(); melde(neu?"Termin angelegt":"Termin gespeichert");
    }
  });
}

function notizDialog(n, vorbelegt, artVor){
  const neu=!n;
  const jetzt=new Date();
  const start=Object.assign({},NLEER,n||{});
  if(neu){
    start.titel=vorbelegt||"";
    start.art=artVor||"telefon";
    start.d=HEUTE;
    start.zeit=p2(jetzt.getHours())+":"+p2(jetzt.getMinutes());
    /* Datum und Uhrzeit stehen zusätzlich im Text. So wandern sie in die
       .md-Datei und stehen dort, wo man sie beim Lesen sucht. Beim späteren
       Ändern des Datumsfelds wird die Zeile bewusst nicht nachgeschrieben —
       sonst überschriebe sie, was von Hand angepasst wurde. */
    if(start.art==="telefon")
      start.text="**"+datumLang(start.d)+", "+start.zeit+"**\n\n";
  }
  dialog({
    art: neu?"Neue Notiz":"Notiz bearbeiten",
    titel: w=>w.titel,
    felder: nFelder(),
    werte: start,
    merk:"<b>Neue Notizen sind Telefonnotizen</b> — das ist der häufigere Fall. Datum und "
      +"Uhrzeit stehen zusätzlich im Text, damit sie beim Ausleiten als <code>.md</code> "
      +"erhalten bleiben. Ein Anrufer kann aus der Kontaktliste kommen oder frei "
      +"eingetragen werden; wird beides gefüllt, gewinnt die Auswahl.",
    pruefe: w=>String(w.titel||"").trim()?null:{schl:"titel",text:"Ohne Titel geht es nicht."},
    loeschen: neu?null:{
      frage: w=>"<b>„"+esc(w.titel)+"“ wirklich löschen?</b> Auf Notizen verweist nichts, "
        +"es bleibt nirgends etwas zurück. Vorher als <code>.md</code> ausleiten?",
      tun: w=>{ const i=DATEN.notizen.findIndex(x=>x.id===w.id);
        if(i>=0) DATEN.notizen.splice(i,1);
        bewahre(); male(); melde("Notiz gelöscht"); }
    },
    speichern: w=>{
      w.titel=String(w.titel).trim();
      w.wer=String(w.wer||"").trim();
      if(w.kontakt) w.wer="";                  /* Auswahl schlägt Freitext */
      if(neu){ w.id=neueId("n"); DATEN.notizen.push(w); }
      else { const z=DATEN.notizen.find(x=>x.id===w.id);
        if(!z){ melde("Die Notiz ist nicht mehr da."); male(); return; }
        Object.keys(NLEER).forEach(s=>{ if(s!=="id") z[s]=w[s]; }); }
      bewahre(); male(); melde(neu?"Notiz angelegt":"Notiz gespeichert");
    }
  });
}

/* Eine Instanz als Karte: Stand, Frist des aktiven Schritts, Fortschritt */
function wfKarte(w){
  const l=wfSchritte(w), i=wfIndex(w), f=wfFrist(w), spaet=wfSpaet(w);
  const k=el("div","karte");
  k.innerHTML='<div style="display:flex;align-items:baseline;gap:10px">'
    +'<span style="font-size:14.5px;font-weight:650">'+esc(w.titel)+'</span>'
    +'<span style="margin-left:auto;font-family:var(--mono);font-size:11.5px;color:'
    +(spaet?"var(--signal)":"var(--ink3)")+'">'
    +(wfFertig(w) ? "abgeschlossen" : (f ? (spaet?"überfällig":frist({d:f})) : "ohne Frist"))
    +'</span></div>'
    +'<div style="font-size:12.5px;color:var(--ink3);margin-top:5px">'+esc(wfStand(w))
    +(w.werte.kontakt&&kfind(w.werte.kontakt)?" · "+esc(kname(w.werte.kontakt)):"")+'</div>';

  /* Fortschritt als Kette — zeigt sofort, wo der Ablauf steht */
  const kette=el("div");
  kette.style.cssText="display:flex;gap:3px;margin-top:10px";
  l.forEach((sch,j)=>{
    const lage=wfLage(w,sch.schl);
    const t=el("span");
    t.title=(j+1)+". "+sch.nm+" — "+({fertig:"erledigt",aktiv:"aktiv",
      spaet:"aktiv, überfällig",offen:"offen"}[lage]);
    t.style.cssText="flex:1;height:4px;border-radius:3px;background:"
      +({fertig:"var(--gut)",aktiv:"var(--tinte)",spaet:"var(--signal)",
         offen:"var(--raise)"}[lage]);
    kette.appendChild(t);
  });
  k.appendChild(kette);

  if(!wfFertig(w)){
    const t=el("button","tat still", i<l.length-1
      ? "Abschließen und weiter zu „"+l[i+1].nm+"“"
      : "Letzten Schritt abschließen");
    t.style.marginTop="10px";
    t.onclick=()=>{
      if(i<l.length-1){ w.aktiv=l[i+1].schl; melde("Jetzt aktiv: "+l[i+1].nm); }
      else { w.aktiv=null; melde("Vorgang abgeschlossen: "+w.titel); }
      bewahre(); male();
    };
    k.appendChild(t);
  }
  return k;
}

function rechne(text){
  if(!/^[\d\s+\-*/().,%]+$/.test(text)) return null;
  if(!/[+\-*/%]/.test(text)) return null;
  try{
    const w=Function('"use strict";return ('+text.replace(/,/g,".")+')')();
    if(typeof w!=="number"||!isFinite(w)) return null;
    return Math.round(w*1e6)/1e6;
  }catch(e){ return null; }
}

let vorlage=null;

/* ============================================================
   5 — DEUTUNG DER EINGABE
   ============================================================ */
const KUERZEL={so:0,mo:1,di:2,mi:3,"do":4,fr:5,sa:6};
function deuten(text){
  let rest=" "+text+" ";
  const o={};
  if(/(^|\s)\?(\s|$)/.test(rest)){ o.nach=true; rest=rest.replace(/(^|\s)\?(\s|$)/," "); }
  const p=rest.match(/\s@(\S+)/); if(p){ o.person=p[1]; rest=rest.replace(p[0]," "); }
  let z=rest.match(/\s(\d{1,2}):(\d{2})(\s|$)/);
  if(z){ o.zeit=p2(+z[1])+":"+z[2]; rest=rest.replace(z[0]," "); }
  const t=rest.match(/\s(heute|übermorgen|uebermorgen|morgen|mo|di|mi|do|fr)(\s|$)/i);
  if(t){ const w=t[1].toLowerCase(); const h=new Date(); h.setHours(0,0,0,0); let ziel;
    if(w==="heute"){ ziel=h; o.tag="heute"; }
    else if(w==="übermorgen"||w==="uebermorgen"){ ziel=new Date(h);
      ziel.setDate(ziel.getDate()+2); o.tag="übermorgen"; }
    else if(w==="morgen"){ ziel=new Date(h); ziel.setDate(ziel.getDate()+1); o.tag="morgen"; }
    else { ziel=new Date(h); let diff=(KUERZEL[w]-ziel.getDay()+7)%7; if(!diff) diff=7;
      ziel.setDate(ziel.getDate()+diff); o.tag=TAGL[KUERZEL[w]]; }
    o.datum=iso(ziel); rest=rest.replace(t[0]," "); }
  if(o.zeit && !o.datum){ o.datum=iso(planTage()[0]); o.tag="heute"; }
  o.titel=rest.replace(/\s+/g," ").trim();
  return o;
}

/* ============================================================
   6 — DIE LEISTE
   Leer heißt nicht leer: ohne Eingabe stehen hier Überfälliges,
   der nächste Termin und die angehefteten Bookmarks.
   ============================================================ */
let eingabe="", treffer=[], zeiger=-1;

function ueberfaellig(){
  /* Termine mit vergangenem Datum waren vorher nirgends mehr zu
     sehen: der Planner zeigt nur die beiden Werktage, der Vorrat
     nur Aufgaben. Sie standen noch in den Daten, aber unsichtbar.
     Jetzt tauchen sie hier auf und lassen sich zurückholen. */
  const [d1,d2]=planTage(), k1=iso(d1), k2=iso(d2);
  return [].concat(
    /* Termine kennen kein „erledigt“ — ein vergangener Termin ist vorbei,
       nicht abgehakt. Er lässt sich hier nur zurückholen oder löschen. */
    DATEN.termine.filter(t=>t.d && t.d!==k1 && t.d!==k2)
      .map(t=>({typ:"Termin",obj:t,titel:t.titel,verschieben:t,
        m:"war am "+t.d+" um "+t.zeit+(t.anm?" · "+t.anm:"")})),
    DATEN.aufgaben.filter(istSpaet).map(a=>({typ:"Aufgabe",obj:a,titel:a.titel,
      m:(a.notiz||"")+(a.kontakt?" · "+kname(a.kontakt):"")})),
    WORKFLOWS.filter(wfSpaet).map(w=>({typ:"Workflow",obj:w,titel:w.titel,
      m:wfStand(w)}))
  );
}
function naechsterTermin(){
  const n=nowMin();
  return DATEN.termine.filter(t=>t.d===HEUTE && toMin(t.zeit)+t.dauer>n)
    .sort((a,b)=>toMin(a.zeit)-toMin(b.zeit))[0]||null;
}

function leisteMalen(rumpf){
  const b=el("div","mitte");
  const s=el("div","schwelle");
  const f=el("div","feld",'<span class="c">›</span>'
    +'<input id="q" type="text" autocomplete="off" spellcheck="false" '
    +'placeholder="Tippen — suchen, rechnen, erfassen" aria-label="Suchen oder erfassen">'
    +'<span class="k">ESC leert</span>');
  s.appendChild(f); b.appendChild(s);
  const erg=el("div"); erg.id="erg"; b.appendChild(erg);
  rumpf.appendChild(b);
  const q=$("#q"); q.value=eingabe;
  q.addEventListener("input",e=>{ eingabe=e.target.value; suchen(); });
  suchen();
  setTimeout(()=>q.focus(),20);
}

function suchen(){
  const erg=$("#erg"); if(!erg) return;
  erg.innerHTML=""; treffer=[]; zeiger=-1;
  const roh=eingabe.trim(), q=roh.toLowerCase();

  if(!roh){ ruhezustand(erg); return; }

  const rz=rechne(roh);
  if(rz!==null) erg.appendChild(el("div","rechner",'<div class="frage">'+esc(roh)+' =</div>'
    +'<div class="zahl">'+String(rz).replace(".",",")+'</div>'));

  /* Jedes Modul wird gefragt — die Leiste kennt keines beim Namen */
  MODULE.forEach(m=>{ if(m.suche) (m.suche(q,roh)||[]).forEach(t=>zeigeTreffer(erg,t)); });

  if(roh.length>=3){
    const d=deuten(roh);
    if(d.titel){
      erg.appendChild(abschnitt("Erfassen",null));
      MODULE.forEach(m=>{ if(m.erfassen) (m.erfassen(d)||[]).forEach(t=>zeigeTreffer(erg,t)); });
      zeigeTreffer(erg,treff("Kopieren",d.titel,"in die Zwischenablage","↵",
        ()=>melde("Kopiert: "+d.titel)));
    }
  }
  if(!treffer.length) erg.appendChild(el("div","leer","Nichts gefunden."));
  zeiger=treffer.length?0:-1; markiere();
}
function zeigeTreffer(box,t){
  const n=el("button","tr",'<span class="tr-a">'+esc(t.art)+'</span>'
    +'<span class="tr-b"><span class="tr-t">'+esc(t.titel)+'</span>'
    +(t.meta?'<span class="tr-m">'+esc(t.meta)+'</span>':'')+'</span>'
    +'<span class="tr-k">'+esc(t.taste)+'</span>');
  n.onclick=()=>{ t.fn(); if(t.bleibt) suchen(); else { eingabe=""; male(); } };
  box.appendChild(n); treffer.push(n);
}
function markiere(){
  treffer.forEach((n,i)=>n.classList.toggle("wahl",i===zeiger));
  if(zeiger>=0&&treffer[zeiger]) treffer[zeiger].scrollIntoView({block:"nearest"});
}

function ruhezustand(box){
  const sp=ueberfaellig();
  if(sp.length){
    box.appendChild(abschnitt("Überfällig",String(sp.length),"eilig"));
    sp.forEach(x=>{
      const r=zeile(x.obj,{titel:x.titel,meta:x.typ+" · "+x.m,
        rechts:x.verschieben?"":"überfällig",k:"eilig",hakbar:x.typ==="Aufgabe"});
      if(x.verschieben){
        const t=el("button","tat still","auf heute holen");
        t.onclick=ev=>{ ev.stopPropagation();
          x.verschieben.d=iso(planTage()[0]); bewahre(); male();
          melde('"'+x.titel+'" liegt jetzt auf heute'); };
        r.appendChild(t);
        /* Der zweite Weg heraus. Termine kennen kein Abhaken, also
           bleibt nur zurückholen oder löschen — sonst stünde ein
           vergangener Termin hier für immer. */
        const w=el("button","tat weg","löschen");
        w.onclick=ev=>{ ev.stopPropagation(); terminDialog(x.verschieben); };
        w.style.marginLeft="4px";
        r.appendChild(w);
      }
      box.appendChild(r);
    });
  }
  const nt=naechsterTermin();
  box.appendChild(abschnitt(nt?"Als Nächstes":"Heute",null,"jetzt"));
  const w=el("div");
  if(nt){
    const diff=toMin(nt.zeit)-nowMin();
    w.innerHTML='<div class="naechst-t">'+esc(nt.titel)+'</div><div class="naechst-m">'
      +esc((nt.anm||"")+(nt.kontakt?" · "+kname(nt.kontakt):"")+" · "
      +(diff>0?"in "+diff+" Minuten":"läuft gerade"))+'</div>';
  } else w.innerHTML='<div class="naechst-t">Kein Termin mehr.</div>'
    +'<div class="naechst-m">Der Rest des Tages gehört dir.</div>';
  box.appendChild(w);

  /* Favoriten stehen zwischen dem nächsten Termin und den Bookmarks:
     erst was drängt, dann wen man am häufigsten braucht, dann der Rest. */
  const favK=KONTAKTE.filter(k=>k.fav).sort(nachNachnamen);
  /* Der Schmierzettel steht hier, weil die Leiste von oben nach unten
     von „drängt“ zu „liegt bereit“ geht — und er das Einzige ist, in
     das man schreibt. Derselbe Text steht groß im Modul Notizen. */
  const sa=abschnitt("Schmierzettel",null);
  const zumModul=el("button","n","Notizen ›");
  zumModul.onclick=()=>zeigeFlaeche("notizen"); sa.appendChild(zumModul);
  box.appendChild(sa);
  box.appendChild(schmierKlein());

  const fa=abschnitt("Favoriten",null);
  const alleK=el("button","n","alle "+KONTAKTE.length+" ›");
  alleK.onclick=()=>zeigeFlaeche("kontakte"); fa.appendChild(alleK);
  box.appendChild(fa);
  if(favK.length) box.appendChild(kachelraster(favK));
  else box.appendChild(el("div","leer",
    "Noch kein Favorit. Im Modul Kontakte den Stern auf einer Kachel setzen — "
    +"dann steht der Kontakt hier."));

  const a=abschnitt("Bookmarks",null);
  const alle=el("button","n","alle "+MARKEN.length+" ›");
  alle.onclick=()=>zeigeFlaeche("marken"); a.appendChild(alle);
  box.appendChild(a);
  const g=el("div","marken");
  PINS.forEach((u,i)=>{
    const m=MARKEN.find(x=>x.u===u); if(!m) return;
    const n=el("button","mk",'<b>⌘'+(i+1)+'</b><span>'+esc(m.t)+'</span>');
    n.onclick=()=>melde("Öffne "+m.t); g.appendChild(n);
  });
  if(!PINS.length) g.appendChild(el("div","leer","Nichts angeheftet."));
  box.appendChild(g);

  box.appendChild(abschnitt("Module",MODULE.filter(m=>!m.versteckt).length+" angemeldet"));
  box.appendChild(el("div","hinweis",
    "Diese Liste erzeugt sich aus dem Register. Ein neues Modul erscheint hier von selbst."));
  const ml=el("div","modliste");
  MODULE.filter(m=>!m.versteckt).sort((a,b)=>a.nr<b.nr?-1:1).forEach(m=>{
    const n=el("button","ml",'<b>'+esc(m.nr)+'</b><span>'+esc(m.nm)+'</span>'
      +(m.zahl?'<em>'+m.zahl()+'</em>':''));
    n.onclick=()=> m.flaeche ? zeigeFlaeche(m.id) : melde(m.nm+" — keine eigene Fläche");
    ml.appendChild(n);
  });
  box.appendChild(ml);
  const pl=el("button","ml",'<b>07</b><span>Planner öffnen</span><em>⌘P</em>');
  pl.onclick=()=>zeigeFlaeche("planner");
  ml.appendChild(pl);
}
